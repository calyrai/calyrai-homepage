<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calyr.ai – Explore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore the Calyr.ai project constellation." />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/explore.css" />
  <link rel="stylesheet" href="css/contact_dialog.css?v=20260319f" />

  <script src="js/collect_hearts.js" defer></script>
  <script src="js/orbit_logo.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
  <script src="js/qr_noise.js?v=20260319f" defer></script>
  <script src="js/contact_dialog.js?v=20260319f" defer></script>
</head>

<body>
<header class="site-header">
  <div class="nav-inner">
    <div class="nav-left-row">
      <a href="index.html" class="nav-pill glow-nav">
        Calyr.ai – platform technology
      </a>
      <a href="explore.html" class="nav-pill glow-nav" aria-current="page">Explore</a>
      <a href="team.html" class="nav-pill glow-nav">Team</a>
    </div>

    <nav class="nav-links" aria-label="Primary">
      <a href="https://bsky.app/profile/calyrai.bsky.social" class="nav-pill glow-nav">Follow</a>
      <a href="mailto:rupert.tscheliessnig@calyr.ai?subject=Contact&body=" class="nav-pill glow-nav">Contact</a>
      <a href="index.html#impressum" class="nav-pill glow-nav">Impressum</a>
    </nav>
  </div>
</header>

<main class="explore-page">
  <section class="explore-shell" aria-label="Explore map">
    <div class="explore-header">
      <div class="explore-kicker">Calyr.ai / Explore</div>
      <h1 class="explore-title">Research constellation</h1>
      <p class="explore-subtitle">Drag to pan, scroll to zoom. Click nodes to expand the constellation. Your arrangement persists on this device.</p>
    </div>

    <div class="explore-stage" id="explore-stage">
      <svg id="explore-svg" class="explore-svg" role="img" aria-label="Interactive project map"></svg>
    </div>

    <div class="explore-links" aria-label="Project links">
      <!-- JS populates a minimal accessible link list -->
    </div>
  </section>
</main>

<script defer src="data/projects.js"></script>
<script defer src="js/explore_map.js"></script>

<dialog id="contact-dialog" class="contact-dialog" aria-label="Contact">
  <div class="contact-dialog__frame" data-contact-swipe>
    <div class="contact-dialog__track">
      <section class="contact-dialog__panel contact-dialog__panel--qr" aria-label="QR">
        <div class="contact-dialog__swipe-right" aria-hidden="true"></div>
        <button type="button" class="qr-noise-widget" data-qr-noise data-qr-yaml="/data/contact.yaml" data-qr-text="https://calyr.ai/" data-qr-size="340" aria-label="QR">
          <canvas class="qr-noise-canvas" width="300" height="300" aria-hidden="true"></canvas>
        </button>
      </section>

      <section class="contact-dialog__panel contact-dialog__panel--email" aria-label="Email">
        <a id="contact-dialog-email" data-contact-direct-mail href="mailto:rupert.tscheliessnig@calyr.ai?subject=Contact&body=" class="contact-dialog__email">rupert.tscheliessnig@calyr.ai</a>
      </section>
    </div>
  </div>
</dialog>
</body>
</html>
