schema_version: 1

# Nexus configuration (source of truth).
# Used by: scripts/build_nexus_yaml.py

identity:
  name: Rupert Tscheliessnig
  role: Scientific ML & Structural Biophysics
  focus: SAXS, PCA, Representation Learning
  contact:
    email: rupert.tscheliessnig@calyr.ai
    bluesky: https://bsky.app/profile/calyrai.bsky.social

# The central “Nexus” node.
core_node:
  id: saxs_state_inference
  title: SAXS Representation & State Inference
  subtitle: ML-based interpretation of scattering data
  url: projects/pca_free_energy.html
  color: "#ff4df5"
  description:
    - SAXS signal decomposition
    - PCA-based state identification
    - Structural interpretation
    - Thermodynamic mapping

# Optional: if omitted, scripts/build_nexus_yaml.py falls back to src/data/projects_public.yaml.
projects:
  - id: saxs
    title: SAXS – Multi-State Structural Analysis
    url: projects/exp_nodes_pr_iq_peaks.html
  - id: saxs-interface
    title: SAXS Interface
    url: projects/saxs_interface.html
  - id: epistemic-damage
    title: Epistemic Damage
    url: projects/epistemic_damage.html
  - id: redgem
    title: RedGEM
    url: projects/redgem.html
  - id: pca
    title: PCA & Free-Energy Modes
    url: projects/pca_free_energy.html
  - id: itc-data
    title: ITC – Thermodynamic State Mapping
    url: projects/itc_data.html
  - id: spr-data
    title: SPR – Binding State Surfaces
    url: projects/spr_data.html
  - id: vaults
    title: Vaults – Mail & Calendar Organiser
    url: projects/vaults.html
  - id: chrom
    title: Chromatography & Wavelets
    url: projects/chrom_wavelets.html
  - id: unicorn-data
    title: Unicorn – Chromatography Data Layer
    url: projects/unicorn_data.html
  - id: cryo-em
    title: Cryo-EM – Density State Mapping
    url: projects/cryo_em.html

# Optional: explicit edges between nodes (in addition to shared core node).
nexus:
  connections:
    - from: saxs_state_inference
      to: chrom
    - from: saxs_state_inference
      to: epistemic-damage
    - from: saxs_state_inference
      to: pca
    - from: saxs_state_inference
      to: itc-data
    - from: saxs_state_inference
      to: spr-data
    - from: saxs_state_inference
      to: redgem
    - from: saxs_state_inference
      to: saxs-interface
    - from: saxs_state_inference
      to: unicorn-data
    - from: saxs_state_inference
      to: cryo-em
