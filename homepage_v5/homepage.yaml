layout:
  mode: titlepage
  grid:
    spacing_cm: 1
    color: '#fff'
    dot_radius_px: 0.7
layers:
  swirl_joystick:
    enabled: true
    sensitivity: 1.0
    color_mode: section
  particle_field:
    enabled: true
    particle_count: 1
    levy_jump_prob: 0.08
    field_strength: 0.7
hero:
  label: ''
  title: Calyr.aí
  subtitle: 'We use ASC supercomputer power like a digital pen for training and molecular
    design, while the iPhone becomes the pocket pen in your hand.

    '
  cta:
    text: Explore the OO Engine
    href: '#engine'
meta:
  page_title: Calyr.aí - Molecular Deeptech
  tagline: Molecular Intelligence · Adaptive Systems · Reproducible Oracles
titlepage:
  empty_tile:
    id: empty-tile-1
    aria_label: Empty tile
  overlay:
    close_label: Close
    close_aria_label: Close overlay
  fallback_menu_link:
    label: Explore
    href: '#explore'
structure:
  template: calyr_titlepage_orbit
  hero_class: hero
  hero_copy_class: hero-copy
  hero_kicker_class: hero-kicker
  hero_title_class: hero-title
  hero_subtitle_class: hero-subtitle
  hero_orbit_class: hero-orbit-logo
  hero_stack_class: hero-orbit-stack
