<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 700" role="img" aria-labelledby="title desc">
  <title id="title">Nexus on VSC-5 remote-control diagram</title>
  <desc id="desc">A diagram showing a laptop on the left, SSH and VPN access in the middle, and the VSC-5 cluster on the right, making clear that computation runs on the cluster and the laptop only controls it.</desc>
  <rect width="1360" height="700" fill="#0e1218"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d674ff"/>
    </marker>
    <style>
      .panel { fill:#181e27; stroke:#2d3948; stroke-width:2; }
      .ink { fill:#ebeff4; }
      .muted { fill:#96a1ad; }
      .accent { fill:#5ccbff; }
      .title { font:700 34px Arial,sans-serif; }
      .body { font:500 24px Arial,sans-serif; }
      .strong { font:700 22px Arial,sans-serif; }
      .badge { font:700 18px Arial,sans-serif; }
      .bottom { font:700 36px Arial,sans-serif; text-anchor:middle; }
      .subbottom { font:500 24px Arial,sans-serif; text-anchor:middle; }
      .arrow { stroke:#d674ff; stroke-width:5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect class="panel" x="538" y="188" width="284" height="126" rx="18" ry="18"/>
  <rect x="610" y="202" width="140" height="28" rx="14" ry="14" fill="#5ccbff" opacity="0.18" stroke="#5ccbff" stroke-width="1.5"/>

  <rect x="140" y="162" width="255" height="118" rx="10" ry="10" fill="none" stroke="#ebeff4" stroke-width="4"/>
  <line x1="170" y1="312" x2="365" y2="312" stroke="#ebeff4" stroke-width="4"/>
  <line x1="150" y1="336" x2="385" y2="336" stroke="#ebeff4" stroke-width="4"/>
  <text class="ink title" x="268" y="244" text-anchor="middle">Laptop</text>
  <text class="muted body" x="268" y="472" text-anchor="middle">interface only</text>
  <text class="muted body" x="268" y="505" text-anchor="middle">no computation</text>

  <rect x="943" y="144" width="264" height="122" rx="10" ry="10" fill="none" stroke="#ebeff4" stroke-width="4"/>
  <line x1="968" y1="183" x2="1182" y2="183" stroke="#ebeff4" stroke-width="3"/>
  <line x1="968" y1="221" x2="1182" y2="221" stroke="#ebeff4" stroke-width="3"/>
  <line x1="968" y1="259" x2="1182" y2="259" stroke="#ebeff4" stroke-width="3"/>
  <text class="ink title" x="1075" y="330" text-anchor="middle">VSC-5 Cluster</text>
  <line x1="935" y1="352" x2="1215" y2="352" stroke="#2d3948" stroke-width="2"/>
  <text class="muted body" x="950" y="389">runs all Python scripts</text>
  <text class="muted body" x="950" y="424">executes simulations</text>
  <text class="muted body" x="950" y="459">stores data in $HOME and $DATA</text>
  <text class="muted body" x="950" y="494">under your VSC account</text>

  <text class="accent badge" x="680" y="222" text-anchor="middle">partner network or VPN</text>
  <text class="accent strong" x="680" y="255" text-anchor="middle">SSH access</text>
  <text class="muted body" x="680" y="286" text-anchor="middle">password plus SMS OTP</text>

  <path class="arrow" d="M 450 244 L 548 244"/>
  <path class="arrow" d="M 812 244 L 873 244"/>

  <text class="ink bottom" x="680" y="584">You control it — VSC-5 executes it</text>
  <text class="muted subbottom" x="680" y="622">SSH access needs a partner network or VPN; computation stays entirely on the cluster.</text>
</svg>