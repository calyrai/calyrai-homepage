<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 700" role="img" aria-labelledby="title desc">
  <title id="title">Nexus agenda overview</title>
  <desc id="desc">A visual agenda with five connected blocks: FAIR data, decision logic, SPR and SAXS, Nexus method, and operational workflow.</desc>
  <rect width="1360" height="700" fill="#0e1218"/>
  <defs>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ccbff"/>
      <stop offset="100%" stop-color="#d674ff"/>
    </linearGradient>
    <style>
      .panel { fill:#181e27; stroke:#2d3948; stroke-width:2; }
      .step { fill:#111822; stroke:#324255; stroke-width:2; }
      .num { fill:#09111a; font:700 21px Arial,sans-serif; }
      .num-bg { fill:url(#flow); }
      .title { fill:#ebeff4; font:700 30px Arial,sans-serif; }
      .body { fill:#96a1ad; font:500 21px Arial,sans-serif; }
      .accent { fill:#5ccbff; font:700 18px Arial,sans-serif; letter-spacing:0.14em; text-transform:uppercase; }
      .footer { fill:#ebeff4; font:500 28px Arial,sans-serif; text-anchor:middle; font-style:italic; }
      .connector { stroke:url(#flow); stroke-width:5; fill:none; stroke-linecap:round; }
      .connector-dim { stroke:#2b3848; stroke-width:2; fill:none; stroke-linecap:round; }
    </style>
  </defs>

  <rect class="panel" x="120" y="110" width="1120" height="430" rx="28" ry="28"/>
  <text class="accent" x="170" y="160">Talk flow</text>

  <path class="connector-dim" d="M 270 235 H 1090"/>
  <path class="connector" d="M 270 235 H 1090"/>

  <g transform="translate(155 190)">
    <rect class="step" width="190" height="150" rx="22" ry="22"/>
    <circle class="num-bg" cx="40" cy="38" r="22"/>
    <text class="num" x="40" y="45" text-anchor="middle">1</text>
    <text class="title" x="28" y="92">FAIR data</text>
    <text class="body" x="28" y="122">Measurements plus</text>
    <text class="body" x="28" y="148">metadata and context</text>
  </g>

  <g transform="translate(370 190)">
    <rect class="step" width="190" height="150" rx="22" ry="22"/>
    <circle class="num-bg" cx="40" cy="38" r="22"/>
    <text class="num" x="40" y="45" text-anchor="middle">2</text>
    <text class="title" x="28" y="92">Decisions</text>
    <text class="body" x="28" y="122">Raw curves are not</text>
    <text class="body" x="28" y="148">enough by themselves</text>
  </g>

  <g transform="translate(585 190)">
    <rect class="step" width="190" height="150" rx="22" ry="22"/>
    <circle class="num-bg" cx="40" cy="38" r="22"/>
    <text class="num" x="40" y="45" text-anchor="middle">3</text>
    <text class="title" x="28" y="92">SPR + SAXS</text>
    <text class="body" x="28" y="122">Dynamic and structural</text>
    <text class="body" x="28" y="148">views of one system</text>
  </g>

  <g transform="translate(800 190)">
    <rect class="step" width="190" height="150" rx="22" ry="22"/>
    <circle class="num-bg" cx="40" cy="38" r="22"/>
    <text class="num" x="40" y="45" text-anchor="middle">4</text>
    <text class="title" x="28" y="92">Nexus method</text>
    <text class="body" x="28" y="122">One abstract model</text>
    <text class="body" x="28" y="148">spans both limits</text>
  </g>

  <g transform="translate(1015 190)">
    <rect class="step" width="190" height="150" rx="22" ry="22"/>
    <circle class="num-bg" cx="40" cy="38" r="22"/>
    <text class="num" x="40" y="45" text-anchor="middle">5</text>
    <text class="title" x="28" y="92">Workflow</text>
    <text class="body" x="28" y="122">Execute the logic</text>
    <text class="body" x="28" y="148">reproducibly on ASC</text>
  </g>

  <text class="footer" x="680" y="625">First the logic, then the commands.</text>
</svg>