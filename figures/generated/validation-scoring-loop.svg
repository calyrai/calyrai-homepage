<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">Validation and scoring loop</title>
  <desc id="desc">A closed-loop flow from Nexus declaration to execution to results and back through validation and scoring.</desc>
  <rect width="980" height="460" fill="#0e1218"/>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5.1" refY="3" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#d674ff"/>
    </marker>
    <style>
      .box { fill:#181e27; stroke:#2d3948; stroke-width:2; rx:16; ry:16; }
      .box-accent { fill:#181e27; stroke:#5ccbff; stroke-width:3; rx:16; ry:16; }
      .label { fill:#ebeff4; font: 600 28px Arial, sans-serif; text-anchor: middle; }
      .sub { fill:#ebeff4; font: 500 18px Arial, sans-serif; text-anchor: middle; }
      .note { fill:#96a1ad; font: 400 18px Arial, sans-serif; text-anchor: middle; }
      .arrowline { stroke:#d674ff; stroke-width:4.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="70" y="72" width="210" height="92" rx="16" ry="16"/>
  <text class="label" x="175" y="112">Nexus</text>
  <text class="label" x="175" y="146">Declaration</text>
  <rect class="box" x="385" y="72" width="250" height="92" rx="16" ry="16"/>
  <text class="label" x="510" y="108">Execution</text>
  <text class="sub" x="510" y="142">ASC / CLI / Engines</text>
  <rect class="box" x="740" y="72" width="170" height="92" rx="16" ry="16"/>
  <text class="label" x="825" y="126">Results</text>
  <rect class="box-accent" x="365" y="252" width="290" height="98" rx="16" ry="16"/>
  <text class="label" x="510" y="294">Validation</text>
  <text class="label" x="510" y="328">+ Scoring</text>
  <path class="arrowline" d="M 280 118 L 385 118"/>
  <path class="arrowline" d="M 635 118 L 740 118"/>
  <path class="arrowline" d="M 785 164 C 740 214, 700 258, 655 301"/>
  <path class="arrowline" d="M 365 301 C 320 266, 268 218, 224 164"/>
  <text class="note" x="510" y="415">Every result feeds back through validation before the next declared state.</text>
</svg>
