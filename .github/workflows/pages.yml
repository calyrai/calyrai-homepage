name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site artifact
        run: |
          rm -rf dist
          mkdir -p dist
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'pages_src/' \
            --exclude 'projects_src/' \
            --exclude 'templates/' \
            --exclude 'scripts/' \
            --exclude 'src/' \
            --exclude 'private/' \
            --exclude 'public/' \
            --exclude 'dist/' \
            --exclude 'backup_root/' \
            --exclude '.venv/' \
            --exclude '.venv_build/' \
            ./ dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
