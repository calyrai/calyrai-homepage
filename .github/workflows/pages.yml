name: Deploy GitHub Pages

env:
  NODE_VERSION: "20"
  WEB_DIR: web
  DEPLOY_DIR: deploy
  DEPLOY_HTML: index.html

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --requirement requirements-build.txt

      - name: Prepare minimal deploy package
        env:
          WEB_DIR: ${{ env.WEB_DIR }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DEPLOY_HTML: ${{ env.DEPLOY_HTML }}
        run: ./scripts/prepare-deploy.sh

      - name: Validate deploy package
        run: test -f "./${{ env.DEPLOY_DIR }}/${{ env.DEPLOY_HTML }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./${{ env.DEPLOY_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
