hero:
  kicker: "Calyr.ai / Nexus"
  title: "Nexus — Data-governed scientific infrastructure for controlled inference"
  subtitle: "Nexus is the scientific data warehouse and orchestration layer of Calyr.ai. It keeps experiments, derived representations, model states and reportable outcomes inside one governed system so interpretation remains linked to the data and assumptions that produced it."
  stats:
    - label: Core Role
      value: Warehouse
      text: "Experimental records, metadata, derived features and model-side states stay linked instead of being scattered across ad hoc files."
    - label: Method
      value: Control
      text: "Inference is staged through governed transformations, with each reduction step attached to its provenance."
    - label: Outcome
      value: Traceability
      text: "Claims, scores and reports remain connected to the underlying data warehouse rather than detached from their origin."

outline:
  - { id: concept, label: Warehouse concept }
  - { id: layers, label: Experimental layers }
  - { id: works, label: Papers and works }
  - { id: map, label: Interactive map }

concept:
  title: "Data warehouse concept"
  formula: "EXPERIMENT → REPRESENTATION → MODEL STATE → RESULT → REPORT"
  body:
    - "Nexus is not just a machine-learning page and not just a workflow UI."
    - "It is the governed middle layer where raw measurements, experimental context, derived representations and model-facing states are collected into one coherent scientific object."
  steps:
    - title: Experiments
      text: "Measurements enter with metadata, run context and acquisition constraints intact."
    - title: Representations
      text: "Signals are transformed into governed features, embeddings and coordinate systems that remain attached to the source record."
    - title: Model states
      text: "Fits, constraints, candidate mechanisms and uncertainty estimates are stored as explicit states rather than hidden intermediate artifacts."
    - title: Controlled outputs
      text: "Reports, scores and publication-facing results can always be traced back to the warehouse object that produced them."

layers:
  title: "Experimental layers"
  body: "The homepage is organised by experimental layers that all feed the same warehouse logic. Each layer keeps its own native signal, but the interpretation path stays governed and comparable."
  cards:
    - label: SAXS
      title: "Structural layer"
      text: "Scattering curves, P(r), model states and state-space coordinates remain linked inside the same data architecture."
      href: ../projects/exp_nodes_pr_iq_peaks.html
    - label: ITC
      title: "Thermodynamic layer"
      text: "Thermograms, integrated heats, fit states and reportable energetics remain tied to the experimental run."
      href: ../projects/itc_data.html
    - label: SPR
      title: "Kinetic layer"
      text: "Sensorgrams, response features and kinetic fit states are handled as governed binding-state objects."
      href: ../projects/spr_data.html
    - label: Unicorn
      title: "Separation layer"
      text: "Chromatography traces, fractions and downstream assay handoff stay visible as one separation record."
      href: ../projects/unicorn_data.html
    - label: Cryo-EM
      title: "Density layer"
      text: "Particle sets, classes, maps and structural interpretations remain linked as a comparable density-state system."
      href: ../projects/cryo_em.html

works:
  title: "Papers and works"
  body: "From the warehouse layer, Nexus hands off into concrete analysis pages, method pages and paper-facing work. These are the pages where the concept becomes operational."
  entries:
    - title: "SAXS – Multi-State Structural Analysis"
      text: "Structured scattering analysis through warehousing, state-space mapping and governed model coupling."
      href: ../projects/exp_nodes_pr_iq_peaks.html
    - title: "PCA & Free-Energy Modes"
      text: "Principal components as a shared representation layer for experimental signals and transition analysis."
      href: ../projects/pca_free_energy.html
    - title: "Epistemic Damage"
      text: "Model bias, propagation and literature-scale scoring connected back to publication networks."
      href: ../projects/epistemic_damage.html
    - title: "Chromatography & Wavelets"
      text: "Mode-based interpretation of chromatography and transport-like trace decomposition."
      href: ../projects/chrom_wavelets.html

map:
  title: "Interactive map"
  body:
    - "The map links the warehouse concept to the concrete project pages."
    - "Click a node to expand the constellation and move from the central Nexus layer into the specific experimental or analytical branches."
  explore_href: ../explore.html
  explore_label: "Open full explore map"
