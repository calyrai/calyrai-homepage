<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QR – Calyr.ai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/nav.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/qr_noise.css?v=20260319d" />
  <link rel="stylesheet" href="../css/contact_dialog.css?v=20260319d" />

  <script src="../js/collect_hearts.js" defer></script>
  <script src="../js/orbit_logo.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
  <script src="../js/qr_noise.js?v=20260319e" defer></script>
  <script src="../js/contact_dialog.js?v=20260319d" defer></script>
</head>

<body>
<header class="site-header">
  <div class="nav-inner">
    <div class="nav-left-row">
      <a href="../index.html" class="nav-pill glow-nav">Calyr.ai – platform technology</a>
      <a href="../explore.html" class="nav-pill glow-nav">Explore</a>
      <a href="../team.html" class="nav-pill glow-nav">Team</a>
    </div>

    <nav class="nav-links" aria-label="Primary">
      <a href="https://bsky.app/profile/calyrai.bsky.social" class="nav-pill glow-nav">Follow</a>
      <a href="mailto:rupert.tscheliessnig@calyr.ai?subject=Contact&amp;body=" class="nav-pill glow-nav">Contact</a>
      <a href="../index.html#impressum" class="nav-pill glow-nav">Impressum</a>
    </nav>
  </div>
</header>

<main class="qr-noise-page" aria-label="QR">
  <section class="qr-noise-shell">
    <button type="button" class="qr-noise-widget" data-qr-noise data-qr-yaml="../data/contact.yaml" data-qr-text="https://calyr.ai/" data-qr-size="340" aria-label="QR">
      <canvas class="qr-noise-canvas" width="300" height="300" aria-hidden="true"></canvas>
    </button>
  </section>
</main>

<dialog id="contact-dialog" class="contact-dialog" aria-label="Contact">
  <div class="contact-dialog__frame" data-contact-swipe>
    <div class="contact-dialog__track">
      <section class="contact-dialog__panel contact-dialog__panel--qr" aria-label="QR">
        <div class="contact-dialog__swipe-right" aria-hidden="true"></div>
        <button type="button" class="qr-noise-widget" data-qr-noise data-qr-yaml="/data/contact.yaml" data-qr-text="https://calyr.ai/" data-qr-size="340" aria-label="QR">
          <canvas class="qr-noise-canvas" width="300" height="300" aria-hidden="true"></canvas>
        </button>
      </section>

      <section class="contact-dialog__panel contact-dialog__panel--email" aria-label="Email">
        <a id="contact-dialog-email" data-contact-direct-mail href="mailto:rupert.tscheliessnig@calyr.ai?subject=Contact&body=" class="contact-dialog__email">rupert.tscheliessnig@calyr.ai</a>
      </section>
    </div>
  </div>
</dialog>
</body>
</html>
