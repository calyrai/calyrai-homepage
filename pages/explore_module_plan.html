<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calyr Module Plan</title>
  <style>
    :root {
      --bg0: #050a16;
      --bg1: #071224;
      --line: rgba(122, 224, 255, 0.26);
      --text: rgba(228, 239, 250, 0.96);
      --muted: rgba(180, 204, 230, 0.88);
      --accent: #8de8ff;
      --accent2: #ffb26b;
      --hint: rgba(141, 232, 255, 0.12);
    }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 14% 10%, #0d223a 0%, var(--bg0) 48%, #030711 100%);
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 26px 24px 32px;
    }

    .eyebrow {
      margin: 0;
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    h1 {
      margin: 0.45rem 0 0;
      font-size: 2.25rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .lead {
      margin: 1rem 0 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 78ch;
      font-size: 0.98rem;
    }

    .tag-row {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      border: 1px solid var(--line);
      background: rgba(10, 20, 33, 0.84);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.74rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(220, 244, 255, 0.95);
    }

    .grid {
      margin-top: 20px;
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(165deg, rgba(8, 16, 28, 0.95), rgba(6, 11, 20, 0.9));
      padding: 16px;
    }

    .card h2 {
      margin: 0;
      font-size: 1.06rem;
      color: rgba(245, 250, 255, 0.98);
      letter-spacing: 0.01em;
    }

    .card p {
      margin: 10px 0 0;
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--muted);
    }

    ul {
      margin: 10px 0 0 1rem;
      padding: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.9rem;
    }

    .hint-box {
      margin-top: 10px;
      border: 1px solid rgba(141, 232, 255, 0.36);
      background: var(--hint);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.84rem;
      color: rgba(222, 244, 255, 0.96);
      line-height: 1.52;
      white-space: pre-wrap;
    }

    .mono {
      margin-top: 10px;
      border: 1px solid rgba(255, 178, 107, 0.34);
      background: rgba(30, 17, 6, 0.7);
      border-radius: 10px;
      padding: 10px;
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.79rem;
      color: rgba(255, 227, 196, 0.95);
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .back {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      text-decoration: none;
      color: rgba(227, 246, 255, 0.97);
      font-size: 0.76rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(8, 17, 30, 0.85);
    }

    .back:hover,
    .back:focus {
      border-color: rgba(200, 240, 255, 0.94);
      color: rgba(200, 240, 255, 0.98);
    }

    @media (max-width: 700px) {
      .wrap {
        padding: 20px 14px 26px;
      }

      h1 {
        font-size: 1.75rem;
      }

      .card {
        padding: 14px;
      }
    }
  </style>
</head>

      <section class="card">
        <h2 id="label-first-steps">First Build Steps</h2>

      objects: {
        title: "Objects",
        lead: "Gemeinsames Objektschema fuer Zustaende, Energien und Features ueber alle wissenschaftlichen Workflows.",
        scope: "Stellt die stabile Objektschicht bereit, die von Nexus, Eval, Engines und Projektionsflaechen konsumiert wird.",
        llmHint: "ROLLE: Object-Model Copilot\nZIEL: gemeinsame Objektvertraege stabil und erweiterbar halten\nREGELN:\n1) additive Weiterentwicklung bevorzugen\n2) Deprecations nur mit Migrationshinweisen\n3) jedes Objekt braucht Validatoren und Beispiele\nOUTPUT: Schema-Updates, Fixtures, Kompatibilitaetsreport",
        steps: ["Aktuelle Objekttypen inventarisieren", "Versionierte Vertraege definieren", "Kompatibilitaetstests ergaenzen", "Migrationsleitfaden publizieren"]
      }
    };

    const UI_LABELS = {
      en: {
        plannedScope: "Planned Scope",
        llmHint: "LLM Hint",
        llmHintDesc: "Use this instruction block for the module copilot so implementation stays consistent and testable.",
        codeStructure: "Code Structure Idea",
        codeStructureDesc: "This is the target layout for code, data contracts, and interfaces.",
        firstSteps: "First Build Steps",
        back: "Back to Explore",
        titlePrefix: "Calyr Module Plan · "
      },
      de: {
        plannedScope: "Geplanter Umfang",
        llmHint: "LLM Hinweis",
        llmHintDesc: "Nutze diesen Instruktionsblock fuer den Modul-Copilot, damit die Umsetzung konsistent und testbar bleibt.",
        codeStructure: "Code-Struktur Idee",
        codeStructureDesc: "Ziel-Layout fuer Code, Datenvertraege und Interfaces.",
        firstSteps: "Erste Umsetzungsschritte",
        back: "Zurueck zu Explore",
        titlePrefix: "Calyr Modulplan · "
      }
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function parseModule() {
      const params = new URLSearchParams(window.location.search);
      const raw = (params.get("module") || "homepage").toLowerCase();
      return MODULES[raw] ? raw : "homepage";
    }

    function parseLang() {
      const params = new URLSearchParams(window.location.search);
      const queryLang = (params.get("lang") || "").toLowerCase();
      if (queryLang === "de" || queryLang === "en") return queryLang;
      return (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
    }

    function applyUiLabels(lang) {
      const labels = UI_LABELS[lang] || UI_LABELS.en;
      document.getElementById("label-planned-scope").textContent = labels.plannedScope;
      document.getElementById("label-llm-hint").textContent = labels.llmHint;
      document.getElementById("label-llm-hint-desc").textContent = labels.llmHintDesc;
      document.getElementById("label-code-structure").textContent = labels.codeStructure;
      document.getElementById("label-code-structure-desc").textContent = labels.codeStructureDesc;
      document.getElementById("label-first-steps").textContent = labels.firstSteps;
      document.getElementById("back-link").textContent = labels.back;
      document.getElementById("back-link").href = lang === "de" ? "../explore.html?lang=de#calyr/ecosystem" : "../explore.html#calyr/ecosystem";
    }

    function renderModule(key, lang) {
      const data = MODULES[key];
      const dataDe = MODULES_DE[key] || {};
      const labels = UI_LABELS[lang] || UI_LABELS.en;
      const title = lang === "de" ? (dataDe.title || data.title) : data.title;
      const lead = lang === "de" ? (dataDe.lead || data.lead) : data.lead;
      const scope = lang === "de" ? (dataDe.scope || data.scope) : data.scope;
      const hint = lang === "de" ? (dataDe.llmHint || data.llmHint) : data.llmHint;
      const steps = lang === "de" ? (dataDe.steps || data.steps) : data.steps;

      document.title = labels.titlePrefix + title;
      document.getElementById("module-code").textContent = data.code;
      document.getElementById("module-title").textContent = title;
      document.getElementById("module-lead").textContent = lead;
      document.getElementById("module-scope").textContent = scope;
      document.getElementById("module-llm-hint").textContent = hint;
      document.getElementById("module-structure").textContent = data.structure;

      const tagsEl = document.getElementById("module-tags");
      tagsEl.innerHTML = data.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("");

      const stepsEl = document.getElementById("module-steps");
      stepsEl.innerHTML = steps.map(step => `<li>${escapeHtml(step)}</li>`).join("");
    }

    const lang = parseLang();
    applyUiLabels(lang);
    renderModule(parseModule(), lang);
  </script>
</body>
</html>
