<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calyr Nexus</title>
  <style>
    :root {
      --bg0: #050a16;
      --bg1: #071224;
      --line: rgba(122, 224, 255, 0.26);
      --text: rgba(228, 239, 250, 0.96);
      --muted: rgba(180, 204, 230, 0.88);
      --accent: #8de8ff;
      --accent2: #ffb26b;
      --hint: rgba(141, 232, 255, 0.12);
    }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 14% 10%, #0d223a 0%, var(--bg0) 48%, #030711 100%);
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 26px 24px 32px;
    }

    .eyebrow {
      margin: 0;
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    h1 {
      margin: 0.45rem 0 0;
      font-size: 2.25rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .lead {
      margin: 1rem 0 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 78ch;
      font-size: 0.98rem;
    }

    .tag-row {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      border: 1px solid var(--line);
      background: rgba(10, 20, 33, 0.84);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.74rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(220, 244, 255, 0.95);
    }

    .grid {
      margin-top: 20px;
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(165deg, rgba(8, 16, 28, 0.95), rgba(6, 11, 20, 0.9));
      padding: 16px;
    }

    .card h2 {
      margin: 0;
      font-size: 1.06rem;
      color: rgba(245, 250, 255, 0.98);
      letter-spacing: 0.01em;
    }

    .card p {
      margin: 10px 0 0;
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--muted);
    }

    ul {
      margin: 10px 0 0 1rem;
      padding: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.9rem;
    }

    .hint-box {
      margin-top: 10px;
      border: 1px solid rgba(141, 232, 255, 0.36);
      background: var(--hint);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.84rem;
      color: rgba(222, 244, 255, 0.96);
      line-height: 1.52;
      white-space: pre-wrap;
    }

    .mono {
      margin-top: 10px;
      border: 1px solid rgba(255, 178, 107, 0.34);
      background: rgba(30, 17, 6, 0.7);
      border-radius: 10px;
      padding: 10px;
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.79rem;
      color: rgba(255, 227, 196, 0.95);
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .back {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      text-decoration: none;
      color: rgba(227, 246, 255, 0.97);
      font-size: 0.76rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(8, 17, 30, 0.85);
    }

    .back:hover,
    .back:focus {
      border-color: rgba(200, 240, 255, 0.94);
      color: rgba(200, 240, 255, 0.98);
    }

    @media (max-width: 700px) {
      .wrap {
        padding: 20px 14px 26px;
      }

      h1 {
        font-size: 1.75rem;
      }

      .card {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow" id="module-code">Calyr Nexus</p>
    <h1 id="module-title">Module</h1>
    <p class="lead" id="module-lead"></p>
    <div class="tag-row" id="module-tags"></div>

    <div class="grid">
      <section class="card">
        <h2 id="label-planned-scope">Planned Scope</h2>
        <p id="module-scope"></p>
      </section>

      <section class="card">
        <h2 id="label-llm-hint">LLM Hint</h2>
        <p id="label-llm-hint-desc">Use this instruction block for the module copilot so implementation stays consistent and testable.</p>
        <div class="hint-box" id="module-llm-hint"></div>
      </section>

      <section class="card">
        <h2 id="label-code-structure">Code Structure Idea</h2>
        <p id="label-code-structure-desc">This is the target layout for code, data contracts, and interfaces.</p>
        <div class="mono" id="module-structure"></div>
      </section>

      <section class="card">
        <h2 id="label-first-steps">First Build Steps</h2>
        <ul id="module-steps"></ul>
      </section>
    </div>

    <a class="back" id="back-link" href="../explore.html#calyr/ecosystem">Back to Explore</a>
  </main>

  <script>
    const MODULES = {
      nexus: {
        code: "ΝΞ · Nexus",
        title: "Nexus",
        lead: "Semantic core for schema, provenance, constraints, and cross-domain comparability.",
        tags: ["semantics", "schema", "provenance", "reasoning"],
        scope: "Define canonical object contracts, maintain links between evidence and claims, and expose query/validation APIs for all Calyr modules.",
        llmHint: "ROLE: semantic-core copilot\nGOAL: produce schema-safe changes only\nRULES:\n1) never mutate object meaning without migration\n2) keep provenance edges explicit\n3) emit contract tests for each new type\nOUTPUT: updated schema, validator, migration notes",
        structure: "core/nexus/\n  schema/\n  validators/\n  graph/\n  queries/\n  adapters/\n  tests/",
        steps: ["Freeze v1 object contract list", "Implement schema validators", "Add provenance edge checker", "Expose module query API"]
      },
      eval: {
        code: "ΕΛ · Eval",
        title: "Eval",
        lead: "Domain feature extraction from SAXS, SPR, simulation, and inference outputs.",
        tags: ["feature extraction", "metrics", "evaluation"],
        scope: "Transform raw experiment and simulation outputs into comparable feature vectors, quality flags, and confidence summaries.",
        llmHint: "ROLE: evaluation copilot\nGOAL: convert raw files to normalized features\nRULES:\n1) keep extraction deterministic\n2) attach uncertainty per metric\n3) preserve raw-to-feature traceability\nOUTPUT: extractor module + feature schema + regression tests",
        structure: "core/bmca_core/eval/\n  extractors/\n  feature_sets/\n  quality/\n  report/\n  tests/",
        steps: ["Define canonical feature sets per modality", "Implement extraction runners", "Attach confidence estimation", "Add benchmark snapshots"]
      },
      okto: {
        code: "ΟΚ · Okto",
        title: "Okto",
        lead: "Knowledge loop turning research output into reusable pages, slides, and app narratives.",
        tags: ["knowledge loop", "publishing", "projection"],
        scope: "Build a repeatable pipeline that maps structured knowledge objects to publication and communication artifacts.",
        llmHint: "ROLE: projection copilot\nGOAL: map structured knowledge to communicable artifacts\nRULES:\n1) source from structured objects first\n2) keep claims evidence-linked\n3) emit reusable blocks for web + slides\nOUTPUT: content block graph and rendering templates",
        structure: "apps/homepage/\n  pages/\n  data/\npublishing/\n  slide_templates/\n  paper_templates/",
        steps: ["Define reusable content blocks", "Create render templates", "Wire source-object links", "Add preview + export flow"]
      },
      grammateia: {
        code: "ΓΡ · Grammateia",
        title: "Grammateia (Literature)",
        lead: "Literature ingestion and extraction into concepts, methods, constraints, and evidence nodes.",
        tags: ["literature", "extraction", "evidence"],
        scope: "Ingest papers, parse method and result sections, and map extracted entities into Nexus-aligned objects.",
        llmHint: "ROLE: literature copilot\nGOAL: extract concepts and methods from papers\nRULES:\n1) preserve citation anchors\n2) mark confidence + ambiguity\n3) map terms to Nexus ontology\nOUTPUT: extracted entities, relation graph, unresolved terms list",
        structure: "literature/\n  ingestion/\n  parsers/\n  entity_linking/\n  evidence_graph/\n  tests/",
        steps: ["Implement ingestion adapters", "Add method/result section parser", "Link entities to ontology", "Store citation-grounded triples"]
      },
      asc: {
        code: "ΑΣ · Asc",
        title: "Asc",
        lead: "Remote compute orchestration for submissions, status, logs, and artifact retrieval.",
        tags: ["compute", "scheduler", "remote ops"],
        scope: "Provide reliable remote execution abstraction across local HPC and cloud runners with uniform job metadata.",
        llmHint: "ROLE: execution copilot\nGOAL: robust remote job orchestration\nRULES:\n1) idempotent submit/retry\n2) explicit job state machine\n3) structured logs + artifact hashes\nOUTPUT: provider adapters and run lifecycle API",
        structure: "core/warehouse/asc/\n  providers/\n  lifecycle/\n  logging/\n  artifacts/\n  tests/",
        steps: ["Define job lifecycle enum", "Add provider interface", "Implement log collector", "Expose run status API"]
      },
      lammps: {
        code: "ΛΜ · Lammps Local",
        title: "Lammps Local",
        lead: "Local and cluster-ready LAMMPS preparation, launch, and run packaging.",
        tags: ["molecular dynamics", "simulation", "hpc"],
        scope: "Standardize LAMMPS run setup and metadata capture so simulation output is reproducible and queryable.",
        llmHint: "ROLE: simulation copilot\nGOAL: reproducible LAMMPS runs\nRULES:\n1) lock package flags in run manifest\n2) capture input checksum + environment\n3) expose post-run parser hooks\nOUTPUT: run manifest + launch wrapper + parser stubs",
        structure: "engines/lammps/\n  templates/\n  launchers/\n  parsers/\n  manifests/\n  tests/",
        steps: ["Create run manifest schema", "Wrap launch commands", "Capture env metadata", "Parse thermo/trajectory outputs"]
      },
      alphafold: {
        code: "ΑΦ · AlphaFold Local",
        title: "AlphaFold Local",
        lead: "AlphaFold execution surface with reproducible wrappers and output integration.",
        tags: ["structure prediction", "protein", "inference"],
        scope: "Package AlphaFold execution and output handling with clear provenance for sequence, parameters, and model artifacts.",
        llmHint: "ROLE: prediction copilot\nGOAL: reproducible AlphaFold workflow\nRULES:\n1) pin model/db versions\n2) preserve sequence and parameter provenance\n3) emit confidence summaries for downstream modules\nOUTPUT: run spec, execution adapter, confidence report",
        structure: "engines/\n  alphafold/\n    wrappers/\n    configs/\n    output_parser/\n    integration/",
        steps: ["Define AF run spec", "Wrap execution profiles", "Parse pLDDT/PAE outputs", "Link structures to Nexus objects"]
      },
      nomos: {
        code: "ΝΜ · Nomos",
        title: "Nomos",
        lead: "Operational governance for mail automation and calendar synchronization.",
        tags: ["operations", "automation", "governance"],
        scope: "Coordinate communication workflows with explicit policy checks, audit logs, and safe upsert behavior.",
        llmHint: "ROLE: operations copilot\nGOAL: safe communication automation\nRULES:\n1) require policy checks before write actions\n2) keep immutable audit logs\n3) support dry-run by default\nOUTPUT: policy engine integration and audited workflow actions",
        structure: "administration/\n  workflows/\n  policies/\n  adapters/\n  audit/\n  tests/",
        steps: ["Define policy contract", "Add dry-run mode", "Implement audited upserts", "Add operator dashboard endpoints"]
      },
      demos: {
        code: "ΔΜ · Demos",
        title: "Demos",
        lead: "Packaging and sync layer for publication-ready demos and artifacts.",
        tags: ["demo", "packaging", "delivery"],
        scope: "Bundle runnable artifacts with metadata, license context, and reproducibility notes for external sharing.",
        llmHint: "ROLE: delivery copilot\nGOAL: ship reproducible demo artifacts\nRULES:\n1) include metadata manifest\n2) include data lineage references\n3) verify runnable entrypoints\nOUTPUT: packaged bundle + manifest + validation report",
        structure: "apps/\n  demos/\nscripts/\n  package_demo.sh\nregistry/\n  demo_manifests/",
        steps: ["Define demo manifest format", "Build packaging script", "Validate entrypoints", "Publish bundle index"]
      },
      homepage: {
        code: "ΗΒ · Homepage",
        title: "Homepage",
        lead: "Public projection layer for Explore, docs, interfaces, and selected outputs.",
        tags: ["web", "projection", "communication"],
        scope: "Render selected system capabilities as clear interfaces while preserving links to evidence and implementation context.",
        llmHint: "ROLE: interface copilot\nGOAL: communicate system capabilities with evidence links\nRULES:\n1) keep pages source-linked\n2) preserve language variants\n3) optimize for scan + drill-down\nOUTPUT: page templates, data wiring, navigation maps",
        structure: "apps/homepage/\n  index.html\n  explore.html\n  docs.html\n  pages/\n  data/\n  js/\n  css/",
        steps: ["Normalize page data sources", "Ensure each tile has destination page", "Add structure/LLM hints to module pages", "Audit nav consistency"]
      },
      publishing: {
        code: "ΠΒ · Publishing",
        title: "Publishing",
        lead: "Workspace for papers, presentations, metadata, and generated outputs.",
        tags: ["papers", "slides", "metadata"],
        scope: "Integrate manuscript and presentation pipelines with traceable source objects and automated metadata generation.",
        llmHint: "ROLE: publishing copilot\nGOAL: evidence-aligned manuscripts and slide artifacts\nRULES:\n1) separate claims from narrative style\n2) auto-generate references and figure metadata\n3) validate against source object IDs\nOUTPUT: publication package + citation map + figure lineage",
        structure: "publishing/\n  manuscripts/\n  slides/\n  metadata/\n  exports/\n  checks/",
        steps: ["Create publication manifest", "Wire source-object references", "Automate citation checks", "Generate export targets"]
      },
      publicrelations: {
        code: "ΠΡ · PublicRelations",
        title: "PublicRelations",
        lead: "Opportunity-to-deliverable orchestration for evidence-grounded external communication.",
        tags: ["communications", "strategy", "evidence"],
        scope: "Convert external opportunities into actionable deliverables with alignment checks against internal evidence state.",
        llmHint: "ROLE: comms copilot\nGOAL: evidence-grounded external messaging\nRULES:\n1) map each claim to source evidence\n2) classify confidence and risk\n3) produce channel-specific variants from one core message\nOUTPUT: message pack with evidence map and risk labels",
        structure: "core/nexus/publicrelations/\n  opportunities/\n  messaging/\n  channels/\n  risk_checks/\n  tests/",
        steps: ["Define opportunity intake schema", "Add evidence alignment checks", "Generate channel variants", "Track outcomes for feedback"]
      },
      objects: {
        code: "ΣΒ · Objects",
        title: "Objects",
        lead: "Shared object schema for states, energies, and features across all science workflows.",
        tags: ["objects", "contracts", "cross-domain"],
        scope: "Provide the stable object layer consumed by Nexus, Eval, engines, and projection surfaces.",
        llmHint: "ROLE: object-model copilot\nGOAL: keep shared object contracts stable and extensible\nRULES:\n1) additive evolution preferred\n2) deprecations require migration notes\n3) all objects require validation and examples\nOUTPUT: object schema updates + fixtures + compatibility report",
        structure: "core/\n  objects/\n    schemas/\n    fixtures/\n    validators/\n    migrations/\n    tests/",
        steps: ["Inventory current object types", "Define versioned contracts", "Add compatibility tests", "Publish migration guidance"]
      }
    };


    const UI_LABELS = {
      en: {
        plannedScope: "Planned Scope",
        llmHint: "LLM Hint",
        llmHintDesc: "Use this instruction block for the module copilot so implementation stays consistent and testable.",
        codeStructure: "Code Structure Idea",
        codeStructureDesc: "This is the target layout for code, data contracts, and interfaces.",
        firstSteps: "First Build Steps",
        back: "Back to Explore",
        titlePrefix: "Calyr Nexus · "
      }
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function parseModule() {
      const params = new URLSearchParams(window.location.search);
      const raw = (params.get("module") || "homepage").toLowerCase();
      return MODULES[raw] ? raw : "homepage";
    }

    function parseLang() { return "en"; }

    function applyUiLabels(lang) {
      const labels = UI_LABELS[lang] || UI_LABELS.en;
      document.getElementById("label-planned-scope").textContent = labels.plannedScope;
      document.getElementById("label-llm-hint").textContent = labels.llmHint;
      document.getElementById("label-llm-hint-desc").textContent = labels.llmHintDesc;
      document.getElementById("label-code-structure").textContent = labels.codeStructure;
      document.getElementById("label-code-structure-desc").textContent = labels.codeStructureDesc;
      document.getElementById("label-first-steps").textContent = labels.firstSteps;
      document.getElementById("back-link").textContent = labels.back;
      document.getElementById("back-link").href = "../explore.html#calyr/ecosystem";
    }

    function renderModule(key) {
      const data = MODULES[key];
      const labels = UI_LABELS.en;
      const title = data.title;
      const lead = data.lead;
      const scope = data.scope;
      const hint = data.llmHint;
      const steps = data.steps;

      document.title = labels.titlePrefix + title;
      document.getElementById("module-code").textContent = data.code;
      document.getElementById("module-title").textContent = title;
      document.getElementById("module-lead").textContent = lead;
      document.getElementById("module-scope").textContent = scope;
      document.getElementById("module-llm-hint").textContent = hint;
      document.getElementById("module-structure").textContent = data.structure;

      const tagsEl = document.getElementById("module-tags");
      tagsEl.innerHTML = data.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("");

      const stepsEl = document.getElementById("module-steps");
      stepsEl.innerHTML = steps.map(step => `<li>${escapeHtml(step)}</li>`).join("");
    }

    applyUiLabels("en");
    renderModule(parseModule());
  </script>
</body>
</html>
