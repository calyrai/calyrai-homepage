hero:
  kicker: "Unicorn · Separation Layer"
  title: "Chromatography Data Layer"
  subtitle: "Nexus treats Unicorn outputs as the canonical separation record for chromatography-driven workflows. Fractions, gradients, detector traces and run metadata become governed warehouse objects that can be linked into SAXS, ITC and SPR follow-up analyses."
  stats:
    - label: Primary Signal
      value: Traces
      text: "UV, conductivity and run-program traces remain attached to the same run object rather than exported as disconnected snapshots."
    - label: State Layer
      value: Fractions
      text: "Fractions become state-carrying entities with their own provenance and downstream assay links."
    - label: Outcome
      value: Linkage
      text: "Separation context stays visible when the sample moves into structural or thermodynamic measurement."

outline:
  - { id: flow, label: Data flow }
