sections:
  - id: flow
    title: "Data-driven SPR"
    body:
      - "SPR is modeled as a sequence of response events bound to concentration, chip state and regeneration context. This lets Nexus compare binding behavior as structured data before it is compressed into a single kinetic fit."
    steps:
      - title: "Sensorgram capture"
        text: "Store the full response curve, analyte conditions and instrument protocol as one governed record."
      - title: "Derived features"
        text: "Response amplitudes, association slopes, dissociation decay and regeneration behavior become traceable features."
      - title: "State surfaces"
        text: "Comparable experiments can be projected into a kinetic state space across concentrations and chip conditions."
      - title: "Controlled output"
        text: "kon, koff and affinity summaries are emitted as linked results rather than standalone endpoints."

  - id: architecture
    title: "Model integration"
    cards:
      - label: Fits
        title: "Parallel model states"
        text: "One-site, heterogeneous, mass-transport-aware and constrained kinetic models can coexist as warehouse-linked states."
      - label: Correction
        title: "Baseline and referencing"
        text: "Reference subtraction and drift correction stay visible as explicit parts of the response lineage."
      - label: Bridge
        title: "Cross-modality linkage"
        text: "SPR states can be compared against ITC energetics and SAXS structural states inside the same Nexus system."

  - id: state-space
    title: "Projection to kinetic state space"
    formula: "sensorgrams → response features → projection → binding state space"
    body:
      - "The page positions SPR as a state-space problem: not merely fit a sensorgram, but organize many related response traces into a shared kinetic geometry."

  - id: statement
    title: "From response traces to governed kinetic knowledge"
    body:
      - "SPR follows the same Nexus layout logic as the homepage: warehouse first, representation second, model state third, report last. That keeps kinetic claims tied to the actual sensorgrams, reference corrections and concentration context that produced them."
    merge_band:
      - sensorgrams
      - "response features"
      - "kinetic models"
      - "binding state space"
      - "affinity outputs"
