sections:
  - id: flow
    title: "Data-driven cryo-EM"
    body:
      - "Cryo-EM is handled as a hierarchy of linked records: acquisition, particles, classes, maps and model interpretations. The page emphasizes data lineage and state organization before any single reconstruction is treated as the final answer."
    steps:
      - title: Acquisition
        text: "Micrographs, picking settings, particle sets and preprocessing metadata are stored as the base warehouse layer."
      - title: Classification
        text: "2D and 3D classes become governed state candidates rather than disposable intermediate folders."
      - title: "Density states"
        text: "Maps can be organized into a comparable state space across conditions, classes and structural hypotheses."
      - title: "Controlled output"
        text: "Reported density interpretations remain linked back to their particle and class provenance."

  - id: architecture
    title: "Warehouse and model integration"
    cards:
      - label: Storage
        title: "Maps and classes"
        text: "Density maps, masks and class assignments are kept as named and comparable data entities."
      - label: Interpretation
        title: "Atomic and coarse fits"
        text: "Model docking or flexible fitting can be stored as additional interpretive layers rather than replacing the underlying density record."
      - label: Bridge
        title: "Cross-modality comparison"
        text: "Cryo-EM density states can be related to SAXS, thermodynamic and separation-derived state changes."

  - id: statement
    title: "From particle processing to comparable density states"
    body:
      - "Cryo-EM now follows the same Nexus reading logic as the homepage: acquisition, representation, governed interpretation and reportable outcome. The page therefore treats classes and maps as stable warehouse states that can be compared across experiments instead of isolated reconstruction products."
    merge_band:
      - micrographs
      - "particle sets"
      - "classes + maps"
      - "fit interpretations"
      - "density state space"
