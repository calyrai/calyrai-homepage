<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calyr.ai – Python + API + Power BI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Calyr.ai presentation on clean architecture — Python handles data and APIs, Power BI handles visualization." />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/explore.css" />
  <style>
    body.deck-theme-calyr-pyapi {
      background:
        radial-gradient(900px 500px at 8% 2%, rgba(36, 243, 255, 0.14), transparent 55%),
        radial-gradient(900px 560px at 96% 92%, rgba(255, 77, 245, 0.14), transparent 58%),
        linear-gradient(145deg, #040a14 0%, #08111d 38%, #060b15 100%);
      min-height: 100svh;
    }

    body.deck-theme-calyr-pyapi::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.32;
      background-image:
        linear-gradient(rgba(116, 168, 214, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(116, 168, 214, 0.05) 1px, transparent 1px);
      background-size: 44px 44px;
      mix-blend-mode: screen;
      z-index: 0;
    }

    body.deck-theme-calyr-pyapi .deck-shell {
      position: relative;
      z-index: 1;
      padding: clamp(14px, 1.8vw, 24px) clamp(14px, 2.2vw, 30px) 22px;
    }

    body.deck-theme-calyr-pyapi .deck-viewport {
      border: 1px solid rgba(126, 236, 255, 0.22);
      border-radius: 24px;
      background:
        radial-gradient(700px 420px at 16% 12%, rgba(32, 190, 255, 0.16), transparent 56%),
        radial-gradient(600px 380px at 84% 82%, rgba(255, 77, 245, 0.12), transparent 62%),
        linear-gradient(160deg, rgba(10, 20, 34, 0.9), rgba(8, 15, 27, 0.86));
      box-shadow:
        0 0 0 1px rgba(28, 178, 212, 0.1) inset,
        0 28px 70px rgba(0, 0, 0, 0.56),
        0 0 40px rgba(36, 243, 255, 0.09);
    }

    body.deck-theme-calyr-pyapi .deck-slide {
      padding: clamp(30px, 3.4vw, 58px) clamp(24px, 3vw, 50px);
    }

    body.deck-theme-calyr-pyapi .deck-btn {
      border: 1px solid rgba(122, 236, 255, 0.28);
      background: linear-gradient(180deg, rgba(15, 30, 46, 0.9), rgba(8, 18, 30, 0.9));
      color: rgba(206, 248, 255, 0.96);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.34), 0 0 14px rgba(36, 243, 255, 0.12);
    }

    body.deck-theme-calyr-pyapi .deck-btn:hover {
      border-color: rgba(146, 244, 255, 0.55);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 20px rgba(36, 243, 255, 0.24);
      transform: translateY(-1px);
    }

    body.deck-theme-calyr-pyapi .deck-theme-footer {
      border-top: 1px solid rgba(118, 236, 255, 0.18);
      background: linear-gradient(90deg, rgba(5, 14, 24, 0.92), rgba(8, 18, 30, 0.86));
      box-shadow: 0 -10px 24px rgba(0, 0, 0, 0.3);
    }

    body.deck-theme-calyr-pyapi .deck-theme-footer__brand {
      color: rgba(124, 240, 255, 0.95);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    body.deck-theme-calyr-pyapi .deck-theme-footer__topic {
      color: rgba(215, 244, 255, 0.88);
    }

    body.deck-theme-calyr-pyapi .deck-dot {
      border-color: rgba(120, 234, 255, 0.34);
      background: rgba(10, 22, 36, 0.88);
    }

    body.deck-theme-calyr-pyapi .deck-dot.active {
      background: linear-gradient(145deg, rgba(36, 243, 255, 0.96), rgba(95, 208, 255, 0.96));
      border-color: rgba(180, 247, 255, 0.92);
      box-shadow: 0 0 16px rgba(36, 243, 255, 0.38);
    }

    @media (max-width: 900px) {
      body.deck-theme-calyr-pyapi .deck-viewport {
        border-radius: 16px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
    onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"></script>
</head>

<body class="explore-page explore-standalone deck-theme-calyr-beamer deck-theme-calyr-pyapi">
<section class="deck-shell" aria-label="Presentation" id="deck-shell">
  <button class="deck-mobile-menu-btn" id="deck-mobile-menu-btn" type="button" aria-label="Open content and help" aria-expanded="false" aria-controls="deck-mobile-panel">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <aside class="deck-mobile-panel" id="deck-mobile-panel" aria-label="Content and help" hidden>
    <div class="deck-mobile-panel__header">
      <button class="deck-mobile-tab active" id="deck-mobile-tab-content" type="button" data-panel-tab="content" aria-pressed="true">Content</button>
      <button class="deck-mobile-tab" id="deck-mobile-tab-help" type="button" data-panel-tab="help" aria-pressed="false">Help</button>
    </div>
    <div class="deck-mobile-panel__body">
      <div class="deck-mobile-section active" id="deck-mobile-section-content"></div>
      <div class="deck-mobile-section" id="deck-mobile-section-help">
        <p>Swipe vertically through the deck on phone.</p>
        <p>Use Content to jump between sections quickly.</p>
        <p>Rotate or use fullscreen for a larger presentation view.</p>
      </div>
    </div>
  </aside>
  <div class="deck-stage">
    <div class="deck-viewport">
      <div class="deck-track" id="deck-track"></div>
    </div>
    <div class="deck-toc" id="deck-toc" aria-label="Chapter navigation"></div>
  </div>
  <nav class="deck-nav" aria-label="Slide navigation">
    <button class="deck-btn" id="deck-prev" aria-label="Previous">&#8592;</button>
    <div class="deck-dots" id="deck-dots"></div>
    <button class="deck-btn" id="deck-next" aria-label="Next">&#8594;</button>
    <button class="deck-btn deck-btn--fs" id="deck-fs" aria-label="Enter fullscreen">&#x26F6;</button>
  </nav>
  <footer class="deck-theme-footer" aria-label="Presentation footer">
    <div class="deck-theme-footer__brand">python + api + power bi</div>
    <div class="deck-theme-footer__topic">clean architecture — one data model, many consumers</div>
    <div class="deck-theme-footer__count">
      <span id="deck-theme-current">1</span>
      <span class="deck-theme-footer__sep">/</span>
      <span id="deck-theme-total">1</span>
    </div>
  </footer>
</section>

<script defer src="../data/python-api-powerbi.js"></script>
<script defer src="../js/deck.js"></script>
</body>
</html>
