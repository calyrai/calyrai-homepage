<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calyr_ai_syntax: Concept and Architecture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Presentation wrapper for the Calyr_ai_syntax concept PDF." />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(24, 36, 58, 0.42), transparent 38%), #0e1218;
      color: #ebeff4;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    .pdf-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .pdf-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(106, 240, 255, 0.14);
      background: rgba(6, 12, 20, 0.82);
      backdrop-filter: blur(12px);
    }

    .pdf-header__eyebrow {
      margin: 0 0 4px;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(106, 240, 255, 0.62);
    }

    .pdf-header__title {
      margin: 0;
      font-size: clamp(1.1rem, 1rem + 1.4vw, 2rem);
      line-height: 1.1;
      color: rgba(232, 242, 255, 0.96);
    }

    .pdf-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pdf-link {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(106, 240, 255, 0.26);
      color: rgba(106, 240, 255, 0.9);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(106, 240, 255, 0.07);
    }

    .pdf-link:hover {
      background: rgba(106, 240, 255, 0.14);
      border-color: rgba(106, 240, 255, 0.48);
    }

    .pdf-stage {
      flex: 1;
      padding: 18px;
    }

    .pdf-frame {
      width: 100%;
      height: calc(100vh - 118px);
      border: 1px solid rgba(160, 196, 255, 0.14);
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
    }

    @media (max-width: 820px) {
      .pdf-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .pdf-stage {
        padding: 12px;
      }

      .pdf-frame {
        height: calc(100vh - 174px);
      }
    }
  </style>
</head>
<body>
  <div class="pdf-shell">
    <header class="pdf-header">
      <div>
        <p class="pdf-header__eyebrow">Nexus / Presentation</p>
        <h1 class="pdf-header__title">Calyr_ai_syntax: Concept and Architecture</h1>
      </div>
      <div class="pdf-actions">
        <a class="pdf-link" href="../publications.html#calyr-ai-syntax-concept">Back to publications</a>
        <a class="pdf-link" href="calyr-ai-syntax-concept.pdf" target="_blank" rel="noopener">Open PDF</a>
      </div>
    </header>
    <main class="pdf-stage">
      <iframe class="pdf-frame" src="calyr-ai-syntax-concept.pdf#view=FitH" title="Calyr_ai_syntax concept PDF"></iframe>
    </main>
  </div>
</body>
</html>
