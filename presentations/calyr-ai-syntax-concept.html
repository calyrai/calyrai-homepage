<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>calyr.ai.syntax</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PDF presentation wrapper for calyr.ai.syntax." />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    :root {
      color-scheme: dark;
      --pdf-app-height: 100vh;
      --slide-zoom: 1;
      --calyr-cyan: #24f3ff;
      --calyr-magenta: #ff4df5;
      --calyr-white: #f4fbff;
    }

    @supports (height: 100dvh) {
      :root {
        --pdf-app-height: 100dvh;
      }
    }

    html {
      background: #000000;
    }

    body {
      margin: 0;
      background: #000000;
      color: #ebeff4;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    .pdf-shell {
      min-height: var(--pdf-app-height);
      display: flex;
      flex-direction: column;
    }

    body.embed-mode .pdf-shell {
      min-height: 100%;
    }

    body.embed-mode.mobile-immersive .pdf-shell {
      min-height: var(--pdf-app-height);
    }

    .pdf-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 24px;
      border-bottom: 1px solid color-mix(in oklab, var(--calyr-cyan) 28%, transparent);
      background:
        radial-gradient(1200px 280px at 18% -40%, color-mix(in oklab, var(--calyr-cyan) 20%, transparent), transparent 60%),
        radial-gradient(1000px 260px at 84% -46%, color-mix(in oklab, var(--calyr-magenta) 18%, transparent), transparent 62%),
        rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
    }

    .pdf-header__eyebrow {
      margin: 0 0 4px;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: color-mix(in oklab, var(--calyr-cyan) 72%, white 28%);
    }

    .pdf-header__title {
      margin: 0;
      font-size: clamp(1.1rem, 1rem + 1.4vw, 2rem);
      line-height: 1.1;
      color: var(--calyr-white);
      text-shadow: 0 0 26px color-mix(in oklab, var(--calyr-cyan) 24%, transparent);
    }

    .pdf-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pdf-link {
      appearance: none;
      cursor: pointer;
      display: inline-block;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid color-mix(in oklab, var(--calyr-cyan) 34%, transparent);
      color: color-mix(in oklab, var(--calyr-cyan) 86%, white 14%);
      text-decoration: none;
      background: color-mix(in oklab, var(--calyr-cyan) 14%, transparent);
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .pdf-link:hover {
      background: color-mix(in oklab, var(--calyr-cyan) 22%, transparent);
      color: color-mix(in oklab, var(--calyr-cyan) 96%, white 4%);
      border-color: color-mix(in oklab, var(--calyr-cyan) 52%, transparent);
    }

    .pdf-link:active {
      opacity: 0.88;
    }

    .pdf-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .pdf-pages {
      flex: 1;
      overflow: auto;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pdf-loading {
      color: color-mix(in oklab, var(--calyr-cyan) 48%, white 52%);
      font-size: 1rem;
      text-align: center;
      padding: 48px 24px;
    }

    .pdf-canvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
      margin: auto;
    }

    .pdf-nav-overlay {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: color-mix(in oklab, rgba(0, 0, 0) 48%, transparent);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 32px;
      border: 1px solid color-mix(in oklab, var(--calyr-cyan) 22%, transparent);
      opacity: 0.6;
      transition: opacity 0.24s ease;
    }

    .pdf-nav-overlay:hover {
      opacity: 1;
    }

    .pdf-nav-btn {
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid color-mix(in oklab, var(--calyr-cyan) 34%, transparent);
      background: transparent;
      color: color-mix(in oklab, var(--calyr-cyan) 72%, white 28%);
      font-size: 1.2rem;
      transition: all 0.2s ease;
    }

    .pdf-nav-btn:hover:not(:disabled) {
      background: color-mix(in oklab, var(--calyr-cyan) 18%, transparent);
      color: color-mix(in oklab, var(--calyr-cyan) 92%, white 8%);
      border-color: color-mix(in oklab, var(--calyr-cyan) 48%, transparent);
    }

    .pdf-nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pdf-nav-status {
      color: color-mix(in oklab, var(--calyr-cyan) 52%, white 48%);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      min-width: 48px;
      text-align: center;
    }

    body.embed-mode .pdf-nav-overlay {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .pdf-header {
        padding: 14px 18px;
      }

      .pdf-actions {
        gap: 8px;
      }

      .pdf-link {
        padding: 8px 12px;
        font-size: 0.8rem;
      }

      .pdf-nav-overlay {
        bottom: 24px;
      }
    }

    .fullscreen-mode .pdf-shell {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 999999;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .fullscreen-mode .pdf-header {
      display: none;
    }

    .fullscreen-mode .pdf-stage {
      padding: 0;
    }

    body.mobile-immersive .pdf-header {
      display: none;
    }

    body.mobile-immersive .pdf-nav-overlay {
      opacity: 0.72;
    }

    .fullscreen-mode .pdf-nav-overlay,
    body.mobile-immersive .pdf-nav-overlay {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="pdf-shell">
    <header class="pdf-header">
      <div>
        <p class="pdf-header__eyebrow">calyr.ai.syntax</p>
        <h1 class="pdf-header__title">calyr.ai.syntax</h1>
      </div>
      <div class="pdf-actions">
        <a class="pdf-link" href="../explore.html#calyr/calyr-ai-syntax-concept-and-architecture">Back</a>
        <button class="pdf-link" id="fullscreen-toggle" type="button">Fullscreen</button>
      </div>
    </header>
    <main class="pdf-stage" id="pdf-stage">
      <div class="pdf-pages" id="pdf-pages">
        <div class="pdf-loading" id="pdf-loading">Loading PDF presentation…</div>
      </div>
      <div class="pdf-nav-overlay" id="pdf-nav-overlay" role="toolbar" aria-label="Presentation navigation">
        <button class="pdf-nav-btn" id="pdf-prev" type="button" aria-label="Previous page">‹</button>
        <div class="pdf-nav-status" id="pdf-nav-status">1 / 1</div>
        <button class="pdf-nav-btn" id="pdf-next" type="button" aria-label="Next page">›</button>
      </div>
    </main>
  </div>

  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

    const shell = document.querySelector('.pdf-shell');
    const stage = document.getElementById('pdf-stage');
    const button = document.getElementById('fullscreen-toggle');
    const pagesHost = document.getElementById('pdf-pages');
    const loadingNode = document.getElementById('pdf-loading');
    const prevButton = document.getElementById('pdf-prev');
    const nextButton = document.getElementById('pdf-next');
    const navStatus = document.getElementById('pdf-nav-status');
    const params = new URLSearchParams(window.location.search);
    const isEmbed = params.get('embed') === '1';
    const wantsImmersive = params.get('immersive') !== '0';
    const immersiveMedia = window.matchMedia('(max-width: 900px) and (pointer: coarse)');
    const landscapeMedia = window.matchMedia('(orientation: landscape)');

    let pageNodes = [];
    let activePage = 0;
    let pdfDocumentPromise = null;
    let slideZoom = 1;
    let rerenderTimer = null;
    let renderInProgress = false;
    let queuedRender = false;
    let touchStartX = null;
    let touchStartY = null;
    let pinchStartDistance = null;
    let pinchStartZoom = 1;

    if (!isEmbed) {
      window.location.replace('../explore.html#calyr/calyr-ai-syntax-concept-and-architecture');
    }

    if (isEmbed) {
      document.body.classList.add('embed-mode');
    }

    const isFullscreen = () => document.fullscreenElement === shell || document.webkitFullscreenElement === shell;

    const renderPage = async (pageNum) => {
      const pdf = await pdfDocumentPromise;
      const page = await pdf.getPage(pageNum);
      const container = pageNodes[pageNum - 1];
      if (!container) return;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const baseViewport = page.getViewport({ scale: 1 });
      const hostWidth = pagesHost.clientWidth || stage.clientWidth || window.innerWidth;
      const hostHeight = pagesHost.clientHeight || stage.clientHeight || Math.round(window.innerHeight * 0.92);
      const maxWidth = Math.max(hostWidth - 24, 320);
      const maxHeight = Math.max(hostHeight - 24, 240);
      const fitScale = Math.min(maxWidth / baseViewport.width, maxHeight / baseViewport.height);
      const cssScale = Math.max(0.1, fitScale) * slideZoom;
      const outputScale = Math.min(window.devicePixelRatio || 1, 2);

      const viewport = page.getViewport({ scale: cssScale });
      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = `${viewport.width}px`;
      canvas.style.height = `${viewport.height}px`;

      const renderViewport = page.getViewport({ scale: cssScale * outputScale });
      await page.render({ canvasContext: ctx, viewport: renderViewport }).promise;
      while (container.firstChild) {
        container.removeChild(container.firstChild);
      }
      container.appendChild(canvas);
    };

    const requestRender = () => {
      if (!pageNodes.length) return;
      if (renderInProgress) {
        queuedRender = true;
        return;
      }
      renderInProgress = true;
      renderPage(activePage + 1)
        .catch(() => {})
        .finally(() => {
          renderInProgress = false;
          if (queuedRender) {
            queuedRender = false;
            requestRender();
          }
        });
    };

    const initPages = async (numPages) => {
      pagesHost.innerHTML = '';
      pageNodes = [];
      for (let i = 0; i < numPages; i++) {
        const div = document.createElement('div');
        div.style.cssText = `display: ${i === 0 ? 'flex' : 'none'}; background: #000;`;
        pagesHost.appendChild(div);
        pageNodes.push(div);
      }
      activePage = 0;
      await renderPage(1);
      updateNav();
    };

    const updateNav = () => {
      navStatus.textContent = `${activePage + 1} / ${pageNodes.length}`;
      prevButton.disabled = activePage === 0;
      nextButton.disabled = activePage >= pageNodes.length - 1;
    };

    const goToPage = async (num) => {
      activePage = Math.max(0, Math.min(num, pageNodes.length - 1));
      pageNodes.forEach((node, i) => {
        node.style.display = i === activePage ? 'flex' : 'none';
      });
      await renderPage(activePage + 1);
      updateNav();
    };

    const setupListeners = () => {
      button.addEventListener('click', () => {
        if (!isFullscreen()) {
          shell.classList.add('fullscreen-mode');
          const req = shell.requestFullscreen || shell.webkitRequestFullscreen;
          if (req) req.call(shell);
        } else {
          shell.classList.remove('fullscreen-mode');
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (!isFullscreen()) shell.classList.remove('fullscreen-mode');
        scheduleRerender();
      });

      prevButton.addEventListener('click', () => goToPage(activePage - 1));
      nextButton.addEventListener('click', () => goToPage(activePage + 1));

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') goToPage(activePage - 1);
        if (e.key === 'ArrowRight') goToPage(activePage + 1);
      });

      pagesHost.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        if (e.touches.length === 2) {
          pinchStartDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          pinchStartZoom = slideZoom;
        }
      });

      pagesHost.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchStartDistance) {
          e.preventDefault();
          const distance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          slideZoom = Math.max(0.7, Math.min(2, pinchStartZoom * (distance / pinchStartDistance)));
          requestRender();
        }
      });

      pagesHost.addEventListener('touchend', (e) => {
        if (touchStartX !== null && touchStartY !== null) {
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
            goToPage(dx > 0 ? activePage - 1 : activePage + 1);
          }
        }
        touchStartX = null;
        touchStartY = null;
        pinchStartDistance = null;
      });

      immersiveMedia.addEventListener('change', () => {
        if (immersiveMedia.matches && isFullscreen() && wantsImmersive) {
          document.body.classList.add('mobile-immersive');
        } else {
          document.body.classList.remove('mobile-immersive');
        }
        scheduleRerender();
      });

      const scheduleRerender = () => {
        window.clearTimeout(rerenderTimer);
        rerenderTimer = window.setTimeout(() => {
          rerenderTimer = null;
          requestRender();
        }, 300);
      };

      window.addEventListener('resize', scheduleRerender);
      window.addEventListener('orientationchange', scheduleRerender);
      document.addEventListener('webkitfullscreenchange', scheduleRerender);
    };

    (async () => {
      try {
        pdfDocumentPromise = pdfjsLib.getDocument('calyr-ai-syntax-concept.pdf').promise;
        const pdf = await pdfDocumentPromise;
        loadingNode.remove();
        await initPages(pdf.numPages);
        setupListeners();
        window.requestAnimationFrame(() => {
          requestRender();
        });
      } catch (err) {
        loadingNode.textContent = 'Error loading presentation.';
        console.error('PDF error:', err);
      }
    })();
  </script>
</body>
</html>
