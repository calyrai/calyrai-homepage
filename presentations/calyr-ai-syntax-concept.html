<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calyr_ai_syntax: Concept and Architecture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Presentation wrapper for the Calyr_ai_syntax concept PDF." />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    :root {
      color-scheme: dark;
      --pdf-app-height: 100vh;
    }

    @supports (height: 100dvh) {
      :root {
        --pdf-app-height: 100dvh;
      }
    }

    html {
      background: #000000;
    }

    body {
      margin: 0;
      background: #000000;
      color: #ebeff4;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    .pdf-shell {
      min-height: var(--pdf-app-height);
      display: flex;
      flex-direction: column;
    }

    body.embed-mode .pdf-shell {
      min-height: 100%;
    }

    body.embed-mode.mobile-immersive .pdf-shell {
      min-height: var(--pdf-app-height);
    }

    .pdf-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(106, 240, 255, 0.14);
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
    }

    body.embed-mode .pdf-header {
      display: none;
    }

    .pdf-header__eyebrow {
      margin: 0 0 4px;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(106, 240, 255, 0.62);
    }

    .pdf-header__title {
      margin: 0;
      font-size: clamp(1.1rem, 1rem + 1.4vw, 2rem);
      line-height: 1.1;
      color: rgba(232, 242, 255, 0.96);
    }

    .pdf-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pdf-link {
      appearance: none;
      cursor: pointer;
      display: inline-block;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(106, 240, 255, 0.26);
      color: rgba(106, 240, 255, 0.9);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(106, 240, 255, 0.07);
      font-family: inherit;
    }

    .pdf-link:hover {
      background: rgba(106, 240, 255, 0.14);
      border-color: rgba(106, 240, 255, 0.48);
    }

    .pdf-stage {
      flex: 1;
      padding: 18px;
      background: #000000;
      position: relative;
    }

    body.embed-mode .pdf-stage {
      padding: 0;
      min-height: var(--pdf-app-height);
    }

    body.embed-mode.mobile-immersive .pdf-stage {
      min-height: var(--pdf-app-height);
    }

    .pdf-stage:fullscreen {
      padding: 0;
      background: #000000;
    }

    .pdf-stage:-webkit-full-screen {
      padding: 0;
      background: #000000;
    }

    .pdf-frame {
      width: 100%;
      min-height: calc(var(--pdf-app-height) - 118px);
      border: 1px solid rgba(160, 196, 255, 0.14);
      border-radius: 14px;
      background: #000000;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      overflow: auto;
    }

    .pdf-stage:fullscreen .pdf-frame,
    .pdf-stage:-webkit-full-screen .pdf-frame {
      overflow: hidden;
    }

    body.embed-mode .pdf-frame {
      min-height: var(--pdf-app-height);
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    body.embed-mode.mobile-immersive .pdf-frame {
      overflow: hidden;
    }

    body.embed-mode.mobile-immersive.landscape-mode .pdf-frame {
      touch-action: pan-x pinch-zoom;
    }

    .pdf-pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 22px 0 28px;
      background: #000000;
    }

    body.embed-mode .pdf-pages {
      padding: 0;
      gap: 0;
    }

    body.embed-mode.mobile-immersive .pdf-pages {
      min-height: var(--pdf-app-height);
    }

    .pdf-page {
      width: min(100%, 1240px);
      display: flex;
      justify-content: center;
      padding: 0 18px;
      box-sizing: border-box;
      background: #000000;
    }

    .pdf-stage:fullscreen .pdf-page,
    .pdf-stage:-webkit-full-screen .pdf-page {
      width: 100%;
      min-height: var(--pdf-app-height);
      align-items: center;
      padding: 20px;
      display: none;
    }

    .pdf-stage:fullscreen .pdf-page.pdf-page--active,
    .pdf-stage:-webkit-full-screen .pdf-page.pdf-page--active {
      display: flex;
    }

    body.embed-mode .pdf-page {
      width: 100%;
      padding: 0;
    }

    body.embed-mode.mobile-immersive .pdf-page {
      min-height: var(--pdf-app-height);
      align-items: center;
      display: none;
      padding: 12px 0;
    }

    body.embed-mode.mobile-immersive .pdf-page.pdf-page--active {
      display: flex;
    }

    .pdf-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #000000;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.34);
    }

    body.embed-mode .pdf-canvas {
      box-shadow: none;
    }

    .pdf-loading,
    .pdf-error {
      padding: 32px 24px;
      text-align: center;
      color: rgba(232, 242, 255, 0.82);
      letter-spacing: 0.04em;
    }

    .pdf-error {
      color: rgba(255, 166, 166, 0.9);
    }

    .pdf-nav-overlay {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 40;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(106, 240, 255, 0.18);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    .pdf-stage:fullscreen .pdf-nav-overlay,
    .pdf-stage:-webkit-full-screen .pdf-nav-overlay {
      display: flex;
    }

    body.embed-mode.mobile-immersive .pdf-nav-overlay {
      display: flex;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      right: 12px;
    }

    body.embed-mode.mobile-immersive.landscape-mode .pdf-nav-overlay {
      display: none;
    }

    .pdf-nav-btn {
      appearance: none;
      cursor: pointer;
      min-width: 42px;
      height: 42px;
      border: 1px solid rgba(106, 240, 255, 0.26);
      border-radius: 999px;
      background: rgba(106, 240, 255, 0.08);
      color: rgba(232, 242, 255, 0.95);
      font: inherit;
      font-size: 1rem;
    }

    .pdf-nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .pdf-nav-status {
      min-width: 68px;
      text-align: center;
      color: rgba(232, 242, 255, 0.9);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .pdf-stage:fullscreen .pdf-frame,
    .pdf-stage:-webkit-full-screen .pdf-frame {
      min-height: var(--pdf-app-height);
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    @media (max-width: 820px) {
      .pdf-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .pdf-stage {
        padding: 12px;
      }

      .pdf-frame {
        min-height: calc(var(--pdf-app-height) - 174px);
      }

      .pdf-nav-overlay {
        right: 12px;
        bottom: 12px;
      }

      .pdf-page {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="pdf-shell">
    <header class="pdf-header">
      <div>
        <p class="pdf-header__eyebrow">Nexus / Presentation</p>
        <h1 class="pdf-header__title">Calyr_ai_syntax: Concept and Architecture</h1>
      </div>
      <div class="pdf-actions">
        <a class="pdf-link" href="../publications.html#calyr-ai-syntax-concept">Back to publications</a>
        <button class="pdf-link" id="fullscreen-toggle" type="button">Fullscreen</button>
      </div>
    </header>
    <main class="pdf-stage" id="pdf-stage">
      <div class="pdf-frame" id="pdf-frame">
        <div class="pdf-pages" id="pdf-pages">
          <div class="pdf-loading" id="pdf-loading">Loading PDF presentation…</div>
        </div>
      </div>
      <div class="pdf-nav-overlay" id="pdf-nav-overlay" aria-label="Presentation navigation">
        <button class="pdf-nav-btn" id="pdf-prev" type="button" aria-label="Previous page">&#8592;</button>
        <div class="pdf-nav-status" id="pdf-nav-status">1 / 1</div>
        <button class="pdf-nav-btn" id="pdf-next" type="button" aria-label="Next page">&#8594;</button>
      </div>
    </main>
  </div>
  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

    const stage = document.getElementById('pdf-stage');
    const button = document.getElementById('fullscreen-toggle');
    const frame = document.getElementById('pdf-frame');
    const pagesHost = document.getElementById('pdf-pages');
    const loadingNode = document.getElementById('pdf-loading');
    const prevButton = document.getElementById('pdf-prev');
    const nextButton = document.getElementById('pdf-next');
    const navStatus = document.getElementById('pdf-nav-status');
    const params = new URLSearchParams(window.location.search);
    const isEmbed = params.get('embed') === '1';
    const wantsImmersive = params.get('immersive') !== '0';
    const immersiveMedia = window.matchMedia('(max-width: 900px) and (pointer: coarse)');
    const landscapeMedia = window.matchMedia('(orientation: landscape)');
    let pageNodes = [];
    let activePage = 0;
    let resizeTimer = null;
    let pdfDocumentPromise = null;
    let renderedWidth = 0;
    let touchStartX = null;
    let touchStartY = null;
    let swipeLocked = false;

    if (!isEmbed) {
      window.location.replace('../explore.html#saxs/calyr-ai-syntax-concept-and-architecture');
    }

    if (isEmbed) {
      document.body.classList.add('embed-mode');
    }

    const isFullscreen = () => document.fullscreenElement === stage || document.webkitFullscreenElement === stage;

    const isImmersive = () => document.body.classList.contains('mobile-immersive');

    const isImmersiveLandscape = () => isImmersive() && landscapeMedia.matches;

    const applyImmersiveMode = () => {
      document.body.classList.toggle('mobile-immersive', isEmbed && wantsImmersive && immersiveMedia.matches && !isFullscreen());
      document.body.classList.toggle('landscape-mode', isImmersiveLandscape());
    };

    const setViewportHeight = () => {
      const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--pdf-app-height', `${Math.round(viewportHeight)}px`);
    };

    const scheduleRender = () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        setViewportHeight();
        applyImmersiveMode();
        renderPdf();
      }, 180);
    };

    const updateButton = () => {
      if (!button) return;
      button.textContent = isFullscreen() ? 'Exit Fullscreen' : 'Fullscreen';
    };

    const notifyParent = () => {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'calyr-presentation-fullscreen',
          active: isFullscreen()
        }, window.location.origin);
      }
    };

    const updateNav = () => {
      const total = pageNodes.length || 1;
      if (navStatus) navStatus.textContent = `${activePage + 1} / ${total}`;
      if (prevButton) prevButton.disabled = activePage <= 0;
      if (nextButton) nextButton.disabled = activePage >= total - 1;
      pageNodes.forEach((node, index) => {
        node.classList.toggle('pdf-page--active', index === activePage);
      });
    };

    const scrollToPage = (index) => {
      if (!pageNodes.length) return;
      activePage = Math.max(0, Math.min(index, pageNodes.length - 1));
      if (isFullscreen() || isImmersive()) {
        frame.scrollTop = 0;
      } else {
        pageNodes[activePage].scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      updateNav();
    };

    const syncActivePageFromScroll = () => {
      if (isFullscreen() || isImmersive()) return;
      if (!pageNodes.length) return;
      const frameTop = frame.getBoundingClientRect().top;
      let bestIndex = activePage;
      let bestDistance = Number.POSITIVE_INFINITY;

      pageNodes.forEach((node, index) => {
        const distance = Math.abs(node.getBoundingClientRect().top - frameTop);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = index;
        }
      });

      if (bestIndex !== activePage) {
        activePage = bestIndex;
        updateNav();
      }
    };

    const enterFullscreen = async () => {
      if (stage.requestFullscreen) {
        await stage.requestFullscreen();
        return;
      }
      if (stage.webkitRequestFullscreen) {
        stage.webkitRequestFullscreen();
      }
    };

    const exitFullscreen = async () => {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
        return;
      }
      if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    };

    if (button) {
      button.addEventListener('click', async () => {
        if (isFullscreen()) {
          await exitFullscreen();
        } else {
          await enterFullscreen();
        }
        updateButton();
      });
    }

    if (prevButton) {
      prevButton.addEventListener('click', () => scrollToPage(activePage - 1));
    }

    if (nextButton) {
      nextButton.addEventListener('click', () => scrollToPage(activePage + 1));
    }

    async function renderPdf(force = false) {
      try {
        if (!pdfDocumentPromise) {
          pdfDocumentPromise = pdfjsLib.getDocument('calyr-ai-syntax-concept.pdf').promise;
        }

        const pdf = await pdfDocumentPromise;
        const containerWidth = Math.max(stage.clientWidth - (isEmbed ? 0 : 48), 320);

        if (!force && pageNodes.length && Math.abs(containerWidth - renderedWidth) < 2) {
          updateNav();
          return;
        }

        renderedWidth = containerWidth;
        const preservedActivePage = activePage;

        pagesHost.innerHTML = '';
        pageNodes = [];

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const initialViewport = page.getViewport({ scale: 1 });
          const scale = containerWidth / initialViewport.width;
          const viewport = page.getViewport({ scale });

          const pageWrap = document.createElement('div');
          pageWrap.className = 'pdf-page';
          pageWrap.dataset.pageNumber = String(pageNumber);

          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-canvas';
          const context = canvas.getContext('2d', { alpha: false });

          canvas.width = Math.floor(viewport.width * window.devicePixelRatio);
          canvas.height = Math.floor(viewport.height * window.devicePixelRatio);
          canvas.style.aspectRatio = `${viewport.width} / ${viewport.height}`;

          const renderViewport = page.getViewport({ scale: scale * window.devicePixelRatio });
          await page.render({
            canvasContext: context,
            viewport: renderViewport
          }).promise;

          pageWrap.appendChild(canvas);
          pagesHost.appendChild(pageWrap);
          pageNodes.push(pageWrap);
        }

        activePage = Math.max(0, Math.min(preservedActivePage, pageNodes.length - 1));
        if (isFullscreen() || isImmersive()) {
          frame.scrollTop = 0;
        } else if (pageNodes[activePage]) {
          pageNodes[activePage].scrollIntoView({ behavior: 'auto', block: 'start' });
        }
        updateNav();
      } catch (error) {
        pagesHost.innerHTML = '<div class="pdf-error">Could not render the embedded PDF presentation.</div>';
        pageNodes = [];
        activePage = 0;
        updateNav();
      }
    }

    window.addEventListener('resize', scheduleRender);
    window.addEventListener('orientationchange', scheduleRender);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleRender);
    }
    if (immersiveMedia.addEventListener) {
      immersiveMedia.addEventListener('change', scheduleRender);
    } else if (immersiveMedia.addListener) {
      immersiveMedia.addListener(scheduleRender);
    }
    if (landscapeMedia.addEventListener) {
      landscapeMedia.addEventListener('change', scheduleRender);
    } else if (landscapeMedia.addListener) {
      landscapeMedia.addListener(scheduleRender);
    }

    frame.addEventListener('scroll', syncActivePageFromScroll, { passive: true });

    frame.addEventListener('touchstart', (event) => {
      if (!isImmersiveLandscape() || event.touches.length !== 1) {
        touchStartX = null;
        touchStartY = null;
        swipeLocked = false;
        return;
      }

      const touch = event.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      swipeLocked = false;
    }, { passive: true });

    frame.addEventListener('touchmove', (event) => {
      if (!isImmersiveLandscape() || touchStartX === null || touchStartY === null || swipeLocked) {
        return;
      }

      const touch = event.touches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      if (Math.abs(deltaX) < 18) {
        return;
      }

      if (Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
        event.preventDefault();
      }
    }, { passive: false });

    frame.addEventListener('touchend', (event) => {
      if (!isImmersiveLandscape() || touchStartX === null || touchStartY === null || swipeLocked) {
        touchStartX = null;
        touchStartY = null;
        swipeLocked = false;
        return;
      }

      const touch = event.changedTouches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      touchStartX = null;
      touchStartY = null;

      if (Math.abs(deltaX) < 60 || Math.abs(deltaX) <= Math.abs(deltaY) * 1.2) {
        return;
      }

      swipeLocked = true;
      if (deltaX < 0) {
        scrollToPage(activePage + 1);
      } else {
        scrollToPage(activePage - 1);
      }

      window.setTimeout(() => {
        swipeLocked = false;
      }, 180);
    }, { passive: true });

    frame.addEventListener('touchcancel', () => {
      touchStartX = null;
      touchStartY = null;
      swipeLocked = false;
    }, { passive: true });

    document.addEventListener('keydown', (event) => {
      if (!isFullscreen()) return;
      if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
        event.preventDefault();
        scrollToPage(activePage + 1);
      }
      if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
        event.preventDefault();
        scrollToPage(activePage - 1);
      }
      if (event.key === 'Home') {
        event.preventDefault();
        scrollToPage(0);
      }
      if (event.key === 'End') {
        event.preventDefault();
        scrollToPage(pageNodes.length - 1);
      }
    });

    document.addEventListener('fullscreenchange', updateButton);
    document.addEventListener('webkitfullscreenchange', updateButton);
    document.addEventListener('fullscreenchange', notifyParent);
    document.addEventListener('webkitfullscreenchange', notifyParent);
    document.addEventListener('fullscreenchange', applyImmersiveMode);
    document.addEventListener('webkitfullscreenchange', applyImmersiveMode);
    document.addEventListener('fullscreenchange', scheduleRender);
    document.addEventListener('webkitfullscreenchange', scheduleRender);
    setViewportHeight();
    applyImmersiveMode();
    updateButton();
    updateNav();

    window.__calyrPresentation = {
      isFullscreen,
      enterFullscreen,
      exitFullscreen,
      toggleFullscreen: async () => {
        if (isFullscreen()) {
          await exitFullscreen();
        } else {
          await enterFullscreen();
        }
        updateButton();
        updateNav();
      },
      nextPage: () => scrollToPage(activePage + 1),
      previousPage: () => scrollToPage(activePage - 1),
      goToPage: (index) => scrollToPage(index),
      goToLastPage: () => scrollToPage(pageNodes.length - 1)
    };

    renderPdf(true);
  </script>
</body>
</html>
