<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nexus.warehouse</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    body.fullscreen-mode #controls {
      display: none;
    }
    #controls {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      gap: 8px;
    }
    button {
      appearance: none;
      background: rgba(36, 243, 255, 0.12);
      border: 1px solid rgba(36, 243, 255, 0.34);
      color: rgba(36, 243, 255, 0.86);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    button:hover {
      background: rgba(36, 243, 255, 0.22);
      color: rgba(36, 243, 255, 0.96);
    }
    #pdf-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #pdf-canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
    #loading {
      color: #24f3ff;
      position: absolute;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="fullscreen-btn">Fullscreen</button>
  </div>
  <div id="pdf-container">
    <div id="loading">Loading PDF…</div>
    <canvas id="pdf-canvas"></canvas>
  </div>

  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

    const canvas = document.getElementById('pdf-canvas');
    const loadingDiv = document.getElementById('loading');
    const container = document.getElementById('pdf-container');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    let currentPage = 1;
    let pdfDoc = null;

    async function renderPage(pageNum) {
      if (!pdfDoc) return;
      const page = await pdfDoc.getPage(Math.min(pageNum, pdfDoc.numPages));
      const scale = Math.min(window.innerWidth / page.getViewport({ scale: 1 }).width, window.innerHeight / page.getViewport({ scale: 1 }).height, 2);
      const viewport = page.getViewport({ scale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    fullscreenBtn.addEventListener('click', async () => {
      if (!document.fullscreenElement) {
        await container.requestFullscreen().catch(err => console.error('Fullscreen failed:', err));
        document.body.classList.add('fullscreen-mode');
      } else {
        await document.exitFullscreen();
        document.body.classList.remove('fullscreen-mode');
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        document.body.classList.remove('fullscreen-mode');
      }
    });

    async function init() {
      try {
        pdfDoc = await pdfjsLib.getDocument('nexus-data-warehouse-concepts-slides.pdf').promise;
        loadingDiv.style.display = 'none';
        canvas.style.display = 'block';
        await renderPage(1);
        
        window.addEventListener('resize', () => renderPage(currentPage));
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight') renderPage(++currentPage);
          else if (e.key === 'ArrowLeft') renderPage(--currentPage);
        });
      } catch (err) {
        loadingDiv.textContent = 'Error loading PDF';
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
