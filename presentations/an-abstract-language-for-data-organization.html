<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>calyr.ai.nexus.datawarehouse</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .pdf-shell {
      position: fixed;
      inset: 0;
      background: #000;
    }
    .pdf-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
    .fullscreen-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
      border: 1px solid #2be6ff;
      background: rgba(0, 0, 0, 0.6);
      color: #bff7ff;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      border-radius: 6px;
    }
    :fullscreen .fullscreen-btn,
    :-webkit-full-screen .fullscreen-btn {
      display: none;
    }
  </style>
</head>
<body>
  <button id="fullscreen-toggle" class="fullscreen-btn" type="button">Fluscreen</button>
  <main id="pdf-shell" class="pdf-shell">
    <iframe class="pdf-frame" src="nexus-data-warehouse-concepts-slides.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH" title="calyr.ai.nexus.datawarehouse PDF" allowfullscreen></iframe>
  </main>

  <script>
    const shell = document.getElementById('pdf-shell');
    const button = document.getElementById('fullscreen-toggle');

    function isFullscreen() {
      return document.fullscreenElement === shell || document.webkitFullscreenElement === shell;
    }

    async function toggleFullscreen() {
      if (isFullscreen()) {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        return;
      }
      if (shell.requestFullscreen) await shell.requestFullscreen();
      else if (shell.webkitRequestFullscreen) shell.webkitRequestFullscreen();
    }

    button.addEventListener('click', () => {
      toggleFullscreen().catch(() => {});
    });
  </script>
</body>
</html>
