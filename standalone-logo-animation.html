<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calyr Arrival Ink Concept</title>
  <style>
    :root {
      --bg-0: #000000;
      --bg-1: #04070f;
      --ink: #f5fbff;
      --muted: rgba(220, 238, 255, 0.68);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(110vmax 84vmax at 50% 45%, var(--bg-1), var(--bg-0) 70%),
        #000;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
    }

    .hero {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .logo-wrap {
      width: min(920px, 96vw);
      aspect-ratio: 16 / 10;
      position: relative;
    }

    #scene {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 20px;
      background: radial-gradient(90% 90% at 50% 45%, rgba(22, 34, 56, 0.18), rgba(0, 0, 0, 0.15));
    }

    .wordmark {
      position: absolute;
      left: 50%;
      bottom: 4%;
      transform: translateX(-50%);
      letter-spacing: 0.24em;
      font-size: clamp(12px, 1.15vw, 16px);
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 0 20px rgba(174, 236, 255, 0.28);
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .wordmark {
        text-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="logo-wrap" aria-label="Calyr arrival concept logo">
      <canvas id="scene" width="960" height="600" aria-label="Calyr Arrival ink ring"></canvas>
      <div class="wordmark">Calyr.ai Arrival Concept</div>
    </div>
  </main>

  <script>
    (function () {
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

      const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const ringRadius = 170;
      const ringYScale = 0.84;
      const nodeCount = 88;
      const travelDuration = prefersReduced ? 400 : 2400;
      const drawDuration = prefersReduced ? 700 : 3600;
      const trailLength = prefersReduced ? 20 : 94;
      const slitWidth = 1;
      const slitHeight = 430;
      const focusOrbitRadiusX = ringRadius * 0.78;
      const focusOrbitRadiusY = ringRadius * ringYScale * 0.62;
      const nodes = [];
      const noiseSeeds = [];
      let frozen = false;
      let finalSnapshot = null;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.floor(rect.width * DPR);
        canvas.height = Math.floor(rect.height * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      resize();
      window.addEventListener("resize", resize);

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function easeInOut(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      for (let i = 0; i < 8; i += 1) {
        noiseSeeds.push(rand(0, Math.PI * 2));
      }

      for (let i = 0; i < nodeCount; i += 1) {
        const a = (Math.PI * 2 * i) / nodeCount;
        const sourceY = rand(-8, 8);
        nodes.push({
          a,
          sourceX: rand(-0.4, 0.4),
          sourceY,
          orbitNoise: rand(-0.08, 0.08),
          waveGroup: i % 3,
          wavePhase: rand(0, Math.PI * 2),
          size: rand(1.2, 3.6),
          x: rand(-0.4, 0.4),
          y: sourceY,
          px: 0,
          py: sourceY,
          history: []
        });
      }

      const start = performance.now();

      function drawBackground(width, height) {
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(0, 0, 0, 0.03)";
        ctx.fillRect(0, 0, width, height);
      }

      function frame(now) {
        if (frozen && finalSnapshot) {
          ctx.putImageData(finalSnapshot, 0, 0);
          return;
        }

        const elapsed = now - start;
        const t = elapsed * 0.001;
        const travelPhase = clamp(elapsed / travelDuration, 0, 1);
        const travelEased = easeInOut(travelPhase);
        const drawPhase = clamp((elapsed - travelDuration) / drawDuration, 0, 1);
        const drawingOnRing = elapsed >= travelDuration;

        const width = canvas.width / DPR;
        const height = canvas.height / DPR;
        const cx = width * 0.5;
        const cy = height * 0.47;

        drawBackground(width, height);

        ctx.save();
        ctx.translate(cx, cy);

        const slitPulse = 0.35;
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = "rgba(170,236,255," + slitPulse.toFixed(3) + ")";
        ctx.fillRect(-slitWidth * 0.5, -slitHeight * 0.5, slitWidth, slitHeight);
        ctx.fillStyle = "rgba(245,252,255,0.88)";
        ctx.fillRect(-0.5, -slitHeight * 0.5, 1, slitHeight);

        const focusA = drawPhase * Math.PI * 2 + Math.PI * 0.16;
        const focusX = Math.cos(focusA) * focusOrbitRadiusX;
        const focusY = Math.sin(focusA) * focusOrbitRadiusY;

        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = "rgba(255, 77, 245, 0.14)";
        ctx.beginPath();
        ctx.arc(focusX, focusY, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255, 77, 245, 0.33)";
        ctx.beginPath();
        ctx.arc(focusX, focusY, 7, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < nodes.length; i += 1) {
          const n = nodes[i];
          const group = n.waveGroup;
          const waveSpeed = group === 0 ? 0.56 : (group === 1 ? 0.84 : 1.22);
          const waveAmp = group === 0 ? 3.6 : (group === 1 ? 7.8 : 11.2);
          const swirl = Math.sin(t * waveSpeed + n.wavePhase + noiseSeeds[i % noiseSeeds.length] + n.a * 2.2) * waveAmp;
          const rough = 1 + Math.sin(t * (0.62 + group * 0.24) + n.a * 5.2) * (0.06 + group * 0.04);
          const gapWave = Math.abs(Math.sin(n.a * 1.5 + t * 0.19));
          const gapFactor = clamp((gapWave - 0.18) / 0.82, 0, 1);

          const orbitA = n.a + drawPhase * Math.PI * 2;
          const tx = Math.cos(orbitA) * ringRadius * rough * (0.88 + gapFactor * 0.22);
          const ty = Math.sin(orbitA) * ringRadius * ringYScale * rough * (0.9 + gapFactor * 0.2) + swirl * 0.16 + n.orbitNoise * 18;

          const dxFocus = tx - focusX;
          const dyFocus = ty - focusY;
          const distFocus = Math.hypot(dxFocus, dyFocus);
          const influence = clamp(1 - distFocus / 84, 0, 1);
          let fx = tx;
          let fy = ty;
          if (influence > 0) {
            const inv = 1 / Math.max(0.001, distFocus);
            const nx = dxFocus * inv;
            const ny = dyFocus * inv;
            if (group === 0) {
              // Wave 0 is pulled toward the magenta focus.
              fx -= nx * influence * 18;
              fy -= ny * influence * 18;
            } else if (group === 1) {
              // Wave 1 is pushed outward from the magenta focus.
              fx += nx * influence * 22;
              fy += ny * influence * 22;
            } else {
              // Wave 2 orbits around the focus tangentially.
              fx += -ny * influence * 14;
              fy += nx * influence * 14;
            }
          }

          const sourceX = n.sourceX;
          const sourceY = n.sourceY;

          n.px = n.x;
          n.py = n.y;
          n.x = sourceX + (fx - sourceX) * travelEased;
          n.y = sourceY + (fy - sourceY) * travelEased;

          // Only start trail history once particle has reached the circle.
          if (drawingOnRing) {
            n.history.push({ x: n.x, y: n.y });
            if (n.history.length > trailLength) {
              n.history.shift();
            }
          } else if (n.history.length) {
            n.history.length = 0;
          }

          const vx = n.x - n.px;
          const vy = n.y - n.py;

          const speed = Math.hypot(vx, vy);
          const tailAlpha = clamp(speed * 0.09, 0.02, 0.24);

          if (n.history.length > 2 && drawingOnRing) {
            ctx.globalCompositeOperation = "lighter";
            ctx.beginPath();
            ctx.moveTo(n.history[0].x, n.history[0].y);
            for (let h = 1; h < n.history.length; h += 1) {
              ctx.lineTo(n.history[h].x, n.history[h].y);
            }
            const historyStrength = clamp((n.history.length / trailLength) * 0.28, 0.1, 0.28);
            const strokeColor = group === 0
              ? "rgba(150,232,255,"
              : (group === 1 ? "rgba(188,224,255," : "rgba(255,150,245,");
            ctx.strokeStyle = strokeColor + historyStrength.toFixed(3) + ")";
            ctx.lineWidth = clamp(n.size * 0.66, 0.9, 2.2);
            ctx.stroke();
          }

          ctx.globalCompositeOperation = "lighter";
          for (let k = 1; k <= 5; k += 1) {
            const txk = n.x - vx * k * 3.2;
            const tyk = n.y - vy * k * 3.2;
            const rr = Math.max(0.5, n.size - k * 0.42);
            const tailBase = group === 2 ? "rgba(255,160,246," : "rgba(156,235,255,";
            ctx.fillStyle = tailBase + (tailAlpha * (1 - k * 0.16)).toFixed(3) + ")";
            ctx.beginPath();
            ctx.arc(txk, tyk, rr, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = "rgba(248,253,255," + (0.34 + travelEased * 0.5).toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.size, 0, Math.PI * 2);
          ctx.fill();
        }

        const inflowDensity = prefersReduced ? 2 : 7;
        for (let i = 0; i < inflowDensity; i += 1) {
          const p = (t * 0.62 + i / inflowDensity) % 1;
          const eased = easeInOut(p);
          const ix = Math.sin(t * 2.7 + i * 1.3) * 0.45;
          const iy = Math.sin(t * 3.2 + i * 1.6) * 14 + (eased - 0.5) * 26;
          const ir = 1.2 + (1 - p) * 1.8;

          ctx.globalCompositeOperation = "lighter";
          for (let k = 0; k < 4; k += 1) {
            const txk = ix - (k + 1) * 1.9;
            const tyk = iy + Math.sin(t * 5 + k + i) * 1.2;
            ctx.fillStyle = "rgba(148,235,255," + (0.2 - k * 0.042).toFixed(3) + ")";
            ctx.beginPath();
            ctx.arc(txk, tyk, Math.max(0.45, ir - k * 0.35), 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = "rgba(248,252,255,0.5)";
          ctx.beginPath();
          ctx.arc(ix, iy, ir, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();

        // Freeze final, fully drawn symbol.
        if (!frozen && drawPhase >= 1) {
          frozen = true;
          finalSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
          return;
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
