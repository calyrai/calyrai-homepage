<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calyr Arrival Ink Concept</title>
  <style>
    :root {
      --bg-0: #000000;
      --bg-1: #04070f;
      --ink: #f5fbff;
      --muted: rgba(220, 238, 255, 0.68);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(110vmax 84vmax at 50% 45%, var(--bg-1), var(--bg-0) 70%),
        #000;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
    }

    .hero {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .logo-wrap {
      width: min(920px, 96vw);
      aspect-ratio: 16 / 10;
      position: relative;
    }

    #scene {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 20px;
      background: radial-gradient(90% 90% at 50% 45%, rgba(22, 34, 56, 0.18), rgba(0, 0, 0, 0.15));
    }

    .wordmark {
      position: absolute;
      left: 50%;
      bottom: 4%;
      transform: translateX(-50%);
      letter-spacing: 0.24em;
      font-size: clamp(12px, 1.15vw, 16px);
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 0 20px rgba(174, 236, 255, 0.28);
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .wordmark {
        text-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="logo-wrap" aria-label="Calyr arrival concept logo">
      <canvas id="scene" width="960" height="600" aria-label="Calyr Arrival ink ring"></canvas>
      <div class="wordmark">Calyr.ai Arrival Concept</div>
    </div>
  </main>

  <script>
    (function () {
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

      const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const ringRadius = 170;
      const ringYScale = 0.84;
      const nodeCount = 96;
      const phaseDuration = prefersReduced ? 500 : 4200;
      const inflowSpeed = prefersReduced ? 0.00015 : 0.00062;
      const trailLength = prefersReduced ? 16 : 84;
      const slitWidth = 2.2;
      const slitHeight = 430;
      const droplets = [];
      const embers = [];
      const nodes = [];
      const noiseSeeds = [];

      function resize() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.floor(rect.width * DPR);
        canvas.height = Math.floor(rect.height * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      resize();
      window.addEventListener("resize", resize);

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function easeInOut(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function spawnDroplet(x, y, vx, vy, size, life, alpha) {
        droplets.push({ x, y, vx, vy, size, life, maxLife: life, alpha });
      }

      function spawnEmber(x, y, r, life) {
        embers.push({ x, y, r, life, maxLife: life });
      }

      for (let i = 0; i < 8; i += 1) {
        noiseSeeds.push(rand(0, Math.PI * 2));
      }

      for (let i = 0; i < nodeCount; i += 1) {
        const a = (Math.PI * 2 * i) / nodeCount;
        nodes.push({
          a,
          spin: rand(0.00006, 0.00012),
          size: rand(1.2, 3.6),
          x: rand(-slitWidth, slitWidth),
          y: ((i / (nodeCount - 1)) - 0.5) * slitHeight,
          px: 0,
          py: 0,
          history: [],
          w: 0
        });
      }

      const start = performance.now();

      function frame(now) {
        const elapsed = now - start;
        const t = elapsed * 0.001;
        const phase = clamp(elapsed / phaseDuration, 0, 1);
        const phaseEased = easeInOut(phase);

        const width = canvas.width / DPR;
        const height = canvas.height / DPR;
        const cx = width * 0.5;
        const cy = height * 0.47;

        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(0, 0, 0, 0.03)";
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(cx, cy);

        const slitPulse = 0.2 + Math.sin(t * 1.1) * 0.07;
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = "rgba(170,236,255," + slitPulse.toFixed(3) + ")";
        ctx.fillRect(-slitWidth * 0.5, -slitHeight * 0.5, slitWidth, slitHeight);
        ctx.fillStyle = "rgba(245,252,255,0.35)";
        ctx.fillRect(-0.5, -slitHeight * 0.5, 1, slitHeight);

        let leftMass = 0;

        for (let i = 0; i < nodes.length; i += 1) {
          const n = nodes[i];
          const swirl = Math.sin(t * 0.54 + noiseSeeds[i % noiseSeeds.length] + n.a * 2.2) * 3.8;
          const rough = 1 + Math.sin(t * 0.68 + n.a * 5.2) * 0.06;

          // Deformed orbit with two gaps so trajectories visibly draw an Arrival-like symbol.
          const gapWave = Math.abs(Math.sin(n.a * 1.5 + t * 0.19));
          const gapFactor = clamp((gapWave - 0.18) / 0.82, 0, 1);

          const orbitA = n.a + elapsed * n.spin;
          const tx = Math.cos(orbitA) * ringRadius * rough * (0.88 + gapFactor * 0.22);
          const ty = Math.sin(orbitA) * ringRadius * ringYScale * rough * (0.9 + gapFactor * 0.2) + swirl * 0.16;

          const sourceX = Math.sin(t * 2.2 + n.a * 7) * slitWidth;
          const sourceY = ((i / (nodeCount - 1)) - 0.5) * slitHeight + Math.sin(t * 1.6 + n.a * 4.2) * 10;

          n.px = n.x;
          n.py = n.y;
          n.x = sourceX + (tx - sourceX) * phaseEased;
          n.y = sourceY + (ty - sourceY) * phaseEased;

          n.history.push({ x: n.x, y: n.y });
          if (n.history.length > trailLength) {
            n.history.shift();
          }

          const vx = n.x - n.px;
          const vy = n.y - n.py;

          const speed = Math.hypot(vx, vy);
          const tailAlpha = clamp(speed * 0.09, 0.03, 0.28);

          if (n.history.length > 2) {
            ctx.globalCompositeOperation = "lighter";
            ctx.beginPath();
            ctx.moveTo(n.history[0].x, n.history[0].y);
            for (let h = 1; h < n.history.length; h += 1) {
              ctx.lineTo(n.history[h].x, n.history[h].y);
            }
            const historyStrength = clamp((n.history.length / trailLength) * 0.26, 0.08, 0.26);
            ctx.strokeStyle = "rgba(150,232,255," + historyStrength.toFixed(3) + ")";
            ctx.lineWidth = clamp(n.size * 0.66, 0.9, 2.2);
            ctx.stroke();
          }

          ctx.globalCompositeOperation = "lighter";
          for (let k = 1; k <= 5; k += 1) {
            const txk = n.x - vx * k * 3.2;
            const tyk = n.y - vy * k * 3.2;
            const rr = Math.max(0.5, n.size - k * 0.42);
            ctx.fillStyle = "rgba(156,235,255," + (tailAlpha * (1 - k * 0.16)).toFixed(3) + ")";
            ctx.beginPath();
            ctx.arc(txk, tyk, rr, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = "rgba(248,253,255," + (0.34 + phaseEased * 0.5).toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.size, 0, Math.PI * 2);
          ctx.fill();

          if (Math.cos(orbitA) < -0.65) {
            leftMass += 1;
            if (!prefersReduced && Math.random() < 0.1) {
              spawnEmber(n.x + rand(-6, 6), n.y + rand(-6, 6), rand(1.6, 3.8), rand(18, 44));
            }
          }

          if (!prefersReduced && Math.random() < 0.06) {
            spawnDroplet(
              n.x,
              n.y,
              vx * 0.25 + rand(-0.24, 0.24),
              vy * 0.25 + rand(-0.24, 0.24),
              rand(0.8, 2.1),
              rand(20, 50),
              rand(0.08, 0.28)
            );
          }
        }

        const inflowDensity = prefersReduced ? 2 : 7;
        for (let i = 0; i < inflowDensity; i += 1) {
          const p = (t * inflowSpeed * 1000 + i / inflowDensity) % 1;
          const eased = easeInOut(p);
          const ix = (Math.sin(t * 2.7 + i * 1.3) * slitWidth) + (Math.cos(t * 0.8 + i) * 8) * phaseEased;
          const iy = -slitHeight * 0.5 + eased * slitHeight + Math.sin(t * 2.5 + i * 1.4) * 12;
          const ir = 1.2 + (1 - p) * 1.8;

          ctx.globalCompositeOperation = "lighter";
          for (let k = 0; k < 4; k += 1) {
            const txk = ix - (k + 1) * 1.9;
            const tyk = iy + Math.sin(t * 5 + k + i) * 1.2;
            ctx.fillStyle = "rgba(148,235,255," + (0.2 - k * 0.042).toFixed(3) + ")";
            ctx.beginPath();
            ctx.arc(txk, tyk, Math.max(0.45, ir - k * 0.35), 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = "rgba(248,252,255,0.5)";
          ctx.beginPath();
          ctx.arc(ix, iy, ir, 0, Math.PI * 2);
          ctx.fill();

          if (!prefersReduced && Math.random() < 0.08) {
            spawnDroplet(ix, iy, rand(0.2, 0.8), rand(-0.3, 0.3), rand(0.7, 1.6), rand(16, 34), rand(0.09, 0.26));
          }
        }

        for (let i = droplets.length - 1; i >= 0; i -= 1) {
          const d = droplets[i];
          d.x += d.vx;
          d.y += d.vy;
          d.vx *= 0.992;
          d.vy *= 0.992;
          d.life -= 1;
          const p = d.life / d.maxLife;
          if (d.life <= 0) {
            droplets.splice(i, 1);
            continue;
          }
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = "rgba(160,240,255," + (d.alpha * p).toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.size * (0.65 + p * 0.5), 0, Math.PI * 2);
          ctx.fill();
        }

        for (let i = embers.length - 1; i >= 0; i -= 1) {
          const e = embers[i];
          e.life -= 1;
          if (e.life <= 0) {
            embers.splice(i, 1);
            continue;
          }
          const p = e.life / e.maxLife;
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = "rgba(246,252,255," + (0.17 * p).toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.r * (1.1 - p * 0.4), 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(255,255,255," + clamp(leftMass / nodeCount * 0.13, 0.02, 0.16).toFixed(3) + ")";
        ctx.beginPath();
        ctx.ellipse(0, 0, 8, 52, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
