<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calyr Arrival Ink Concept</title>
  <style>
    :root {
      --bg-0: #000000;
      --bg-1: #04070f;
      --ink: #f5fbff;
      --muted: rgba(220, 238, 255, 0.68);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(110vmax 84vmax at 50% 45%, var(--bg-1), var(--bg-0) 70%),
        #000;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
    }

    .hero {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .logo-wrap {
      width: min(920px, 96vw);
      aspect-ratio: 16 / 10;
      position: relative;
    }

    #scene {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 20px;
      background: radial-gradient(90% 90% at 50% 45%, rgba(22, 34, 56, 0.18), rgba(0, 0, 0, 0.15));
    }

    .wordmark {
      position: absolute;
      left: 50%;
      bottom: 4%;
      transform: translateX(-50%);
      letter-spacing: 0.02em;
      font-size: clamp(30px, 4.9vw, 62px);
      font-family: "Avenir Next", Avenir, "Segoe UI", Arial, sans-serif;
      font-weight: 500;
      color: rgba(244, 249, 255, 0.96);
      text-transform: none;
      white-space: nowrap;
      text-shadow: 0 0 18px rgba(174, 236, 255, 0.1);
      pointer-events: none;
    }

    .wordmark .glow-i {
      color: #ff7bf2;
      text-shadow:
        0 0 8px rgba(255, 176, 247, 0.82),
        0 0 18px rgba(255, 96, 232, 0.74),
        0 0 34px rgba(214, 52, 255, 0.62);
      transition: text-shadow 320ms ease, color 320ms ease;
    }

    .wordmark .glow-i.final-glow {
      color: #ff9bf6;
      text-shadow:
        0 0 10px rgba(255, 176, 247, 0.95),
        0 0 24px rgba(255, 88, 232, 0.9),
        0 0 48px rgba(218, 56, 255, 0.82),
        0 0 72px rgba(188, 44, 255, 0.55);
      animation: finalPulse 1800ms ease-in-out infinite;
    }

    @keyframes finalPulse {
      0%, 100% {
        text-shadow:
          0 0 8px rgba(255, 176, 247, 0.8),
          0 0 20px rgba(255, 88, 232, 0.76),
          0 0 38px rgba(218, 56, 255, 0.62),
          0 0 58px rgba(188, 44, 255, 0.42);
      }
      50% {
        text-shadow:
          0 0 12px rgba(255, 188, 249, 0.98),
          0 0 30px rgba(255, 102, 234, 0.95),
          0 0 58px rgba(222, 64, 255, 0.9),
          0 0 84px rgba(192, 54, 255, 0.66);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .wordmark {
        text-shadow: none;
      }

      .wordmark .glow-i {
        text-shadow: 0 0 10px rgba(255, 144, 241, 0.65);
      }

      .wordmark .glow-i.final-glow {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="logo-wrap" aria-label="Calyr arrival concept logo">
      <canvas id="scene" width="960" height="600" aria-label="Calyr Arrival ink ring"></canvas>
      <div class="wordmark" aria-label="Calyr.ai">
        Calyr.a<span class="glow-i">í</span>
      </div>
    </div>
  </main>

  <script>
    class ArrivalInkScene {
      constructor(canvas, glowEl) {
        this.canvas = canvas;
        this.glowEl = glowEl;
        this.ctx = canvas.getContext("2d");
        this.dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        this.prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        this.config = this.createConfig();
        this.state = {
          nodes: [],
          noiseSeeds: [],
          start: performance.now(),
          frozen: false,
          finalSnapshot: null
        };

        this.onResize = () => this.resize();
        this.resize();
        window.addEventListener("resize", this.onResize);

        this.initNoiseSeeds();
        this.initNodes();
      }

      createConfig() {
        const ringRadius = 170;
        const ringYScale = 0.84;

        return {
          ringRadius,
          ringYScale,
          nodeCount: 104,
          travelDuration: this.prefersReduced ? 400 : 2400,
          drawDuration: this.prefersReduced ? 700 : 3600,
          trailLength: this.prefersReduced ? 72 : 420,
          maxSplineStep: 34,
          continuityFilter: this.prefersReduced ? 0.34 : 0.12,
          diffusionPasses: this.prefersReduced ? 1 : 3,
          barcodeStrokeCount: 0,
          slitWidth: 0.6,
          slitHeight: 430,
          slitX: -14,
          lensX: ringRadius * 0.56,
          lensY: -ringRadius * ringYScale * 0.31,
          lensObstacleR: 22,
          lensRange: 220,
          coreVoidAngle: -0.56 - (Math.PI / 2),
          coreVoidLength: 136,
          coreVoidWidth: 16,
          inflowDensity: this.prefersReduced ? 2 : 7
        };
      }

      rand(min, max) {
        return min + Math.random() * (max - min);
      }

      clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      easeInOut(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      organicNoise(t, seed) {
        return (
          Math.sin(t * 0.83 + seed) * 0.55 +
          Math.sin(t * 1.97 + seed * 1.7) * 0.3 +
          Math.sin(t * 3.41 + seed * 2.3) * 0.15
        );
      }

      resize() {
        const rect = this.canvas.getBoundingClientRect();
        this.canvas.width = Math.floor(rect.width * this.dpr);
        this.canvas.height = Math.floor(rect.height * this.dpr);
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      }

      initNoiseSeeds() {
        for (let i = 0; i < 8; i += 1) {
          this.state.noiseSeeds.push(this.rand(0, Math.PI * 2));
        }
      }

      initNodes() {
        const { nodeCount, slitX } = this.config;
        for (let i = 0; i < nodeCount; i += 1) {
          const a = (Math.PI * 2 * i) / nodeCount;
          const sourceY = this.rand(-8, 8);
          const sourceX = slitX + this.rand(-0.24, 0.24);
          this.state.nodes.push({
            a,
            sourceX,
            sourceY,
            orbitNoise: this.rand(-0.08, 0.08),
            waveGroup: i % 3,
            wavePhase: this.rand(0, Math.PI * 2),
            hitsLens: (i % 5 === 0 || i % 7 === 0),
            organicSeed: this.rand(0, Math.PI * 2),
            radialBias: this.rand(-0.12, 0.16),
            size: this.rand(1.2, 3.6),
            x: sourceX,
            y: sourceY,
            fx: sourceX,
            fy: sourceY,
            px: sourceX,
            py: sourceY,
            history: []
          });
        }
      }

      drawBackground(width, height) {
        this.ctx.globalCompositeOperation = "source-over";
        this.ctx.fillStyle = "rgba(0, 0, 0, 0.03)";
        this.ctx.fillRect(0, 0, width, height);
      }

      drawSmoothSpline(points, tension) {
        if (points.length < 2) {
          return;
        }
        if (points.length === 2) {
          this.ctx.moveTo(points[0].x, points[0].y);
          this.ctx.lineTo(points[1].x, points[1].y);
          return;
        }

        this.ctx.moveTo(points[0].x, points[0].y);
        for (let i = 0; i < points.length - 1; i += 1) {
          const p0 = points[Math.max(0, i - 1)];
          const p1 = points[i];
          const p2 = points[i + 1];
          const p3 = points[Math.min(points.length - 1, i + 2)];

          const cp1x = p1.x + (p2.x - p0.x) * tension;
          const cp1y = p1.y + (p2.y - p0.y) * tension;
          const cp2x = p2.x - (p3.x - p1.x) * tension;
          const cp2y = p2.y - (p3.y - p1.y) * tension;

          this.ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
        }
      }

      drawAcuteOverlay() {
        const ctx = this.ctx;
        const { lensX, lensY } = this.config;
        // Render obstacle as i-stem + glowing acute. Only acute should glow.
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.translate(lensX + 4.8, lensY - 8.2);

        // Draw a clear upright lowercase "i" as obstacle body (no glow).
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowBlur = 0;
        ctx.font = "700 48px 'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif";
        ctx.fillStyle = "rgba(244, 249, 255, 0.82)";
        ctx.fillText("i", 0, 3);

        // Crisp inner pass for readability over trajectories.
        ctx.fillStyle = "rgba(255, 255, 255, 0.58)";
        ctx.font = "700 38px 'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif";
        ctx.fillText("i", 0, 3);

        // Acute accent only: strong magenta glow.
        ctx.save();
        ctx.translate(10.2, -22.5);
        ctx.rotate(-0.78);
        ctx.shadowColor = "rgba(255, 68, 238, 0.98)";
        ctx.shadowBlur = 16;

        ctx.fillStyle = "rgba(255, 64, 236, 0.95)";
        ctx.beginPath();
        ctx.moveTo(-1.7, 7.4);
        ctx.lineTo(2.1, 7.4);
        ctx.lineTo(9.0, -7.4);
        ctx.lineTo(5.0, -7.4);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "rgba(255, 210, 250, 0.86)";
        ctx.beginPath();
        ctx.moveTo(2.8, 5.9);
        ctx.lineTo(4.2, 5.9);
        ctx.lineTo(7.5, -5.9);
        ctx.lineTo(6.1, -5.9);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        ctx.restore();
      }

      updateFinalGlow(drawPhase) {
        if (!this.glowEl) {
          return;
        }
        if (drawPhase >= 0.86) {
          this.glowEl.classList.add("final-glow");
        } else {
          this.glowEl.classList.remove("final-glow");
        }
      }

      drawCoreVoid() {
        const ctx = this.ctx;
        const { lensX, lensY, coreVoidAngle, coreVoidLength, coreVoidWidth } = this.config;

        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        ctx.translate(lensX + 6, lensY - 8);
        ctx.rotate(coreVoidAngle);
        ctx.fillStyle = "rgba(0, 0, 0, 1)";
        ctx.beginPath();
        const x = -coreVoidWidth * 0.5;
        const y = -coreVoidLength * 0.5;
        const w = coreVoidWidth;
        const h = coreVoidLength;
        const r = coreVoidWidth * 0.48;
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(-0.65, -coreVoidLength * 0.5 - 6, 1.3, coreVoidLength + 12);
        ctx.restore();
      }

      drawCenterDisk(t) {
        const ctx = this.ctx;
        const diskR = this.config.ringRadius * 0.64;

        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        const g = ctx.createRadialGradient(0, 0, diskR * 0.12, 0, 0, diskR);
        g.addColorStop(0, "rgba(2, 6, 12, 0.98)");
        g.addColorStop(1, "rgba(0, 0, 0, 0.96)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, diskR, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = "rgba(190, 228, 255, 0.14)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(0, 0, diskR * 0.985, 0, Math.PI * 2);
        ctx.stroke();

        const rays = 34;
        for (let i = 0; i < rays; i += 1) {
          const a = (i / rays) * Math.PI * 2 + t * 0.02;
          const inner = diskR * 0.7;
          const outer = diskR * (0.88 + 0.06 * Math.sin(t * 0.6 + i));
          ctx.strokeStyle = "rgba(170, 214, 255," + (0.028 + 0.02 * Math.sin(i + t)).toFixed(3) + ")";
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
          ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
          ctx.stroke();
        }

        ctx.restore();
      }

      computeNodeTarget(node, i, t, drawPhase) {
        const cfg = this.config;
        const group = node.waveGroup;
        const waveSpeed = group === 0 ? 0.56 : (group === 1 ? 0.84 : 1.22);
        const waveAmp = group === 0 ? 3.6 : (group === 1 ? 7.8 : 11.2);
        const swirl = Math.sin(t * waveSpeed + node.wavePhase + this.state.noiseSeeds[i % this.state.noiseSeeds.length] + node.a * 2.2) * waveAmp;
        const rough = 1 + Math.sin(t * (0.62 + group * 0.24) + node.a * 5.2) * (0.06 + group * 0.04);
        const gapWave = Math.abs(Math.sin(node.a * 1.5 + t * 0.19));
        const gapFactor = this.clamp((gapWave - 0.18) / 0.82, 0, 1);
        const orbitA = node.a + drawPhase * Math.PI * 2;

        const denseSide = this.clamp((Math.cos(orbitA - 0.1) + 1) * 0.5, 0, 1);
        const sideRadiusScale = 1 - denseSide * 0.2;
        const sideYScale = 1 - denseSide * 0.12;
        const localNoise = this.organicNoise(t + orbitA * 0.3, node.organicSeed);
        const radialNoise = 1 + localNoise * 0.13 + node.radialBias;

        const tx = Math.cos(orbitA) * cfg.ringRadius * rough * (0.88 + gapFactor * 0.22) * sideRadiusScale * radialNoise;
        const ty = Math.sin(orbitA) * cfg.ringRadius * cfg.ringYScale * rough * (0.9 + gapFactor * 0.2) * sideYScale * (1 + localNoise * 0.09)
          + swirl * 0.16 + node.orbitNoise * 18;

        const dxFocus = tx - cfg.lensX;
        const dyFocus = ty - cfg.lensY;
        const distFocus = Math.hypot(dxFocus, dyFocus);
        const influence = this.clamp(1 - distFocus / cfg.lensRange, 0, 1);
        const obstacle = this.clamp((cfg.lensObstacleR - distFocus) / cfg.lensObstacleR, 0, 1);

        let fx = tx;
        let fy = ty;
        if (influence > 0) {
          const inv = 1 / Math.max(0.001, distFocus);
          const nx = dxFocus * inv;
          const ny = dyFocus * inv;

          const condense = 1 - influence * 0.72;
          fx = cfg.lensX + (fx - cfg.lensX) * condense;
          fy = cfg.lensY + (fy - cfg.lensY) * condense;

          if (obstacle > 0) {
            fx += nx * obstacle * 10;
            fy += ny * obstacle * 10;
          }

          if (node.hitsLens) {
            const edgeDelta = distFocus - (cfg.lensObstacleR + 4);
            fx -= nx * influence * edgeDelta * 0.16;
            fy -= ny * influence * edgeDelta * 0.16;
            fx += -ny * influence * 1.5;
            fy += nx * influence * 1.5;

            const tunnelAxisX = Math.cos(cfg.coreVoidAngle);
            const tunnelAxisY = Math.sin(cfg.coreVoidAngle);
            const along = (fx - cfg.lensX) * tunnelAxisX + (fy - cfg.lensY) * tunnelAxisY;
            fx = cfg.lensX + tunnelAxisX * along * (0.88 + 0.08 * (1 - influence));
            fy = cfg.lensY + tunnelAxisY * along * (0.88 + 0.08 * (1 - influence));
          } else {
            fx += nx * influence * 4.2;
            fy += ny * influence * 4.2;
            fx += ny * influence * 0.9;
            fy -= nx * influence * 0.9;
          }
        }

        return { fx, fy, group, denseSide, influence };
      }

      updateNode(node, i, t, drawPhase, travelEased, drawingOnRing) {
        const cfg = this.config;
        const meta = this.computeNodeTarget(node, i, t, drawPhase);
        const targetX = node.sourceX + (meta.fx - node.sourceX) * travelEased;
        const targetY = node.sourceY + (meta.fy - node.sourceY) * travelEased;

        node.px = node.x;
        node.py = node.y;
        if (drawingOnRing) {
          node.fx += (targetX - node.fx) * cfg.continuityFilter;
          node.fy += (targetY - node.fy) * cfg.continuityFilter;
          node.x = node.fx;
          node.y = node.fy;
        } else {
          node.fx = targetX;
          node.fy = targetY;
          node.x = targetX;
          node.y = targetY;
        }

        if (drawingOnRing) {
          if (node.history.length) {
            const prev = node.history[node.history.length - 1];
            const step = Math.hypot(node.x - prev.x, node.y - prev.y);
            if (step > cfg.maxSplineStep) {
              const inserts = Math.min(5, Math.ceil(step / cfg.maxSplineStep));
              for (let s = 1; s < inserts; s += 1) {
                const q = s / inserts;
                node.history.push({
                  x: prev.x + (node.x - prev.x) * q,
                  y: prev.y + (node.y - prev.y) * q
                });
              }
            }
          }
          node.history.push({ x: node.x, y: node.y });
          if (node.history.length > cfg.trailLength) {
            node.history.shift();
          }
        } else if (node.history.length) {
          node.history.length = 0;
        }

        return meta;
      }

      renderNode(node, meta, t, travelEased, drawingOnRing) {
        const cfg = this.config;
        const ctx = this.ctx;
        const vx = node.x - node.px;
        const vy = node.y - node.py;
        const speed = Math.hypot(vx, vy);
        const tailAlpha = this.clamp(speed * 0.09, 0.02, 0.24);

        if (node.history.length > 2 && drawingOnRing) {
          ctx.globalCompositeOperation = "lighter";
          ctx.beginPath();
          this.drawSmoothSpline(node.history, 0.1);
          const historyStrength = this.clamp((node.history.length / cfg.trailLength) * 0.28, 0.1, 0.28);
          const strokeColor = meta.group === 0
            ? "rgba(150,232,255,"
            : (meta.group === 1 ? "rgba(188,224,255," : "rgba(255,150,245,");
          const denseBoost = 0.7 + meta.denseSide * 0.7;
          const lensBoost = 1 + meta.influence * 1.25;
          const inkAlpha = historyStrength * denseBoost * lensBoost;

          ctx.strokeStyle = strokeColor + inkAlpha.toFixed(3) + ")";
          ctx.lineWidth = this.clamp(node.size * (0.22 + meta.influence * 0.15), 0.26, 0.92);
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.filter = "blur(0.18px)";
          ctx.stroke();
          ctx.filter = "none";

          for (let d = 0; d < cfg.diffusionPasses; d += 1) {
            const phase = t * 1.6 + node.organicSeed * 0.9 + d * 1.3;
            const jitterX = Math.sin(phase + node.a * 2.2) * (0.45 + d * 0.2);
            const jitterY = Math.cos(phase * 0.8 + node.a * 1.1) * (0.25 + d * 0.12);
            const alpha = inkAlpha * (0.28 - d * 0.07);
            if (alpha <= 0.02) {
              continue;
            }

            ctx.save();
            ctx.translate(jitterX, jitterY);
            ctx.beginPath();
            this.drawSmoothSpline(node.history, 0.14 + d * 0.015);
            ctx.strokeStyle = strokeColor + alpha.toFixed(3) + ")";
            ctx.lineWidth = this.clamp(node.size * (0.3 + meta.influence * 0.13 + d * 0.05), 0.34, 1.4);
            ctx.filter = "blur(0.45px)";
            ctx.stroke();
            ctx.filter = "none";
            ctx.restore();
          }

          const barLen = this.clamp(6 + node.history.length * 0.065 + meta.influence * 7, 7, 25);
          for (let b = 0; b < cfg.barcodeStrokeCount; b += 1) {
            const xOffset = (b - (cfg.barcodeStrokeCount - 1) * 0.5) * 0.72 + Math.sin(t * 2.1 + node.organicSeed + b) * 0.15;
            const yOffset = Math.cos(t * 1.7 + node.a * 3 + b) * 0.55;
            const barAlpha = this.clamp(inkAlpha * (0.35 - b * 0.09), 0.06, 0.3);
            const yStart = node.y - barLen * 0.5 + yOffset;
            const yEnd = node.y + barLen * 0.5 + yOffset;
            const xBar = node.x + xOffset;

            ctx.beginPath();
            ctx.moveTo(xBar, yStart);
            ctx.lineTo(xBar, yEnd);
            ctx.strokeStyle = "rgba(235,249,255," + barAlpha.toFixed(3) + ")";
            ctx.lineWidth = this.clamp(0.22 + b * 0.08, 0.22, 0.44);
            ctx.lineCap = "round";
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(xBar, yStart);
            ctx.lineTo(xBar + 1.9 + b * 0.35, yStart);
            ctx.strokeStyle = "rgba(235,249,255," + this.clamp(barAlpha * 0.9, 0.05, 0.26).toFixed(3) + ")";
            ctx.lineWidth = this.clamp(0.2 + b * 0.06, 0.2, 0.36);
            ctx.lineCap = "round";
            ctx.stroke();
          }
        }

        // Avoid dotted/dashed ring artifacts: keep particles visible mainly during inflow.
        if (!drawingOnRing) {
          ctx.globalCompositeOperation = "lighter";
          for (let k = 1; k <= 2; k += 1) {
            const txk = node.x - vx * k * 3.2;
            const tyk = node.y - vy * k * 3.2;
            const rr = Math.max(0.26, node.size * 0.42 - k * 0.26);
            const tailBase = meta.group === 2 ? "rgba(255,160,246," : "rgba(156,235,255,";
            ctx.fillStyle = tailBase + (tailAlpha * 0.45 * (1 - k * 0.2)).toFixed(3) + ")";
            ctx.beginPath();
            ctx.arc(txk, tyk, rr, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = "rgba(248,253,255," + (0.34 + travelEased * 0.5).toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawInflow(t) {
        const ctx = this.ctx;
        const density = this.config.inflowDensity;

        for (let i = 0; i < density; i += 1) {
          const p = (t * 0.62 + i / density) % 1;
          const eased = this.easeInOut(p);
          const ix = Math.sin(t * 2.7 + i * 1.3) * 0.45;
          const iy = Math.sin(t * 3.2 + i * 1.6) * 14 + (eased - 0.5) * 26;
          const ir = 1.2 + (1 - p) * 1.8;

          ctx.globalCompositeOperation = "lighter";
          for (let k = 0; k < 4; k += 1) {
            const txk = ix - (k + 1) * 1.9;
            const tyk = iy + Math.sin(t * 5 + k + i) * 1.2;
            ctx.fillStyle = "rgba(148,235,255," + (0.2 - k * 0.042).toFixed(3) + ")";
            ctx.beginPath();
            ctx.arc(txk, tyk, Math.max(0.45, ir - k * 0.35), 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = "rgba(248,252,255,0.5)";
          ctx.beginPath();
          ctx.arc(ix, iy, ir, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      frame(now) {
        const ctx = this.ctx;
        const { frozen, finalSnapshot, start } = this.state;
        const cfg = this.config;

        if (frozen && finalSnapshot) {
          ctx.putImageData(finalSnapshot, 0, 0);
          return;
        }

        const elapsed = now - start;
        const t = elapsed * 0.001;
        const travelPhase = this.clamp(elapsed / cfg.travelDuration, 0, 1);
        const travelEased = this.easeInOut(travelPhase);
        const drawPhase = this.clamp((elapsed - cfg.travelDuration) / cfg.drawDuration, 0, 1);
        const drawingOnRing = elapsed >= cfg.travelDuration;

        const width = this.canvas.width / this.dpr;
        const height = this.canvas.height / this.dpr;
        const cx = width * 0.5;
        const cy = height * 0.47;

        this.drawBackground(width, height);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = "rgba(170,236,255,0.35)";
        ctx.fillRect(cfg.slitX - cfg.slitWidth * 0.5, -cfg.slitHeight * 0.5, cfg.slitWidth, cfg.slitHeight);
        ctx.fillStyle = "rgba(245,252,255,0.72)";
        ctx.fillRect(cfg.slitX - 0.2, -cfg.slitHeight * 0.5, 0.4, cfg.slitHeight);

        this.drawCenterDisk(t);

        for (let i = 0; i < this.state.nodes.length; i += 1) {
          const node = this.state.nodes[i];
          const meta = this.updateNode(node, i, t, drawPhase, travelEased, drawingOnRing);
          this.renderNode(node, meta, t, travelEased, drawingOnRing);
        }

        this.drawInflow(t);
        this.drawAcuteOverlay();
        ctx.restore();
        this.updateFinalGlow(drawPhase);

        if (!this.state.frozen && drawPhase >= 1) {
          this.state.frozen = true;
          this.state.finalSnapshot = ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
          return;
        }

        requestAnimationFrame((ts) => this.frame(ts));
      }

      start() {
        requestAnimationFrame((ts) => this.frame(ts));
      }
    }

    const canvas = document.getElementById("scene");
    const glowI = document.querySelector(".wordmark .glow-i");
    const scene = new ArrivalInkScene(canvas, glowI);
    scene.start();
  </script>
</body>
</html>
