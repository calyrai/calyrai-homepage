font:
  name: Calyrai Sans
  style: Regular
  upm: 1000
  stroke_width: 26
  cap_height: 760
  x_height: 520
  terminal_style: flat
  crossbar_style: minimal
  curvature_radius: 118
  tracking: 1.34
  alphabet: "CALYRAI"

rules:
  stroke:
    width: constant
  geometry:
    circles_only: false
  terminals:
    open: false
  symmetry:
    preferred: true
  crossbars:
    minimal: true
  diagonals:
    preferred: true
  projections:
    preserve_angle: true

glyphs:
  A:
    lines:
      - [12, 0, 50, 100]
      - [88, 0, 50, 100]
    crossbar:
      enabled: false
  O:
    circle:
      center: [50, 50]
      radius: 46
  C:
    arc:
      center: [50, 50]
      radius: 43
      start: 38
      end: 322
  L:
    lines:
      - [18, 100, 18, 0]
      - [18, 0, 84, 0]
  Y:
    lines:
      - [14, 100, 50, 56]
      - [86, 100, 50, 56]
      - [50, 56, 50, 0]
  R:
    lines:
      - [18, 0, 18, 100]
      - [18, 100, 74, 100]
      - [74, 100, 74, 64]
      - [74, 64, 18, 64]
      - [54, 64, 90, 0]
  I:
    lines:
      - [52, 0, 52, 100]
