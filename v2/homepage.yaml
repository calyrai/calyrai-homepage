explore_sections:
  - title: "Theory"
    color: "#24f3ff"
    body: |
      Soft matter learning is the core framing of the Calyr.ai page.
      It combines material-system understanding with machine intelligence.
      Use this layer to translate complex physical behavior into computable representations.
  - title: "Calyrai"
    color: "#ff4df5"
    body: |
      Learning systems continuously update how structure, data, and interpretation connect.
      They support adaptive model behavior rather than static one-time fitting.
      Use this layer when iterative improvement and semantic consistency are required.
  - title: "Access"
    color: "#f3f8ff"
    body: |
      Reproducible oracles are the public promise of the system.
      Predictions and outputs must remain traceable, repeatable, and interpretable.
      Use this layer for reliable decision surfaces that preserve scientific trust.
  - title: "Engine"
    color: "#9fb4c9"
    body: |
      Explore the Nexus provides the operational entry point for deeper interaction.
      It connects the conceptual framing with navigable workspace structures.
      Use this layer to move from homepage narrative to executable exploration.
