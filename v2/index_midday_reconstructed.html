<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Calyr.aí - Molecular Deeptech</title>
  <link rel="stylesheet" href="../calyrai_font/out/calyrai-sans.css" />
  <style>
		:root {
			--bg: #07080f;
			--fg: #f2f6ff;
			--muted: #b8c2d5;
			--line: rgba(255,255,255,0.14);
			--accent: #f2f6ff;
			--typo: 'Eurostile Extended','Eurostile','Microgramma D Extended','Bank Gothic','Helvetica Neue','Arial Narrow',Arial,sans-serif;
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; }
		body {
			margin: 0;
			background: radial-gradient(120% 120% at 50% -20%, #131827 0%, var(--bg) 56%);
			color: var(--fg);
			font-family: var(--typo);
			letter-spacing: 0.04em;
		}
		.page {
			min-height: 100vh;
			display: grid;
			grid-template-columns: minmax(320px, 1fr) minmax(260px, 420px);
			gap: clamp(2rem, 6vw, 8rem);
			align-items: center;
			padding: clamp(2rem, 7vw, 6rem);
		}
		.hero-label {
			font-size: clamp(0.74rem, 1vw, 0.92rem);
			text-transform: uppercase;
			color: var(--muted);
			letter-spacing: 0.2em;
			margin-bottom: clamp(1rem, 2vw, 1.5rem);
		}
		h1 {
			margin: 0;
			font-size: clamp(2.3rem, 6vw, 5.1rem);
			font-weight: 300;
			line-height: 0.96;
			letter-spacing: 0.03em;
		}
		.hero-subtitle {
			margin-top: clamp(1rem, 2vw, 1.8rem);
			margin-bottom: 0;
			max-width: 52ch;
			color: var(--muted);
			font-size: clamp(0.96rem, 1.25vw, 1.25rem);
			line-height: 1.6;
			letter-spacing: 0.05em;
		}
		.brand {
			justify-self: end;
			display: flex;
			flex-direction: column;
			gap: 1.4rem;
			align-items: flex-start;
			width: min(100%, 420px);
		}
		.brand .calyrai-wordmark { width: 100%; margin: 0; }
		.brand .calyrai-wordmark-svg { width: 100%; height: auto; display: block; }
		.cta {
			text-decoration: none;
			text-transform: uppercase;
			color: var(--accent);
			letter-spacing: 0.16em;
			font-size: 0.84rem;
			border-bottom: 1px solid var(--line);
			padding-bottom: 0.28rem;
		}
		.tagline {
			font-size: 0.78rem;
			color: var(--muted);
			letter-spacing: 0.11em;
			text-transform: uppercase;
			line-height: 1.45;
		}
		@media (max-width: 940px) {
			.page {
				grid-template-columns: 1fr;
				gap: 2.2rem;
			}
			.brand {
				justify-self: start;
				width: min(100%, 360px);
			}
		}
	</style>
</head>
<body>

	</div>
