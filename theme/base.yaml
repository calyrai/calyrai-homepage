# Base Design Tokens - Foundational, Skin-Agnostic
# Used by all skins. Defines structure, spacing, typography, and layout patterns.

base:
  radius:
    none: 0
    sm: 4px
    md: 8px
    lg: 12px
    xl: 16px
    tile: 18px
    full: 999px

  spacing:
    xs: 4px
    sm: 8px
    md: 16px
    lg: 24px
    xl: 32px
    2xl: 48px
    3xl: 64px
    4xl: 96px
    page: 48px
    grid_gap: 24px
    grid_gap_mobile: 16px

  typography:
    font_family: Avenir, Inter, sans-serif
    font_fallback: "-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
    
    heading:
      h1:
        size: 3.2rem
        weight: 700
        line_height: 1.1
        letter_spacing: "-0.02em"
      h2:
        size: 2.4rem
        weight: 600
        line_height: 1.2
        letter_spacing: "-0.01em"
      h3:
        size: 1.8rem
        weight: 600
        line_height: 1.3
    
    body:
      regular:
        size: 1rem
        weight: 400
        line_height: 1.6
      small:
        size: 0.875rem
        weight: 400
        line_height: 1.5
      caption:
        size: 0.75rem
        weight: 400
        line_height: 1.4
        letter_spacing: "0.12em"

  borders:
    width_thin: 1px
    width_medium: 2px

# Component Base Patterns - Structural defaults (skins override colors)
components:
  header:
    height: 80px
    padding_horizontal: 32px
    logo_height: 40px
    nav_gap: 32px

  footer:
    padding: 64px 32px
    gap: 48px
    columns: 4
    column_gap: 48px

  tiles:
    default:
      padding: 24px
      gap: 12px
      radius: 12px
    
    collapsed:
      height: 120px
      title_size: 1.25rem
      teaser_size: 0.95rem
    
    expanded:
      height: auto
      max_height: 600px
      body_size: 0.95rem
      padding_vertical: 32px

  grid:
    columns: 3
    gap: 24px
    gap_mobile: 16px

  landing_page:
    hero:
      padding_vertical: 96px
      padding_horizontal: 32px
      text_align: center
      
      kicker:
        size: 0.875rem
        weight: 600
        letter_spacing: "0.12em"
        text_transform: uppercase
        margin_bottom: 16px
      
      title:
        size: 4rem
        weight: 700
        margin_bottom: 16px
      
      subtitle:
        size: 1.5rem
        weight: 400
        margin_bottom: 48px
    
    section:
      padding_vertical: 64px
      padding_horizontal: 32px
      gap: 32px
