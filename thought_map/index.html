<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calyr Thought Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">Calyr Thought Systems</div>
      <div class="controls">
        <input id="searchInput" type="search" placeholder="Suche in Titles und Text..." />
        <button id="reloadBtn" type="button">Reload</button>
        <button id="exportBtn" type="button">Export Edits</button>
      </div>
    </header>

    <main class="layout">
      <section class="map-wrap">
        <canvas id="mapCanvas"></canvas>
        <div id="hoverTag" class="hover-tag" hidden></div>
      </section>

      <aside class="sidepanel">
        <div class="panel-head">
          <h2>Note Editor</h2>
          <div id="unitMeta" class="meta">Kein Knoten ausgewählt</div>
        </div>

        <label class="field">
          <span>Titel</span>
          <input id="titleInput" type="text" />
        </label>

        <label class="field grow">
          <span>Text</span>
          <textarea id="textInput"></textarea>
        </label>

        <label class="field">
          <span>Tags (kommagetrennt)</span>
          <input id="tagsInput" type="text" />
        </label>

        <div class="panel-actions">
          <button id="saveBtn" type="button">Save</button>
          <button id="resetBtn" type="button">Reset This Note</button>
        </div>

        <div class="legend">
          <h3>Subsysteme</h3>
          <ul id="legendList"></ul>
        </div>
      </aside>
    </main>
  </div>

  <script src="./thought-map.js"></script>
</body>
</html>
