<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CALYR Research Journal Login</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #102d3f 0%, #040709 68%);
      color: #eef9ff;
    }
    main {
      width: min(92vw, 580px);
      padding: 30px;
      border-radius: 14px;
      background: rgba(8, 16, 22, 0.9);
      border: 1px solid rgba(127, 242, 255, 0.3);
      box-shadow: 0 24px 44px rgba(0,0,0,.4);
    }
    .kicker { opacity: .78; letter-spacing: .06em; font-size: .8rem; margin-bottom: 8px; }
    h1 { margin: 0 0 12px; font-size: 1.45rem; }
    p { margin: 0 0 10px; line-height: 1.45; color: rgba(238,249,255,.9); }
    .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }
    .primary { background: #7ff2ff; color: #041017; }
    .secondary { border: 1px solid rgba(255,255,255,.28); color: #eef9ff; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">CALYR ACCESS</p>
    <h1>Login required · Research Journal</h1>
    <p>The Research Journal is protected and not publicly available.</p>
    <p>Please continue with your CALYR login.</p>
    <div class="actions">
      <a class="btn primary" href="https://journal.calyr.ai/">Continue to login</a>
      <a class="btn secondary" href="/">Back to calyr.ai</a>
    </div>
  </main>
</body>
</html>
