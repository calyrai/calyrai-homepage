<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warehouse Lineage</title>
  <style>
    :root {
      --bg: #07101a;
      --panel: rgba(9, 22, 34, 0.92);
      --line: rgba(106, 240, 255, 0.22);
      --text: rgba(228, 236, 248, 0.94);
      --muted: rgba(177, 194, 212, 0.72);
      --accent: #6af0ff;
      --warm: #ffd166;
      --pink: #ff7aa2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(255, 122, 162, 0.1), transparent 22%),
        radial-gradient(circle at top left, rgba(106, 240, 255, 0.1), transparent 24%),
        linear-gradient(180deg, #08111b 0%, #050b12 100%);
      padding: 24px;
    }
    .shell {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
    }
    h1 { margin: 0 0 8px; font-size: 2.2rem; letter-spacing: -0.04em; }
    p { margin: 0 0 16px; color: var(--muted); line-height: 1.65; }
    .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .tag {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      font-size: 0.82rem;
    }
    .graph {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }
    .column-title {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .node {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }
    .node:hover,
    .node.active {
      transform: translateY(-2px);
      border-color: rgba(106, 240, 255, 0.38);
    }
    .node small { display: block; color: var(--muted); margin-top: 6px; }
    .edge-list {
      margin: 18px 0 0;
      padding: 14px;
      border-radius: 12px;
      background: rgba(106, 240, 255, 0.06);
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .meta {
      display: grid;
      gap: 12px;
    }
    .meta-card {
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .meta-card strong { color: var(--warm); display: block; margin-bottom: 6px; }
    .back { display: inline-flex; margin-top: 14px; color: var(--accent); text-decoration: none; }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .graph { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <h1>Warehouse lineage</h1>
      <p>Click a node to inspect how the archive stores immutable records and how the warehouse exposes those records as a logical provenance graph.</p>
      <div class="legend">
        <span class="tag">dataset</span>
        <span class="tag">transform</span>
        <span class="tag">result</span>
      </div>
      <div class="graph" id="graph"></div>
      <div class="edge-list" id="edges"></div>
    </section>

    <aside class="panel">
      <div class="meta" id="meta"></div>
      <a class="back" href="index.html">Back to examples</a>
    </aside>
  </div>

  <script>
    const columns = [
      {
        title: 'Datasets',
        items: [
          { id: 'run-042', type: 'Dataset', desc: 'Raw SEC-SAXS run', tags: ['sec-saxs', 'raw'], producedBy: 'instrument', inputs: [] },
          { id: 'spr-018', type: 'Dataset', desc: 'SPR sensorgram panel', tags: ['spr', 'binding'], producedBy: 'instrument', inputs: [] }
        ]
      },
      {
        title: 'Transforms',
        items: [
          { id: 'saxs-op', type: 'Operator', desc: 'Scattering reduction', tags: ['normalize', 'saxs'], producedBy: 'nexus_language_saxs', inputs: ['run-042'] },
          { id: 'constraint-op', type: 'Operator', desc: 'Constraint projection', tags: ['to-constraint'], producedBy: 'nexus_language_nexus', inputs: ['saxs-op', 'spr-018'] }
        ]
      },
      {
        title: 'Results',
        items: [
          { id: 'fit-a94f3c8', type: 'Fit', desc: 'Content-addressed Guinier fit', tags: ['guinier', 'cached'], producedBy: 'solve@MAP', inputs: ['saxs-op'] },
          { id: 'nexus-12ab77', type: 'NexusResult', desc: 'Joint SAXS + SPR solution', tags: ['joint', 'map'], producedBy: 'nexus@auto', inputs: ['constraint-op'] }
        ]
      }
    ];

    const graph = document.getElementById('graph');
    const meta = document.getElementById('meta');
    const edges = document.getElementById('edges');

    function allItems() {
      return columns.flatMap((column) => column.items);
    }

    function updateMeta(item) {
      meta.innerHTML = `
        <div class="meta-card"><strong>${item.id}</strong>${item.desc}</div>
        <div class="meta-card"><strong>Type</strong>${item.type}</div>
        <div class="meta-card"><strong>Produced by</strong>${item.producedBy}</div>
        <div class="meta-card"><strong>Tags</strong>${item.tags.join(', ')}</div>
        <div class="meta-card"><strong>Inputs</strong>${item.inputs.length ? item.inputs.join(', ') : 'None'}</div>
      `;
      edges.textContent = item.inputs.length
        ? item.inputs.map((source) => `${source}  ->  ${item.id}`).join('\n')
        : `${item.id} is a source object stored directly from acquisition.`;
      document.querySelectorAll('.node').forEach((node) => {
        node.classList.toggle('active', node.dataset.id === item.id);
      });
    }

    function render() {
      graph.innerHTML = columns.map((column) => `
        <div>
          <div class="column-title">${column.title}</div>
          ${column.items.map((item) => `
            <button class="node" data-id="${item.id}">
              ${item.id}
              <small>${item.type} · ${item.desc}</small>
            </button>
          `).join('')}
        </div>
      `).join('');

      graph.querySelectorAll('.node').forEach((node) => {
        node.addEventListener('click', () => {
          const item = allItems().find((entry) => entry.id === node.dataset.id);
          updateMeta(item);
        });
      });

      updateMeta(allItems()[0]);
    }

    render();
  </script>
</body>
</html>
