layout:
  mode: "titlepage"
  grid:
    spacing_cm: 1
    color: "#fff"
    dot_radius_px: 0.7
layers:
  swirl_joystick:
    enabled: true
    sensitivity: 1.0
    color_mode: section
  particle_field:
    enabled: true
    particle_count: 1
    levy_jump_prob: 0.08
    field_strength: 0.7
hero:
  label: ""
  title: "Calyr.aí"
  subtitle: |
    AI-assisted molecular design and reasoning for reproducible predictive oracles.
  cta:
    text: "Explore the Nexus"
    href: "https://calyr.ai/explore.html?v=20260524-blend-r1"
meta:
  page_title: "Calyr.aí - Molecular Deeptech"
  tagline: "Molecular Intelligence · Adaptive Systems · Reproducible Oracles"
titlepage:
  empty_tile:
    id: "empty-tile-1"
    aria_label: "Empty tile"
  overlay:
    close_label: "Close"
    close_aria_label: "Close overlay"
  fallback_menu_link:
    label: "Explore"
    href: "#explore"
structure:
  template: "calyr_titlepage_orbit"
  hero_class: "hero"
  hero_copy_class: "hero-copy"
  hero_kicker_class: "hero-kicker"
  hero_title_class: "hero-title"
  hero_subtitle_class: "hero-subtitle"
  hero_orbit_class: "hero-orbit-logo"
  hero_stack_class: "hero-orbit-stack"
  hero_cta_class: "hero-cta hero-cta--orbit glow-button"
  hero_characteristics_class: "hero-characteristics hero-characteristics--orbit"
  grid_spacing_px: "30"
  grid_major_step: "4"
  grid_base_r_major: "1.25"
  grid_base_r_minor: "0.42"
  grid_max_r_major: "6.2"
  grid_max_r_minor: "1.9"
  grid_hover_radius_px: "88"
  grid_base_op_major: "0.62"
  grid_base_op_minor: "0.16"
  grid_max_op_major: "0.96"
  grid_max_op_minor: "0.34"
  label_hover_radius_px: "22"
  label_reveal_ms: "2000"
  label_font_px: "6"
  label_visible_opacity: "0.72"
  label_color: "#ffffff"
  label_mode: "hover"
