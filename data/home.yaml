# data/home.yaml
# Landing page top-level architecture content.

architecture:
  title: "Architecture"
  lead: >
    Independent experiments stay autonomous, but their outputs become standardized
    representations inside a shared system.

  stack_title: "Five-layer stack"
  stack:
    - name: "Experiments"
      desc: "Independent sources producing native raw data."
      examples:
        - "SAXS scattering curves"
        - "Chromatography pulse traces"
        - "Cryo-EM density maps"
        - "Molecular-dynamics trajectories"
        - "Metabolic flux datasets"
      note: "Experiments are documented independently; the shared system consumes standardized outputs."

    - name: "Ingestion layer"
      desc: "Standardized intake: upload pipelines, metadata capture, versioning, provenance."
      examples:
        - "Ingestion scripts"
        - "Metadata + parameters"
        - "Provenance tracking"

    - name: "Data warehouse"
      desc: "Central storage for raw + structured datasets with reproducible lineage."
      examples:
        - "Immutable datasets"
        - "Preprocessing logs"
        - "Traceable revisions"

    - name: "Representation / feature layer"
      desc: "Convert signals into shared representations so domains become comparable."
      examples:
        - "PCA coordinates"
        - "Feature vectors / descriptors"
        - "Embeddings"

    - name: "AI & modeling layer"
      desc: "Operate on representations: clustering, prediction, cross-experiment inference."
      examples:
        - "Hybrid physics–ML models"
        - "Uncertainty framing"
        - "Hypothesis generation"

  principles_title: "Key principles"
  principles:
    - "Do not force experiments into one schema up front."
    - "Warehouse is a source of truth with lineage and reproducibility."
    - "Representation layer is the bridge that enables cross-domain learning."
    - "Context/metadata is required for interpretability."
