schema_version: 1
# Slide deck for the Explore abstract-language presentation
# Source of truth — edit here, then regenerate:
#   python3 scripts/build_deck.py data/an-abstract-language-for-data-organization.yaml

slides:

  - type: title
    kicker: Calyr.ai · Language
    headline: "An abstract language<br>for data organization"
    tagline: structuring data for model-driven interpretation

  - type: statement
    chapter: Problem
    kicker: The problem
    headline: "Experimental data is stored,<br>but not model-ready"
    body: |
      Experimental results arrive as files, curves, and metadata scattered across incompatible formats.
      Different instruments impose different conventions, and linking datasets to models becomes difficult.
      The practical result is fragmentation rather than interpretation readiness.
    manifesto: Data is fragmented and not model-ready.

  - type: statement
    chapter: Observation
    kicker: Observation
    headline: "Data alone does not<br>define meaning"
    body: |
      A signal is only interpretable relative to a model.
      This is obvious in SAXS, where measured intensity is not the structure itself.
      The same problem appears in data systems more broadly: signals are not self-explanatory.
    manifesto: Signals are not structures.

  - type: statement
    chapter: Analogy
    kicker: SAXS analogy
    headline: "Without a model, the signal<br>is not determined"
    body: |
      In SAXS, intensity does not uniquely define structure because multiple structures can explain the same signal.
      A model is required to move from observation to interpretation.
      That same logic should guide data infrastructure as well.
    manifesto: Without a model, the signal is not determined.

  - type: statement
    chapter: Transfer
    kicker: Transfer to data systems
    headline: "Meaning emerges only<br>through structure"
    body: |
      SPR, chromatography, SAXS, and related experiments all produce signals that are ambiguous without a relational description.
      Data without structure behaves like an underdetermined inverse problem.
      The warehouse should therefore encode how interpretation becomes possible.
    manifesto: Data without structure is ambiguous.

  - type: statement
    chapter: Idea
    kicker: Core idea
    headline: "Introduce an abstract language<br>for describing data"
    body: |
      The aim is to make structure explicit rather than leaving it implicit in filenames, folders, and conventions.
      The language should describe relations, admissible states, and observables in a way that is ready for direct model interaction.
      Interpretation readiness becomes part of the data representation itself.
    manifesto: We encode interpretation readiness.

  - type: statement
    chapter: Definition
    kicker: What is an abstract language?
    headline: "Describe behavior,<br>not just measurements"
    body: |
      An abstract language is a set of symbols and rules for describing systems independent of any one experiment.
      It captures relations between entities, states, transitions, and observables rather than storing only values.
      The representation becomes experiment-agnostic but model-compatible.
    manifesto: We describe behavior, not just measurements.

  - type: statement
    chapter: Primitives
    kicker: Core elements
    headline: "One set of primitives<br>across experiments"
    body: |
      Entities describe objects such as sites, ligands, domains, or particles.
      States describe configurations such as occupied, free, folded, compact, or extended.
      Transitions describe changes such as binding, diffusion, or scattering, and observables describe measured signals.
    manifesto: All experiments map to the same primitives.

  - type: statement
    chapter: Unification
    kicker: Unifying experiments
    headline: "One language for SPR, SAXS,<br>and chromatography"
    body: |
      SPR contributes dynamic binding signals.
      SAXS contributes structural correlations.
      Chromatography contributes transport and adsorption behavior.
      The same abstract description should span all of them.
    manifesto: One language for all data.

  - type: statement
    chapter: Integration
    kicker: Model integration
    headline: "Models and data should share<br>one representation"
    body: |
      If models operate on the same primitives stored in the warehouse, simulation and experiment no longer live in separate worlds.
      The representation becomes a common interface for data ingestion, forward simulation, and inverse interpretation.
      The warehouse becomes model-native.
    manifesto: No gap between data and interpretation.

  - type: statement
    chapter: Constraint
    kicker: SAXS parallel
    headline: "Structure reduces<br>ambiguity"
    body: |
      SAXS inversion is ill-posed without structural constraints.
      Data warehouses are also underdetermined without an explicit description of relations and admissible interpretations.
      The abstract language acts as a constraint system for scientific data.
    manifesto: Structure reduces ambiguity.

  - type: statement
    chapter: Outcome
    kicker: Benefits
    headline: "From storage to knowledge<br>generation"
    body: |
      Data organization becomes consistent, interpretation ambiguity is reduced, and compatibility with simulation becomes direct.
      The system scales across experiments because the interface is no longer tied to one modality.
      Storage turns into a foundation for mechanistic analysis.
    manifesto: From data storage to knowledge generation.

  - type: statement
    chapter: Vision
    kicker: Vision
    headline: "A language for scientific<br>systems"
    body: |
      The long-term target is a unified loop between data, models, and simulation.
      Cross-domain integration across SPR, SAXS, and chromatography then becomes natural rather than custom-built.
      Analysis becomes automated because the data is already model-addressable.
    manifesto: We store structured, interpretable data.
