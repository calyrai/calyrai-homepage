schema_version: 1
# Slide deck for the Explore SPR presentation
# Source of truth — edit here, then regenerate:
#   python3 scripts/build_deck.py data/from-data-to-model-linking-dynamics-and-adsorption.yaml

slides:

  - type: title
    kicker: Calyr.ai · SPR
    headline: "From data to model:<br>linking dynamics and adsorption"
    tagline: 'one generative model spans both limits, from $t \to 0$ to $t \to \infty$'

  - type: statement
    chapter: Problem
    kicker: The problem
    headline: "SPR traces and adsorption data<br>are too often split apart"
    body: |
      We measure time-resolved SPR signals and equilibrium adsorption behavior from the same physical system.
      In practice, the early-time trace and the long-time isotherm are still often fitted separately.
      That split creates interpretations that are mathematically convenient but physically inconsistent.
    manifesto: Data alone is not enough.

  - type: statement
    chapter: System
    kicker: Two views
    headline: "Short time and long time<br>are one modeled process"
    body: |
      The limit $t \to 0$ reveals how binding begins and therefore exposes the dynamics.
      The limit $t \to \infty$ reveals the relaxed occupancy and therefore the adsorption isotherm.
      These are not separate phenomena. They are two limits of the same modeled process.
    manifesto: Kinetics and isotherm describe the same process.

  - type: equation
    chapter: Model
    kicker: One governing model
    headline: "The same law spans<br>both time scales"
    eq: "$$\\frac{dn}{dt} = k_{\\text{on}} c (N - n) - k_{\\text{off}} n$$"
    body: |
      A single adsorption model already spans the entire observation window.
      The same evolution law determines the initial growth of the SPR response and the final equilibrium occupancy.
      The model is not switched between the two regimes.

  - type: statement
    chapter: Claim
    kicker: The core claim
    headline: "Do not fit the trace<br>and plateau independently"
    body: |
      The correct move is not to fit one object for dynamics and another for equilibrium.
      We should build one model that generates both the SPR trace and the adsorption isotherm from the same mechanism.
      One system should produce one consistent description.
    manifesto: Model the process, not the curve.

  - type: statement
    chapter: Constraint
    kicker: Double-sided constraint
    headline: "The model is constrained<br>from both ends"
    body: |
      The limit $t \to 0$ constrains how the signal begins and therefore fixes the initial dynamics.
      The limit $t \to \infty$ constrains the equilibrium occupancy and therefore fixes the adsorption isotherm.
      Any valid model has to satisfy both limits at once.
    manifesto: The data is bounded by two extremes.

  - type: statement
    chapter: Analogy
    kicker: Analogy to SAXS
    headline: "Signals need a model<br>to become meaning"
    body: |
      In SAXS, the signal does not uniquely determine the structure.
      A model is required to interpret the data in real-space terms.
      The same logic applies here: adsorption data also needs a generative model to become mechanistic knowledge.
    manifesto: Without a model, the signal is not determined.

  - type: statement
    chapter: Method
    kicker: Our approach
    headline: "Generate both observables<br>from stochastic dynamics"
    body: |
      Use Gillespie-type stochastic models for binding and unbinding events.
      Recover the adsorption isotherm as the long-time limit of the same process.
      This links the time-resolved SPR measurement to the equilibrium curve without changing model class.
    manifesto: Dynamics lead to the isotherm.

  - type: statement
    chapter: Impact
    kicker: Why this matters
    headline: "More physics,<br>less fitting"
    body: |
      A unified model reduces ambiguity in interpretation.
      It improves parameter identifiability and supports mechanistic insight such as heterogeneity or multi-step binding.
      The analysis becomes more constrained because the same model must explain both dynamical and equilibrium behavior.
    manifesto: More physics, less fitting.

  - type: statement
    chapter: Summary
    kicker: One-line summary
    headline: 'Both $t \to 0$ and $t \to \infty$<br>are spanned by the model'
    body: |
      The signal becomes interpretable only when both extremes are generated by one mechanism.
      The SPR trace and the adsorption isotherm are then two views of the same modeled system.
    manifesto: Link the extremes to understand the system.
