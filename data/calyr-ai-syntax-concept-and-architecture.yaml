schema_version: 1
# Slide deck for the Explore Nexus and Data Warehouse presentation
# Source of truth — edit here, then regenerate:
#   python3 scripts/build_deck.py data/calyr-ai-syntax-concept-and-architecture.yaml

slides:

  - type: title
    kicker: Calyr.ai · Nexus
    headline: "Nexus and the data warehouse"
    tagline: from experimental records to governed model states

  - type: statement
    chapter: Problem
    kicker: Fragmentation
    headline: "Scientific data is stored,<br>but interpretation is fragmented"
    body: |
      Measurements, metadata, preprocessing, fitted parameters, and report figures are often separated into disconnected files and tools.
      When this happens, claims drift away from the assumptions and transformations that produced them.
      Nexus addresses this by treating the warehouse as a governed scientific layer rather than passive storage.
    manifesto: The scientific object must stay intact.

  - type: equation
    chapter: Core
    kicker: Warehouse sequence
    headline: "Nexus as governed middle layer"
    eq: '$$\\text{EXPERIMENT} \\rightarrow \\text{REPRESENTATION} \\rightarrow \\text{MODEL STATE} \\rightarrow \\text{RESULT} \\rightarrow \\text{REPORT}$$'
    body: |
      Each step is a controlled transition with explicit provenance.
      The warehouse keeps these layers linked so every output can be traced back to the originating experiment and transformation chain.
      Nexus is therefore both storage semantics and control semantics.

  - type: statement
    chapter: Structure
    kicker: Stored object
    headline: "The warehouse stores<br>scientific objects, not files"
    body: |
      A useful record contains the observation, its provenance, its derived representation, and the model-facing state that follows from it.
      The same logic must hold for SAXS, SPR, and chromatography.
      The point is not more storage. The point is to keep the scientific object traversable.
    manifesto: Store the object, not only the file.

  - type: statement
    chapter: Outcome
    kicker: Traceability
    headline: "Claims remain linked<br>to their origin"
    body: |
      Publication-facing outputs can be traced to result objects, model states, representations, and source experiments.
      This is the practical value of a governed data warehouse.
      Nexus is the layer that keeps this chain intact across modalities.
    manifesto: Traceability is a warehouse property.