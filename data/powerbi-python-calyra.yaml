schema_version: 1
# Slide deck: Power BI + Python for Calyra / Mac Workflow
# Source of truth — edit here, then regenerate:
#   python3 scripts/build_deck.py data/powerbi-python-calyra.yaml

slides:

  - type: title
    kicker: Calyr.ai · Data Platform
    headline: "Power BI + Python<br>for Calyra"
    tagline: Mac-native workflow — Python as the analytical core, Power BI as the visualization layer on top of a structured data foundation

  - type: statement
    chapter: Reality
    kicker: Mac reality
    headline: "Power BI Desktop is Windows-only.<br>That is not a blocker."
    body: |
      Power BI Desktop runs on Windows 10/11 only. On macOS the productive route is Power BI Service in the browser at app.powerbi.com, combined with Python locally for all data preparation, cleaning, and modeling.
      This is not a limitation — it reinforces the correct architecture: Python is the analytical layer, Power BI is only the visualization layer.
      A Windows VM via Parallels or a remote Windows machine provides full Power BI Desktop access when needed.
    manifesto: Python prepares. Power BI shows.

  - type: statement
    chapter: Setup
    kicker: Python on Mac
    headline: "Setup in four steps"
    body: |
      Step 1: verify Python is available — python3 --version.
      Step 2: create the project folder — mkdir calyra_powerbi_demo && cd calyra_powerbi_demo.
      Step 3: create and activate a virtual environment — python3 -m venv .venv && source .venv/bin/activate.
      Step 4: install the required packages — pip install pandas numpy matplotlib openpyxl requests.
      The virtual environment isolates dependencies and mirrors the Calyra production setup exactly.

  - type: statement
    chapter: Demo data
    kicker: Demo dataset
    headline: "Python generates the structured data model"
    body: |
      A minimal demo script creates a structured dataset: BOKU student counts and the 18–25 population from 2020 to 2025, with a derived student_ratio column.
      The script outputs both calyra_boku_demo.csv and calyra_boku_demo.xlsx ready for upload.
      This illustrates the core principle: Python computes, derives, and defines. The output file is already clean and semantically correct before Power BI ever sees it.
    manifesto: Structure is created in Python, not in Power BI.

  - type: equation
    chapter: Architecture
    kicker: Calyra architecture
    headline: "Three clean layers"
    eq: '$$\text{Calyra Core} \;\longrightarrow\; \underbrace{\text{Structured Data Layer}}_{\text{CSV / Excel / Database / API}} \;\longrightarrow\; \text{Power BI Web}$$'
    body: |
      Calyra Core — Python — handles modeling, cleaning, and derivation. It is the only place where business logic lives.
      The Structured Data Layer is the output: clean tables with defined columns, correct types, and derived metrics already computed.
      Power BI Web reads from the structured layer and visualizes. It contains no logic of its own.

  - type: statement
    chapter: Power BI Web
    kicker: Power BI Web workflow
    headline: "Upload, chart, KPI card, dashboard"
    body: |
      Open app.powerbi.com and sign in with a Microsoft or organization account. Upload calyra_boku_demo.xlsx.
      Build four minimal visuals: a line chart of year vs boku_students, a line chart of year vs population_18_25, a KPI card showing student_ratio, and a table with all values.
      Save as a dashboard. This confirms the full pipeline end-to-end: Python created the data, Power BI only drew the charts.

  - type: statement
    chapter: Windows options
    kicker: Full Power BI Desktop on Mac
    headline: "Two routes to Windows"
    body: |
      Option A — Parallels: install Parallels Desktop, install Windows 11 inside it, then download and install Power BI Desktop from Microsoft. This gives a local Windows environment with full Power BI Desktop capabilities including Python scripting integration.
      Option B — Remote Windows: use a university Windows machine, a cloud VM, Windows 365, or an Azure VM. No local installation required.
      Python scripting inside Power BI Desktop is available under File → Options → Python scripting. Scripts must return pandas DataFrames and complete within 30 minutes.

  - type: statement
    chapter: Interview
    kicker: Interview sentence
    headline: "Python is the analytical core.<br>Power BI is the visualization layer."
    body: |
      "I would use Python as the analytical and data-processing layer, and Power BI as the reporting and visualization layer on top of a structured data foundation."
      The key is the separation: Calyra — Python — creates the clean data model. Power BI does not contain business logic. It only visualizes a clean and well-defined structure.
      This architecture is tool-independent. If Power BI were replaced by another visualization tool tomorrow, the data model would not change.
    manifesto: Power BI does not contain business logic.
