  - id: keratin-data-evaluation
    title: Keratin Data Evaluation (Working Set)
    topic: saxs
    status: progress
    method: Keratin signal-space and mode-based inference as a four-paper program
    description: >
      Local-only keratin data-evaluation working directory with four manuscript stubs.
    abstract: >
      Keratin assemblies exhibit complex hierarchical organization, ranging from filamentous structures to higher-order two-dimensional arrangements, yet quantitative tools for resolving their mesoscale geometry remain limited. Here, we introduce a two-dimensional analysis framework for keratin modeling based on the Pair Correlation Surface Analysis (PCSA) method, enabling direct extraction of spatial correlations and structural descriptors from projected or surface-resolved data. By applying PCSA to keratin systems, we quantify characteristic length scales, anisotropy, and packing heterogeneity in 2D, bridging real-space morphology with underlying interaction patterns.

      The method leverages pair-distance statistics to construct surface-resolved correlation functions, allowing robust identification of domain organization, filament spacing, and deviations from idealized packing. Integration with scattering-derived constraints further enables cross-validation with experimental data, providing a consistent link between model predictions and measurable observables. We demonstrate that PCSA captures subtle structural transitions and disorder within keratin networks that are not readily accessible through conventional metrics.

      This approach establishes a generalized framework for evaluating fibrous protein assemblies in reduced dimensional representations and provides a scalable route to integrate modeling, microscopy, and scattering data. The proposed methodology is particularly suited for systems exhibiting surface-dominated organization and offers new opportunities for quantitative characterization of keratin and related biomaterial architectures.
    pdfs:
      - label: index
        path: ../../docs/publishing/Calyr_ai_publishing/keratin_data_evaluation/index.html
      - label: root
        path: ../../docs/publishing/Calyr_ai_publishing/keratin_data_evaluation/

  - id: keratin-modelling
    title: Keratin Modelling (Working Set)
    topic: saxs
    status: progress
    method: Mechanistic keratin modelling under descriptor-space and constraint coupling
    description: >
      Local-only keratin modelling publication line kept distinct from data evaluation.
    abstract: >
      Understanding the structural basis of keratin surface organization requires connecting
      sequence-derived models with dynamic, environment-dependent conformations. We combine
      AlphaFold-derived structural priors with molecular dynamics simulations to resolve how
      anisotropic surface "faces" emerge dynamically and govern intermolecular interaction and
      assembly behavior.
    pdfs:
      - label: index
        path: ../../docs/publishing/Calyr_ai_publishing/keratin_modelling/index.html
      - label: root
        path: ../../docs/publishing/Calyr_ai_publishing/keratin_modelling/

