  - id: chromatography-fractional-transport
    title: Chromatography Fractional Transport
    topic: purification
    status: progress
    # doi: 10.xxxx/xxxxxxx
    # arxiv: 2401.xxxxx
    # archive_url: https://arxiv.org/abs/2401.xxxxx
    method: Fractional-operator transport modes; heavy-tailed kinetics from column profiles
    description: >
      Fractional operators and mode-based chromatography interpretation.
      Distributed timescales and heavy-tailed kinetics.
    abstract: >
      Packed-column transport is governed by fractional differential operators when the effective pore-size
      distribution is broad and elution profiles exhibit heavy-tailed kinetics. The fractional transport
      equation recovers the classical van Deemter result in the integer-order limit and extends it to anomalous
      dispersion. A basis decomposition of the fractional modes provides a direct handle on column efficiency
      over the full concentration program without assuming Gaussian peak shapes.
    pdfs:
      - label: open
        path: ../../docs/publishing/Calyr_ai_publishing/nexus_chromatography_fractional_transport/nexus_chromatography_fractional_transport.pdf

  - id: fco-manuscript
    title: FCO Manuscript
    topic: saxs
    status: progress
    # doi: 10.xxxx/xxxxxxx
    # arxiv: 2401.xxxxx
    # archive_url: https://arxiv.org/abs/2401.xxxxx
    method: Field-coupled operator framework for SAXS-driven structural characterisation
    description: >
      FCO framework manuscript.
    abstract: >
      Field-coupled operators applied to SAXS I(q) curves identify structural hierarchy across length scales
      without prior knowledge of particle shape or maximum dimension. The FCO layer is placed after standard
      normalisation and indirect Fourier transform; the resulting structural fingerprint is directly comparable
      across compound classes. Coupling to Nexus constraints allows multi-instrument validation of the FCO-derived
      structural state.
    pdfs:
      - label: open
        path: ../../docs/publishing/Calyr_ai_publishing/fco_manuscript/fco_manuscript.pdf

