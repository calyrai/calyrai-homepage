    abstract: >
      Die Migration wird als strukturelle Transformation verstanden: Daten, Semantik und Anwendung werden getrennt aufgebaut; das Data Warehouse dient als Grundlage fuer konsistente BI und lokale LLM-Interpretation.
    pdfs:
