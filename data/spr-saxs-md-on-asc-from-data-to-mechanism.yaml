schema_version: 1
# Slide deck for the Explore ASC workflow presentation
# Source of truth — edit here, then regenerate:
#   python3 scripts/build_deck.py data/spr-saxs-md-on-asc-from-data-to-mechanism.yaml

slides:

  - type: title
    kicker: Calyr.ai · SAXS
    headline: "SPR + SAXS + MD on ASC:<br>from data to mechanism"
    tagline: concrete workflow, abstract figures, and constrained model testing

  - type: statement
    chapter: System
    kicker: System
    headline: "IgG adsorption on Protein A resin<br>is the test system"
    body: |
      The measurements are SAXS for structure and SPR for kinetics.
      The goal is not just to describe the data, but to identify the mechanism that can explain both.
      This is the concrete system that ties the workflow together.

  - type: statement
    chapter: SAXS
    kicker: What SAXS shows
    headline: "Characteristic distances appear<br>and shift with load"
    body: |
      The SAXS data shows characteristic distances around thirteen to fifteen nanometers, around thirty nanometers, and around sixty nanometers.
      These peaks shift as loading increases.
      The structural signal is concrete, but it still does not identify the mechanism by itself.

  - type: statement
    chapter: SPR
    kicker: What SPR shows
    headline: "The sensorgram reveals<br>more than simple Langmuir behavior"
    body: |
      The binding curve $R(t)$ shows two regimes with a first saturation and a second saturation.
      That already suggests the system is more complex than a single-site Langmuir picture.
      Kinetics is informative, but still not uniquely mechanistic.

  - type: statement
    chapter: Problem
    kicker: Interpretation problem
    headline: "One dataset cannot decide<br>between multiple explanations"
    body: |
      Possible explanations include heterogeneous sites, steric blocking, and protein-protein interaction.
      Looking at only one dataset cannot distinguish them reliably.
      The mechanism has to survive both structural and kinetic tests.

  - type: statement
    chapter: Model
    kicker: Minimal model
    headline: "Use the smallest model that can still<br>carry the mechanism"
    body: |
      IgG is represented as a five-bead Y-shape.
      The ligand is represented as a hexamer with four active sites and two blocked anchors.
      A spacing of roughly fifteen nanometers defines the geometric baseline.

  - type: statement
    chapter: ASC
    kicker: Simulation platform
    headline: "ASC turns parameter space<br>into a batch workflow"
    body: |
      Access is via SSH and OTP.
      Jobs run through Slurm and each job corresponds to one parameter set.
      The platform is used to test model families systematically rather than interactively.

  - type: statement
    chapter: MD
    kicker: LAMMPS input
    headline: "Interactions are specified<br>at the minimal mechanistic level"
    body: |
      The LAMMPS input defines beads, Fc-ligand interactions, IgG-IgG interactions, and steric exclusion.
      That is sufficient to generate trajectories and binding histories.
      The simulation stays coarse, but mechanistically interpretable.

  - type: statement
    chapter: Workflow
    kicker: Slurm and output
    headline: "Batch simulation produces trajectories,<br>events, and clusters"
    body: |
      Slurm executes one parameter set per batch job.
      The outputs are positions, binding events, and cluster formation patterns.
      These are the raw materials from which SAXS-like and SPR-like observables are reconstructed.

  - type: statement
    chapter: Evaluation
    kicker: Compare back to experiment
    headline: "Compute the same observables<br>and reject what fails"
    body: |
      From MD, compute pair-distance distributions and compare them to the SAXS peaks and their shifts.
      Also extract association and dissociation behavior and compare it to the SPR sensorgram.
      If the model does not match both, reject it.

  - type: statement
    chapter: Result
    kicker: Result
    headline: "Only the model with sterics and<br>IgG-IgG interaction survives"
    body: |
      The successful model requires steric blocking together with cooperative IgG-IgG interaction.
      That combination reproduces SAXS and SPR simultaneously.
      The mechanism is selected by cross-constraint, not by a single fit.

  - type: statement
    chapter: Emergence
    kicker: Emergence
    headline: "Bi-Langmuir behavior is not primary,<br>it emerges from the geometry"
    body: |
      The observed macroscopic behavior is not treated as fundamental.
      It emerges from geometry, sterics, and interaction rules in the coarse system.
      The mechanism is therefore more basic than the empirical fit form.

  - type: statement
    chapter: FAIR
    kicker: FAIR linkage
    headline: "FAIR is what keeps the full workflow<br>comparable and reusable"
    body: |
      FAIR means Findable, Accessible, Interoperable, and Reusable.
      It is essential because SAXS, SPR, and MD outputs have to be represented in ways that can be compared, filtered, and reused across runs.
      Without FAIR-compatible abstractions, the workflow cannot support reproducible decision-making.

  - type: statement
    chapter: Conclusion
    kicker: Conclusion
    headline: "SAXS gives structure, SPR gives kinetics,<br>MD tests mechanism"
    body: |
      ASC provides the batch compute layer that makes systematic testing feasible.
      The full workflow moves from measurement to constrained mechanism selection.
      The result is not a fit, but a consistent mechanism identified across data types.
    manifesto: If it does not match both observables, discard it.