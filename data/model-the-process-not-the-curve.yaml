schema_version: 1
# Slide deck for the Explore kinetics presentation
# Source of truth — edit here, then regenerate:
#   python3 scripts/build_deck.py data/model-the-process-not-the-curve.yaml

slides:

  - type: title
    kicker: Calyr.ai · SPR
    headline: "We model the process,<br>not the curve"
    tagline: 'one adsorption model spans the full signal from $t \to 0$ to $t \to \infty$'

  - type: statement
    chapter: Core idea
    kicker: The shift
    headline: "Do not fit the SPR trace<br>and adsorption plateau separately"
    body: |
      The aim is not to fit an adsorption isotherm on one side and SPR kinetics on the other.
      We build one physical model that generates both observables from the same mechanism.
      Time evolution and equilibrium are therefore two limits of one process, not two unrelated fits.

  - type: statement
    chapter: System
    kicker: Physical picture
    headline: "A minimal binding system<br>is already enough"
    body: |
      Sites can be empty or occupied.
      Molecules can bind by adsorption and unbind by desorption.
      The stochastic trajectory is simulated with the Gillespie algorithm, so the microscopic events directly generate the macroscopic signal.

  - type: equation
    chapter: Mean behavior
    kicker: Governing equation
    headline: "One equation spans the signal<br>from start to equilibrium"
    eq: "$$\\frac{dn}{dt} = k_{\\text{on}} c (N - n) - k_{\\text{off}} n$$"
    body: |
      The occupancy $n(t)$ increases by adsorption onto empty sites and decreases by desorption from occupied sites.
      The same rate law controls the initial rise and the long-time plateau.
      There is no separate equilibrium model added later.

  - type: statement
    chapter: Limits
    kicker: Two-sided constraint
    headline: 'Both $t \to 0$ and $t \to \infty$<br>constrain the same model'
    body: |
      At early time, $t \to 0$, the growth rate reveals how binding starts and is governed by $k_{\text{on}}$.
      At late time, $t \to \infty$, the steady state defines the adsorption isotherm and depends on the ratio $k_{\text{on}} / k_{\text{off}}$.
      A valid model has to match both limits simultaneously.

  - type: equation
    chapter: Equilibrium
    kicker: Long-time result
    headline: "The adsorption isotherm is the<br>long-time limit of the SPR dynamics"
    eq: "$$n_{\\infty} = \\frac{k_{\\text{on}} c}{k_{\\text{on}} c + k_{\\text{off}}} \\, N$$"
    body: |
      The equilibrium curve is not fitted independently.
      It emerges automatically from the same kinetic process once the trajectory has relaxed.
      That is the key simplification: one mechanism, one parameter set, two observables.

  - type: statement
    chapter: Why it matters
    kicker: Interpretation
    headline: "Physical consistency replaces<br>curve-by-curve fitting"
    body: |
      Using one model reduces free parameters, limits overfitting, and keeps the interpretation physically coherent.
      The SPR trace and the adsorption isotherm can no longer disagree silently because they are generated by the same system.
      This is exactly the structure needed for model-based interpretation of adsorption measurements.

  - type: statement
    chapter: One-liner
    kicker: Takeaway
    headline: "Both time scales are covered<br>by modeling alone"
    body: |
      We do not fit the curve.
      We model the process that generates the curve.
      Once the process is correct, both the initial SPR response and the equilibrium adsorption behavior follow from it.
