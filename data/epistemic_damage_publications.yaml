title: Publication Network
summary: >-
  Python-generated publication graph for the framework paper and a real tracked
  capped-cylinder publication pair in Journal of Applied Crystallography. The
  browser renderer draws the graph, but the network content, sizing, coloring,
  and layout are produced during the build in Python so Nexus can update it as
  data.
source_binding: nexus/projects/literature/experiments/epistemic_damage_seed.yaml
data_sources:
  - Crossref
  - OpenAlex
scan_note: >-
  DOI resolution was checked against Crossref and upward citation ancestry was
  expanded from OpenAlex referenced_works records for the resolved papers, and
  the latest citing papers are pulled from OpenAlex at build time.
graph_generation:
  latest_citation_roots:
    - seed_corpus
    - reference_set
  latest_citations_limit: 6
  crossreference_kinds:
    - upstream
root_id: framework_paper
