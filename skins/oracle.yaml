# Oracle Dark Skin
# Deep, sophisticated dark theme with purple/violet accents for knowledge extraction

skin:
  id: oracle
  name: oracle dark
  description: Dark, sophisticated design with mysterious violet accents

  colors:
    background: "#000000"
    surface: "#000000"
    text_primary: "#ffffff"
    text_secondary: "rgba(255, 255, 255, 0.8)"
    text_tertiary: "rgba(255, 255, 255, 0.6)"
    muted: "#d0d0d0"
    primary: "#ffffff"
    accent: "#ffffff"
    accent_secondary: "#e0e0e0"
    border: "rgba(255, 255, 255, 0.35)"
    border_light: "rgba(255, 255, 255, 0.2)"
    success: "#28a745"
    warning: "#ffc107"
    error: "#dc3545"

  components:
    tile:
      background: "{{ colors.surface }}"
      background_hover: "rgba(255, 255, 255, 0.08)"
      border: "1px solid {{ colors.border }}"
      border_hover: "1px solid {{ colors.accent }}"
      shadow: "0 2px 8px rgba(255, 255, 255, 0.08)"
      shadow_hover: "0 8px 24px rgba(255, 255, 255, 0.12)"
      text_color: "{{ colors.text_primary }}"
      link_color: "{{ colors.accent }}"

    hero:
      background: "#000000"
      text: "#ffffff"
      brand_color: "#ff00ff"
      logo_layout: "stacked"
      accent: "{{ colors.accent }}"
      kicker_color: "rgba(255, 255, 255, 0.82)"
      subtitle_color: "rgba(255, 255, 255, 0.88)"
      glow_color: "rgba(255, 0, 255, 0.18)"

    header:
      background: "#000000"
      border_bottom: "1px solid {{ colors.border_light }}"
      text_color: "{{ colors.text_primary }}"
      nav_hover_color: "{{ colors.accent }}"
      nav_active_color: "{{ colors.accent }}"

    footer:
      background: "#000000"
      border_top: "1px solid {{ colors.border_light }}"
      text_color: "{{ colors.text_primary }}"
      link_color: "{{ colors.text_primary }}"
      link_hover_color: "{{ colors.text_primary }}"

    section:
      background: "#000000"
      text_color: "#ffffff"
      border: "1px solid {{ colors.border_light }}"

    element:
      background: "#000000"
      text_color: "#ffffff"
      border: "1px solid {{ colors.border_light }}"

    graph:
      node_background: "{{ colors.surface }}"
      node_border: "{{ colors.accent }}"
      node_text: "{{ colors.text_primary }}"
      edge_color: "{{ colors.primary }}"
      edge_hover_color: "{{ colors.accent }}"

    button:
      background: "{{ colors.primary }}"
      text: "{{ colors.text_primary }}"
      hover_background: "{{ colors.accent_secondary }}"
      accent_background: "{{ colors.accent }}"
      accent_text: "{{ colors.background }}"
