# Nexus Workspace Panels Configuration
# This file defines the panel layout, properties, and behavior for glabs_os.html

# Panel definitions (left sidebar, right sidebar, footer)
panels:
  # Left sidebar panels
  - id: panel-registry
    title: Registry
    type: tool-panel
    location: left-sidebar
    position: 1
    size: compact
    group: input
    collapsed: true
    description: Saved braille patterns and reusable module seeds.
    rootId: backpack-panel-root

  - id: panel-compose
    title: Compose
    type: tool-panel
    location: left-sidebar
    position: 2
    size: compact
    group: input
    collapsed: true
    description: Draft a new braille pattern and activate it into the workspace.
    rootId: braille-input-root

  # Right sidebar panels
  - id: panel-selection
    title: Selection
    type: info-panel
    location: right-sidebar
    position: 1
    size: compact
    group: graph
    collapsed: true
    description: Active module metadata, braille signature, and current role.
    rootId: active-node-panel-root
    hasWindowTools: true

  - id: panel-linked
    title: Linked Modules
    type: info-panel
    location: right-sidebar
    position: 2
    size: medium
    group: graph
    collapsed: true
    description: Direct dependencies and semantic adjacencies from the selected module.
    rootId: connected-list-root

  # Footer panels
  - id: panel-contents
    title: Contents
    type: info-panel
    location: footer
    position: 1
    size: medium
    group: content
    collapsed: true
    description: Navigate the active module outline, linked materials, and available surfaces.
    rootId: content-outline-root

  - id: panel-terminal
    title: Terminal
    type: terminal-panel
    location: footer
    position: 2
    size: wide
    group: content
    collapsed: false
    description: Runtime shell, graph inspection, code browser, and output surface.
    rootId: terminal-panel-root

  - id: panel-comment
    title: Comments
    type: info-panel
    location: footer
    position: 3
    size: medium
    group: content
    collapsed: false
    description: Markdown comments for the current workspace state, ideas, and next edits.
    rootId: comment-panel-root

# Global configuration
layout:
  dock:
    enabled: true
    position: top
  overlay:
    enabled: true
    z-index: 100
  gestures:
    twoFingerSwipe: true
    touchSwipe: true
    doubleClick: true

# Pin behavior configuration
pinBehavior:
  close:
    color: cyan
    action: collapse-to-dock
    tooltip: Close panel
  minimize:
    color: magenta
    action: toggle-minimize
    tooltip: Minimize panel
  expand:
    color: white
    action: maximize
    tooltip: Expand panel

# Panel states
defaultStates:
  collapsed-panels: [panel-registry, panel-compose, panel-selection, panel-linked, panel-contents]
  open-panels: [panel-terminal, panel-comment]
  overlay-capable: [panel-selection, panel-linked, panel-contents, panel-terminal, panel-comment]
