<body>
{{CONTENT}}

<dialog id="contact-dialog" class="contact-dialog" aria-label="Contact">
  <div class="contact-dialog__frame" data-contact-swipe>
    <div class="contact-dialog__track">
      <section class="contact-dialog__panel contact-dialog__panel--qr" aria-label="QR">
        <div class="contact-dialog__swipe-right" aria-hidden="true"></div>
        <button type="button" class="qr-noise-widget" data-qr-noise data-qr-yaml="/data/contact.yaml" data-qr-text="https://calyr.ai/" data-qr-size="340" aria-label="QR">
          <canvas class="qr-noise-canvas" width="300" height="300" aria-hidden="true"></canvas>
        </button>
      </section>

      <section class="contact-dialog__panel contact-dialog__panel--email" aria-label="Email">
        <a id="contact-dialog-email" data-contact-direct-mail href="mailto:rupert.tscheliessnig@calyr.ai?subject=Contact&body=" class="contact-dialog__email">rupert.tscheliessnig@calyr.ai</a>
      </section>
    </div>
  </div>
</dialog>
