<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calyr.aí Pitch</title>
    <link rel="stylesheet" href="/research/teaser/pitch.css" />
  </head>
  <body>
    <main class="stage" aria-label="CALYR pitch stage">
      <header class="header">
        <div>
          <div class="kicker" id="page-kicker"></div>
          <h1 class="title" id="page-title"></h1>
          <p class="subtitle" id="page-subtitle"></p>
          <a class="teaser-deck-link" id="page-deck-link" href="">
            <span id="page-deck-link-label"></span>
            <span class="teaser-deck-arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </header>

      <section class="scene" aria-label="Pitch graph scene">
        <canvas id="point-field" class="point-field" aria-hidden="true"></canvas>
        <svg id="pitch-graph" viewBox="0 0 960 460" role="img" aria-label="CALYR scientific pitch graph"></svg>
        <div class="scene-status" id="scene-status">Game ready</div>
        <div class="game-hud" aria-label="Flow game controls">
          <span id="game-progress" class="game-progress">Slides 0</span>
          <span id="game-score" class="game-score">Score 0</span>
          <button id="game-reset" class="game-button" type="button">Reset</button>
          <button id="game-demo" class="game-button" type="button">Play the flow →</button>
        </div>
      </section>

      <section class="insight-grid" aria-label="Active insight">
        <article class="panel">
          <h2 id="insight-title"></h2>
          <p id="insight-copy"></p>
          <ul id="insight-points" class="insight-points"></ul>
        </article>

      </section>
    </main>

    <script type="module" src="/research/teaser/pitch.js"></script>
  </body>
</html>
