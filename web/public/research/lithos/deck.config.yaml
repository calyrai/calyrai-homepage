slides:
  - title: "Abstract Data Spaces."
    subtitle: "Simulation begins with isolated dimensions."
    story: "Multiple abstract data spaces represent distinct physical and theoretical domains. Each point explores its own phase space independently before coupling emerges."
    type: "line"
    hint: "Sparse links only: observe phase-space motion, then drag points to test individual optimization behavior."

  - title: "Surrogate Linkage."
    subtitle: "A surrogate model bridges data domains."
    story: "A surrogate model is introduced to unify experimental and theoretical data spaces into one coherent latent structure—the foundation for integrated control."
    type: "magenta"
    hint: "Observe how the surrogate linkage aligns experimental and theoretical datapoints."

  - title: "Coupled Control."
    subtitle: "Surrogate model enables steering."
    story: "The surrogate model is now coupled to experimental and theoretical datapoint modes. Changes in one space propagate through the surrogates, enabling unified steering."
    type: "flow"
    hint: "Move the control points to see connected surrogate and datapoint modes co-adapt in real time."

  - title: "Magenta Spline Steering."
    subtitle: "Boundary conditions constrain the evolution."
    story: "The magenta spline defines boundary conditions applied directly in the surrogate model. This constrains how the coupled data spaces evolve—you steer the simulation."
    type: "flow-finalize"
    hint: "Adjust the magenta controls to modify boundary conditions and observe the surrogate model response."

  - title: "Aortic Bow: Example."
    subtitle: "Abstract control yields concrete medical geometry."
    story: "The aortic arch demonstrates how surrogate-guided control converges to a stabilized, editable 3D form."
    type: "final-bow"
    hint: "Drag on the model to rotate the aortic arch and inspect its stent lattice."

  - title: "Universal Transfer."
    subtitle: "The same surrogate logic crosses domains."
    story: "The aortic curve becomes a sculptural bridge. This transfer from medicine to architecture demonstrates that surrogate models are universally applicable wherever complex data, constraints, and geometry must converge."
    type: "final-bridge"
    hint: "Rotate and reshape the bridge to see the same surrogate-controlled curve operate in a new domain."
