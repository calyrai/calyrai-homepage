    subtitle: "Magenta boundary conditions are introduced."
    story: "Magenta boundary conditions are introduced and implemented directly in the surrogate model, constraining how connected datapoint modes evolve."
    type: "flow-finalize"
    hint: "Adjust the magenta controls to modify boundary conditions and observe the surrogate model response."

