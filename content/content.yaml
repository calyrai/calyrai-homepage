legal:

  title: "legal"

  subtitle: "Information"

  summary: >
    Legal and platform information.

  body: >
    Impressum, privacy policy,
    contact information,
    and external links.
    Credentials: Rupert Tscheliessnig,
    Founder of Calyr.aí,
    AI and surrogate modelling research.

  icon: document

