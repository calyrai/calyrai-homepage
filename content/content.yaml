brand:
  display_name: "calyr.a\xED"
  domain: calyr.ai
  tagline: AI-assisted modelling. Pythia. BRIX. LITHOS.
__site_runtime:
  teaser:
    meta:
      title: calyr.aí Explore
      subtitle: Questions become evidence networks and actionable paths
      mode: interactive-flow
    page:
      kicker: How we work
      title: From complex challenge to scalable product.
      subtitle: We start with one valuable scientific or engineering challenge, prove measurable value with real evidence and grow the validated result into a deployable system.
      deck_link_label: Explore the project system
      deck_link_url: /research/lithos/index.html
      insight_title: Prediction becomes action
      insight_copy: Oracles combine Pythia predictions, domain constraints, uncertainty, and adaptive AI-based user experiences in one usable system.
      hpc_title: Computation creates the surrogate
      hpc_copy: High-Performance Computing on systems including VSC-5 generates the data that Pythia compresses into fast, explainable prediction.
    engagement:
      kicker: 03 / VALUE PATH
      title: Start focused. Prove value. Scale together.
      phases:
      - {id: '01', title: Start focused, copy: "Select one valuable scientific or engineering challenge with a clear user, evidence base, decision and measurable outcome.", result: "Output — explicit problem frame and success criteria"}
      - {id: '02', title: Prove value, copy: "Build the smallest interactive demonstrator with the customer's data and domain knowledge; validate or falsify the central assumption early.", result: "Output — evidence-backed go, redesign or stop decision"}
      - {id: '03', title: Scale together, copy: "Turn the validated demonstrator into a reliable deployment, platform capability and long-term partnership without restarting from zero.", result: "Output — deployable product and recurring platform value"}
    copy:
      mission: Pythia turns data into surrogate prediction. Oracles turn prediction into decisions and engineered results.
      ready: System ready
      complete: Engineering chain complete
      empty_story_title: calyr.aí works
      empty_story_item: The Pythia chain connects data, surrogate models, prediction, and oracles.
    nodes:
    - {id: challenge, label: Data, x: 0.12, y: 0.50, sentence: "Measurements, simulations, geometry, and constraints define the evidence space."}
    - {id: demonstrator, label: Surrogate, x: 0.37, y: 0.50, sentence: "Pythia compresses complex evidence into a fast, validated surrogate model."}
    - {id: deployment, label: Prediction, x: 0.63, y: 0.50, sentence: "The surrogate predicts system behavior, valid variants, and uncertainty in real time."}
    - {id: partnership, label: Oracle, x: 0.88, y: 0.50, sentence: "An Oracle turns prediction into domain-specific decisions, designs, and engineered results."}
    edges:
    - {from: challenge, to: demonstrator, slide: Data becomes surrogate, thought: Pythia learns the relevant structure of the evidence space., explanation: The surrogate preserves the behavior that matters and removes the computational delay.}
    - {from: demonstrator, to: deployment, slide: Surrogate becomes prediction, thought: "The learned model evaluates new states, variants, and uncertainty in real time.", explanation: Prediction makes complex systems immediately explorable.}
    - {from: deployment, to: partnership, slide: Prediction becomes oracle, thought: Domain knowledge turns prediction into a usable engineering capability., explanation: "The Oracle combines prediction, constraints, adaptive interaction, and action."}
    story_rules:
      self_avoiding: true
      max_steps: 3
      scoring: {valid_connection: 3, invalid_connection: -1, repeat_penalty: -2}
    workflow:
      kicker: 05 / CALYR.AÍ WORKFLOW
      title: Prototype locally. Scale on VSC-5. Validate before deployment.
      introduction: Start small, test the decisive assumption early and use supercomputing only after the evidence justifies scale.
      phases:
      - {id: '01', title: Contact & context analysis, copy: "Requirements, data, target variables and constraints become an explicit problem frame."}
      - {id: '02', title: Predesign, copy: "Decompose the problem; define architecture, validation metrics and stop criteria."}
      - {id: '03', title: Rapid MVP prototyping, copy: Implement the smallest end-to-end workflow and test it on deliberately small datasets.}
      - {id: '04', title: Local pretraining on the calyr.aí Cube, copy: "Iterate rapidly on the surrogate, data pipeline, features and training logic before consuming large-scale compute."}
      - {id: '05', title: Evidence and specification gate, copy: "Review model behavior, data quality, compute demand, expected value and stop criteria against the project specification."}
      - {id: '06', title: Scale training on VSC-5, copy: "Run the computationally intensive simulation, training and search workloads on VSC-5 only when the local MVP supports the central assumption."}
      - {id: '07', title: Validation and falsification, copy: "Challenge the scaled result against independent reference data, simulations, uncertainty checks and the success criteria defined before training."}
      - {id: '08', title: Deployable MVP with validity envelope, copy: "Package the validated model as a demonstrator, API, interface or decision system with provenance, uncertainty and explicit operating limits."}
      decisions:
      - {after: '05', positive: "Evidence supports scale — allocate VSC-5 compute", negative: "Evidence is insufficient — redesign, simplify or stop"}
      - {after: '07', positive: "Validation gate passed — package the deployable MVP", negative: "Validation gate failed — return to data, predesign or local pretraining"}
      feedback_loops:
      - {id: LOOP-01, from: '03', to: '01–02', title: MVP learning loop, trigger: "The demonstrator exposes a wrong target, missing constraint or weak value hypothesis.", action: "Reframe the problem and revise predesign before adding model complexity."}
      - {id: LOOP-02, from: '05', to: '02–04', title: Evidence gate loop, trigger: "Data quality, model behavior, expected value or compute justification does not pass specification review.", action: "Return to data, architecture or local pretraining; simplify or stop when the assumption remains unsupported."}
      - {id: LOOP-03, from: '06', to: '03–04', title: VSC-5 scale loop, trigger: "Large-scale training reveals instability, sensitivity, bottlenecks or insufficient generalization.", action: "Feed diagnostics back into the local MVP, features, sampling strategy and training logic before another VSC-5 run."}
      - {id: LOOP-04, from: '07', to: '01–06', title: Validation loop, trigger: "Independent evidence falsifies the model or narrows its useful operating range.", action: "Return to the earliest stage responsible for the failure, then repeat every downstream gate."}
      - {id: LOOP-05, from: '08', to: '01–07', title: Deployment learning loop, trigger: "Monitoring detects drift, new use conditions, user corrections or previously unseen evidence.", action: "Capture the observation as new evidence, update locally, rescale only if necessary and revalidate before release."}
      questions:
      - Does the problem definition match the available evidence?
      - Does the MVP already create measurable value?
      - Does model quality justify the next scale step?
      - Does VSC-5 training improve the relevant target metrics?
      - Can the central assumption be validated or falsified?
      closing: Learn locally. Scale deliberately. Feed evidence back. Revalidate before release.
  lithos_deck:
    seed: 5318008
    page:
      language: en
      title: calyr.aí engineering in action
      description: An interactive calyr.aí story showing how observations become surrogate models, controllable predictions, and an engineered vascular result.
      canonical: https://calyr.ai/research/lithos/index.html
      theme_color: '#000000'
    interaction: {swipe_enabled: true, swipe_threshold: 64, swipe_max_vertical_ratio: 0.72}
    ui:
      footer_primary: FROM DATA TO FORM.
      footer_secondary: FROM MODEL TO ENGINEERED RESULT.
      default_hint: Use left/right arrows, the top buttons, or swipe horizontally on a phone.
      journey: [OBSERVE, MODEL, COUPLE, STEER, APPLY]
    formation_steps: [0.22, 0.36, 0.52, 0.68, 0.82, 0.92, 1.00]
    cluster_centers:
    - {x: 92, y: 228}
    - {x: 182, y: 186}
    - {x: 286, y: 166}
    - {x: 398, y: 176}
    - {x: 502, y: 220}
    cluster_amounts: [14, 14, 18, 14, 14]
    slides:
    - {phase: OBSERVE, title: Complex Systems Hide Their Structure., subtitle: Observations simulations and constraints remain disconnected., story: Incomplete evidence reveals fragments of a system but not the organization that connects them., type: line, hint: Explore the isolated data spaces before a shared model exists.}
    - {phase: MODEL, title: A Surrogate Creates a Shared Model., subtitle: Experimental and theoretical spaces become one representation., story: The surrogate learns a navigable model that connects observations simulation and domain knowledge., type: magenta, hint: Observe how the magenta surrogate aligns previously separate data spaces.}
    - {phase: COUPLE, title: Coupling Enables Prediction., subtitle: A change in one domain propagates through the model., story: Connected variables respond together so the system can predict consequences rather than evaluate isolated points., type: flow, hint: Move a control point and watch the coupled representation adapt.}
    - {phase: STEER, title: Steering Enables Design., subtitle: Constraints become controls for valid solution spaces., story: Interactive boundary conditions guide exploration toward feasible high-value outcomes., type: flow-finalize, hint: Adjust the magenta controls and steer the constrained solution space.}
    - {phase: APPLY, title: 'Application: Patient-specific vascular design.', subtitle: One surrogate produces an editable engineered result., story: The controlled representation converges into patient-specific vascular geometry while preserving evidence constraints and uncertainty., type: final-bow, hint: Rotate the aortic arch and inspect the resulting medical geometry.}
