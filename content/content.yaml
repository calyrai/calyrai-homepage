oracle:
  title: Oracles
  tile_lead: domain systems
  tile_accent: magenta
  tile_title: oracles
  tile_summary: evidence, surrogate, and uncertainty become a usable decision
  subtitle: Prediction in context
  summary: 'Oracles turn Pythia predictions into decisions, designs, and engineered results.
    Every oracle separates what the data shows, what the model infers, and where
    uncertainty remains — making AI-driven decisions auditable and trustworthy.

    '
  body: 'An Oracle is the usable consequence of Pythia: surrogate prediction trained
    at scale on the Vienna Scientific Cluster 5 (VSC5), calibrated uncertainty,
    domain constraints, and adaptive interaction combined for one defined class of
    problems. Development oracles extend this pattern into engineering workflows —
    keeping evidence, model output, and uncertainty explicitly separated so developers,
    clients, and regulators can interrogate every recommendation rather than simply
    trust it. Oracles exist for vascular design, bio-nanoparticle engineering, SAXS
    structural inference, SPR binding kinetics, metabolic flux, and public protein
    evidence via the QTY/AlphaFold Oracle.

    '
  icon: crystal-ball
  route: /research/platforms/pythia/index.html
  render:
    grid_span: 4
