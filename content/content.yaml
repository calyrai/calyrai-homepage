pythia:
  title: pythia
  tile_lead: compass
  tile_accent: cyan
  tile_title: compass
  tile_summary: universal inference framework
  subtitle: Universal Framework for Complex Systems
  summary: 'A universal computational framework for representing, reasoning about,
    and discovering the hidden organization of complex systems.

    '
  body: "PYTHIA addresses a single fundamental question: how can the hidden organization\
    \ of a complex system be inferred from incomplete observations? It provides a\
    \ unified language for describing assembled systems across all disciplines\u2014\
    physical, biological, symbolic, social, and computational\u2014 and a general\
    \ inference engine for reconstructing, validating, predicting, and optimizing\
    \ them.\n"
  icon: compass
  route: /research/platforms/pythia/index.html
pythia_apps:
  title: pythia applications
  subtitle: Applied Inference
  intent:
    purpose: domain-showcase
    audience: domain-expert
  render:
    variant: tile-grid-secondary
    source: homepage.grid.pythia-band
  behavior:
    collapsible: true
    default_expanded: true
  explain:
    why: Showcase published pythia applications as entry points into domain-specific
      inference powered by PYTHIA.
  summary: Structural inference applied across scientific and engineering domains.
  body: Each pythia application is a domain-specific deployment of the PYTHIA inference
    framework. It reconstructs hidden organization from incomplete observations using
    the same universal S-Layer and General Assembly.
pythia_saxs:
  title: saxs pythia
  tile_lead: scatter
  tile_accent: cyan
  tile_title: scatter
  tile_summary: scattering inference
  subtitle: Small-Angle Scattering Pythia
  summary: Reconstructing molecular assembly structure from small-angle X-ray scattering
    profiles.
  body: The SAXS Oracle applies PYTHIA structural inference to solution scattering
    data. It infers the hidden three-dimensional organization of macromolecular assemblies
    from one-dimensional scattering curves, combining physics-based constraints with
    probabilistic multi-scale reasoning.
  icon: scatter
  route: /research/pythia/saxs/index.html
pythia_metabolic:
  title: metabolic pythia
  tile_lead: network
  tile_accent: green
  tile_title: network
  tile_summary: metabolic network inference
  subtitle: Metabolic Network Pythia
  summary: Inferring metabolic flux states and network topology from experimental
    constraints.
  body: The Metabolic Oracle applies PYTHIA to biochemical network reconstruction.
    It integrates stoichiometric constraints, thermodynamic feasibility, and experimental
    observations to infer the most plausible flux organization of a living cell under
    given conditions.
  icon: network
  route: /research/pythia/metabolic/index.html
pythia_materials:
  title: materials pythia
  tile_lead: atom
  tile_accent: orange
  tile_title: atom
  tile_summary: materials assembly inference
  subtitle: Materials Assembly Pythia
  summary: Inferring the hidden assembly structure of materials from experimental
    signatures.
  body: The Materials Oracle reconstructs the multi-scale organization of crystalline,
    amorphous, and composite materials from diffraction, scattering, and spectroscopic
    observations.
  icon: atom
  route: /research/pythia/materials/index.html
pythia_proteomics:
  title: proteomics pythia
  tile_lead: helix
  tile_accent: magenta
  tile_title: helix
  tile_summary: protein structure inference
  subtitle: Proteomics Pythia
  summary: Reconstructing protein structure and assembly from incomplete experimental
    data.
  body: The Proteomics Oracle applies PYTHIA to structural biology. It infers protein
    fold, binding geometry, and complex stoichiometry from heterogeneous experimental
    sources including SAXS, cryo-EM, NMR, and mass spectrometry.
  icon: helix
  route: /research/pythia/proteomics/index.html
pythia_engineering:
  title: engineering pythia
  tile_lead: bridge
  tile_accent: yellow
  tile_title: bridge
  tile_summary: structural systems inference
  subtitle: Structural Engineering Pythia
  summary: Inferring the load state and hidden damage organization of engineered structures.
  body: The Engineering Oracle applies PYTHIA to structural and civil engineering.
    It reconstructs internal force distributions, damage states, and failure precursors
    from sensor data, inspection records, and simulation outputs.
  icon: bridge
  route: /research/pythia/engineering/index.html
