  summary: 'Legal contact details and publisher information.

    '
footer:
  title: ''
  subtitle: ''
  summary: ''
  contacts: []
core:
  title: Calyrai core
  tile_lead: brain
  tile_accent: blue
  tile_title: brain
  tile_summary: central reasoning engine
  subtitle: Central reasoning engine
  summary: 'Connects observations, knowledge, models, and decisions.

    '
  body: 'Calyrai core is the central reasoning engine of the ecosystem. It links observations,
    knowledge representation, learning workflows, surrogate models, and decision support
    into a unified framework.

    '
  icon: brain
  route: /research/platforms/core/index.html
  intent:
    purpose: architecture-positioning
    audience: first-visit
  render:
    variant: linked-positioning
    source: content/positioning.yaml
  explain:
    why: Route the brain tile to the architecture positioning page generated from
      YAML and linked source content.
brix:
  title: brix
  tile_lead: bridge
  tile_accent: orange
  tile_title: bridge
  tile_summary: engineering intelligence
  subtitle: Engineering intelligence
  summary: 'Surrogate-assisted engineering design and analysis.

    '
  body: 'Engineering intelligence platform for structural analysis, design exploration,
    and decision support. Brix combines simulations, measurements, and surrogate models
    to enable rapid variant evaluation and uncertainty-aware engineering decisions.

    '
  icon: bridge
  route: /research/platforms/brix/index.html
aflowtex:
  title: aflowtex
  tile_lead: aorta
  tile_accent: red
  tile_title: aorta
  tile_summary: medical flow intelligence
  subtitle: Medical flow intelligence
  summary: 'Patient-specific flow modelling and clinical decision support.

    '
  body: 'Aflowtex combines clinical data, vascular modelling, flow simulation, and
    surrogate reasoning to support patient-specific analysis and uncertainty-aware
    medical decisions.

    '
  icon: aorta
  route: /research/platforms/aflowtex/index.html
lithos:
  title: lithos
  tile_lead: mountain
  tile_accent: green
  tile_title: mountain
  tile_summary: consequence intelligence
  subtitle: Consequence intelligence
  summary: 'Understanding consequences, trade-offs, and impact.

    '
  body: 'Lithos translates model outputs into actionable decisions by evaluating consequences,
    risks, trade-offs, and long-term system effects.

    '
  icon: mountain
  route: /research/platforms/lithos/index.html
oracle:
  title: pythia
  tile_lead: crystal-ball
  tile_accent: magenta
  tile_title: crystal-ball
  tile_summary: applications
  subtitle: Applied Inference
  summary: 'Extracting knowledge from complex information spaces.

    '
  body: 'Oracle transforms biological, technical, scientific, and cultural datasets
    into structured knowledge graphs, reasoning paths, and machine-readable representations.

    '
  icon: crystal-ball
  route: /research/platforms/pythia/index.html
pythia:
  title: pythia
  tile_lead: compass
  tile_accent: cyan
  tile_title: compass
  tile_summary: universal inference framework
  subtitle: Universal Framework for Complex Systems
  summary: 'A universal computational framework for representing, reasoning about,
    and discovering the hidden organization of complex systems.

    '
  body: "PYTHIA addresses a single fundamental question: how can the hidden organization\
    \ of a complex system be inferred from incomplete observations? It provides a\
    \ unified language for describing assembled systems across all disciplines\u2014\
    physical, biological, symbolic, social, and computational\u2014 and a general\
    \ inference engine for reconstructing, validating, predicting, and optimizing\
    \ them.\n"
  icon: compass
  route: /research/platforms/pythia/index.html
pythia_apps:
  title: pythia applications
  subtitle: Applied Inference
  intent:
    purpose: domain-showcase
    audience: domain-expert
  render:
    variant: tile-grid-secondary
    source: homepage.grid.pythia-band
  behavior:
    collapsible: true
    default_expanded: true
  explain:
    why: Showcase published pythia applications as entry points into domain-specific
      inference powered by PYTHIA.
  summary: Structural inference applied across scientific and engineering domains.
  body: Each pythia application is a domain-specific deployment of the PYTHIA inference
    framework. It reconstructs hidden organization from incomplete observations using
    the same universal S-Layer and General Assembly.
pythia_saxs:
  title: saxs pythia
  tile_lead: scatter
  tile_accent: cyan
  tile_title: scatter
  tile_summary: scattering inference
  subtitle: Small-Angle Scattering Pythia
  summary: Reconstructing molecular assembly structure from small-angle X-ray scattering
    profiles.
  body: The SAXS Oracle applies PYTHIA structural inference to solution scattering
    data. It infers the hidden three-dimensional organization of macromolecular assemblies
    from one-dimensional scattering curves, combining physics-based constraints with
    probabilistic multi-scale reasoning.
  icon: scatter
  route: /research/pythia/saxs/index.html
pythia_metabolic:
  title: metabolic pythia
  tile_lead: network
  tile_accent: green
  tile_title: network
  tile_summary: metabolic network inference
  subtitle: Metabolic Network Pythia
  summary: Inferring metabolic flux states and network topology from experimental
    constraints.
  body: The Metabolic Oracle applies PYTHIA to biochemical network reconstruction.
    It integrates stoichiometric constraints, thermodynamic feasibility, and experimental
    observations to infer the most plausible flux organization of a living cell under
    given conditions.
  icon: network
  route: /research/pythia/metabolic/index.html
pythia_materials:
  title: materials pythia
  tile_lead: atom
  tile_accent: orange
  tile_title: atom
  tile_summary: materials assembly inference
  subtitle: Materials Assembly Pythia
  summary: Inferring the hidden assembly structure of materials from experimental
    signatures.
  body: The Materials Oracle reconstructs the multi-scale organization of crystalline,
    amorphous, and composite materials from diffraction, scattering, and spectroscopic
    observations.
  icon: atom
  route: /research/pythia/materials/index.html
pythia_proteomics:
  title: proteomics pythia
  tile_lead: helix
  tile_accent: magenta
  tile_title: helix
  tile_summary: protein structure inference
  subtitle: Proteomics Pythia
  summary: Reconstructing protein structure and assembly from incomplete experimental
    data.
  body: The Proteomics Oracle applies PYTHIA to structural biology. It infers protein
    fold, binding geometry, and complex stoichiometry from heterogeneous experimental
    sources including SAXS, cryo-EM, NMR, and mass spectrometry.
  icon: helix
  route: /research/pythia/proteomics/index.html
pythia_engineering:
  title: engineering pythia
  tile_lead: bridge
  tile_accent: yellow
  tile_title: bridge
  tile_summary: structural systems inference
  subtitle: Structural Engineering Pythia
  summary: Inferring the load state and hidden damage organization of engineered structures.
  body: The Engineering Oracle applies PYTHIA to structural and civil engineering.
    It reconstructs internal force distributions, damage states, and failure precursors
    from sensor data, inspection records, and simulation outputs.
  icon: bridge
  route: /research/pythia/engineering/index.html
ecosystem:
  title: ecosystem
  tile_lead: network
  tile_accent: cyan
  tile_title: ecosystem
  subtitle: Interactive architecture
  summary: 'Explore relationships across the calyrai ecosystem.

    '
  body: 'Interactive graph showing how calyrai core, brix, aflowtex, lithos, oracle,
    and pythia connect and exchange knowledge. Atlas Copilot extends this with specialized
    scientific agents and pipeline orchestration.

    '
  icon: network
  route: /ecosystem
philosophy:
  title: philosophy
  tile_lead: book
  tile_accent: magenta
  tile_title: philosophy
  subtitle: Principles and foundations
  summary: 'Scientific rigor, openness, and reproducibility.

    '
  body: "Calyr.a\xED is founded on scientific transparency, reproducibility, interpretable\
    \ modelling, and human-centered decision support.\n"
  icon: book
  route: /books
