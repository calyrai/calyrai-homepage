brand:

  display_name: "Calyr.aí"

  domain: "calyr.ai"

  tagline: >
    Surrogate modelling for complex systems

logo:

  title: "Calyr.aí"

  title_ref: brand.display_name

  route: ""

route_policy:

  fallback_mailto: mailto:rupert.tscheliessnig@calyr.ai

  spa_routes:
    - /books
    - /philosophy
    - /contact

# --------------------------------------------------

hero:

  title_ref: brand.display_name

  subtitle_ref: brand.tagline

  intent:
    purpose: brand-positioning
    audience: first-visit

  render:
    variant: hero-banner

  explain:
    why: Introduce the brand promise before module exploration.

  summary: >
    create what is not here yet.

movie:

  title: "Teaser"

  subtitle: "Short"

  render:
    variant: media-feature

  behavior:
    collapsible: true
    default_expanded: false

  explain:
    why: Keep the teaser present but initially compressed so it does not dominate the opening scan path.

  summary: >
    Visual short section.

  body: >
    Place your short file path in route to load and play it here.

  route: /media/short.mp4

platforms:

  title: "Platforms"

  subtitle: "Applied intelligence modules"

  intent:
    purpose: capability-overview
    audience: first-visit

  render:
    variant: tile-grid
    source: homepage.grid.first-band

  behavior:
    collapsible: true
    default_expanded: false
    persistence: none

  explain:
    why: Present the primary product modules before the broader ecosystem context.

  summary: >
    Core platform modules for engineering,
    medicine, reasoning, and decision support.

architecture:

  title: "Architecture"

  subtitle: "System relationships"

  intent:
    purpose: ecosystem-context
    audience: returning-visitor

  render:
    variant: tile-grid-secondary
    source: homepage.grid.second-band

  behavior:
    collapsible: true
    default_expanded: false

  explain:
    why: Show how ecosystem navigation, contact, and philosophy follow the core module overview.

  summary: >
    Structural overview of module connections,
    data flow, and reasoning pathways.

footer:

  title: "Connect"

  subtitle: "CALYR.AI contact registry"

  summary: "Research, engineering, and collaboration channels."

  body: >
    Contact profile and channels are configured in YAML and can be updated without touching frontend code.

  contacts:
    - id: principal
      label: Principal
      value: Rupert Tscheliessnig
    - id: role
      label: Role
      value: CEO, Founder
    - id: email
      label: Email
      value: rupert.tscheliessnig@calyr.ai
      route: mailto:rupert.tscheliessnig@calyr.ai
    - id: phone
      label: Phone
      value: "069 919 200915"
      route: "tel:+43699192009155"
    - id: office
      label: Office
      value: TBA
      hide: true

# --------------------------------------------------

core:

  title: "Calyrai core"

  subtitle: "Central reasoning engine"

  summary: >
    Connects observations,
    knowledge,
    models,
    and decisions.

  body: >
    Calyrai core is the central reasoning engine
    of the ecosystem. It links observations,
    knowledge representation, learning workflows,
    surrogate models, and decision support into
    a unified framework.

  icon: brain

  route: /research/platforms/core/index.html

  intent:
    purpose: architecture-positioning
    audience: first-visit

  render:
    variant: linked-positioning
    source: content/positioning.yaml

  explain:
    why: Route the brain tile to the architecture positioning page generated from YAML and linked source content.

# --------------------------------------------------

brix:

  title: "brix"

  subtitle: "Engineering intelligence"

  summary: >
    Surrogate-assisted engineering
    design and analysis.

  body: >
    Engineering intelligence platform for
    structural analysis, design exploration,
    and decision support. Brix combines
    simulations, measurements, and surrogate
    models to enable rapid variant evaluation
    and uncertainty-aware engineering decisions.

  icon: bridge

  route: /research/platforms/brix/index.html

# --------------------------------------------------

aflowtex:

  title: "aflowtex"

  subtitle: "Medical flow intelligence"

  summary: >
    Patient-specific flow modelling
    and clinical decision support.

  body: >
    Aflowtex combines clinical data,
    vascular modelling, flow simulation,
    and surrogate reasoning to support
    patient-specific analysis and
    uncertainty-aware medical decisions.

  icon: aorta

  route: /research/platforms/aflowtex/index.html

# --------------------------------------------------

lithos:

  title: "lithos"

  subtitle: "Consequence intelligence"

  summary: >
    Understanding consequences,
    trade-offs, and impact.

  body: >
    Lithos translates model outputs into
    actionable decisions by evaluating
    consequences, risks, trade-offs,
    and long-term system effects.

  icon: mountain

  route: /research/platforms/lithos/index.html

# --------------------------------------------------

oracle:

  title: "oracle"

  subtitle: "Knowledge extraction engine"

  summary: >
    Extracting knowledge from
    complex information spaces.

  body: >
    Oracle transforms biological,
    technical, scientific, and cultural
    datasets into structured knowledge
    graphs, reasoning paths, and
    machine-readable representations.

  icon: crystal-ball

  route: /research/platforms/oracle/index.html

# --------------------------------------------------

delphi:

  title: "delphi"

  subtitle: "Interactive oracle interface"

  summary: >
    Explore knowledge through
    guided interaction.

  body: >
    Delphi provides an interactive
    interface for navigating knowledge,
    discovering patterns, and generating
    insights from oracle-generated
    knowledge structures.

  icon: compass

  route: /research/platforms/delphi/index.html

# --------------------------------------------------

ecosystem:

  title: "ecosystem"

  tile_lead: "network"

  tile_accent: "cyan"

  tile_title: "ecosystem"

  subtitle: "Interactive architecture"

  summary: >
    Explore relationships across
    the calyrai ecosystem.

  body: >
    Interactive graph showing how
    calyrai core, brix, aflowtex,
    lithos, oracle, and delphi
    connect and exchange knowledge.
    Atlas Copilot extends this with
    specialized scientific agents and
    pipeline orchestration.

  icon: network

  route: /ecosystem

# --------------------------------------------------

philosophy:

  title: "philosophy"

  tile_lead: "book"

  tile_accent: "magenta"

  tile_title: "philosophy"

  subtitle: "Principles and foundations"

  summary: >
    Scientific rigor,
    openness,
    and reproducibility.

  body: >
    Calyr.aí is founded on scientific
    transparency, reproducibility,
    interpretable modelling,
    and human-centered decision support.

  icon: book

  route: /philosophy

# --------------------------------------------------

