    route: https://eur-lex.europa.eu/eli/reg/2024/1689/oj#art_9
  - id: eu-human-oversight
    label: Article 14 — Human oversight
    route: https://eur-lex.europa.eu/eli/reg/2024/1689/oj#art_14
  - id: eu-robustness
    label: Article 15 — Accuracy, robustness and cybersecurity
    route: https://eur-lex.europa.eu/eli/reg/2024/1689/oj#art_15
  icon: book
