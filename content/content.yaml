networks:

  atlas_copilot:

    title: "CALYRAI Atlas Copilot Network"

    subtitle: "Scientific agent layer and orchestration"

    summary: >
      Candidate-first reasoning workspace where
      accepted decisions commit nodes, relations,
      citations, and history into the atlas.

    namespaces:
      - calyrai.reader
      - calyrai.extract
      - calyrai.relate
      - calyrai.cite
      - calyrai.atlas
      - calyrai.reason
      - calyrai.write
      - calyrai.present
      - calyrai.search
      - calyrai.runtime

    pipelines:
      - reader-pipeline
      - knowledge-pipeline
      - discussion-pipeline
      - graph-pipeline
      - writing-pipeline
      - presentation-pipeline

    model_stack:
      - reasoning-llm
      - embedding-model
      - reranker

    sources:
      - ../calyrai-protein-oracle/projects/atlas-copilot/spec/agent-layer.yaml
      - ../calyrai-protein-oracle/projects/atlas-copilot/spec/pipeline-architecture.yaml
      - ../calyrai-protein-oracle/projects/atlas-copilot/spec/model-stack.yaml

# --------------------------------------------------

__interaction:

  click:
    tile:
      action: openNode

  hover:
    tile:
      action: highlight

  graph:
    node:
      action: focusNode

# --------------------------------------------------

__flowchart:

  homepage:

    title: "Homepage Narrative Flow"

    direction: TD

    nodes:
      - id: landing
        label: "Visitor lands"
        kind: start
        explain:
          why: Entry point for a new or returning visitor.

      - id: hero_stage
        ref: hero
        label: "Brand promise"
        intent:
          purpose: orient-visitor

      - id: platforms_stage
        ref: platforms
        label: "Platform overview"
        intent:
          purpose: explain-capabilities

      - id: architecture_stage
        ref: architecture
        label: "Ecosystem context"
        intent:
          purpose: explain-relationships

      - id: contact_stage
        ref: contact
        label: "Contact / conversion"
        kind: terminal
        intent:
          purpose: trigger-outreach

    edges:
      - [landing, hero_stage]
      - [hero_stage, platforms_stage]
      - [platforms_stage, architecture_stage]
      - [architecture_stage, contact_stage, "reach out"]