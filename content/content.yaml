# --------------------------------------------------

__graph:

  nodes:
    - core
    - brix
    - aflowtex
    - lithos
    - oracle
    - delphi

  edges:
    - [core, brix]
    - [core, aflowtex]
    - [core, lithos]
    - [core, oracle]
    - [oracle, delphi]

# --------------------------------------------------

__interaction:

  click:
    tile:
      action: openNode

  hover:
    tile:
      action: highlight

  graph:
    node:
      action: focusNode

# --------------------------------------------------

__flowchart:

  homepage:

    title: "Homepage Narrative Flow"

    direction: TD

    nodes:
      - id: landing
        label: "Visitor lands"
        kind: start
        explain:
          why: Entry point for a new or returning visitor.

      - id: hero_stage
        ref: hero
        label: "Brand promise"
        intent:
          purpose: orient-visitor

      - id: platforms_stage
        ref: platforms
        label: "Platform overview"
        intent:
          purpose: explain-capabilities

      - id: architecture_stage
        ref: architecture
        label: "Ecosystem context"
        intent:
          purpose: explain-relationships

      - id: contact_stage
        ref: contact
        label: "Contact / conversion"
        kind: terminal
        intent:
          purpose: trigger-outreach

    edges:
      - [landing, hero_stage]
      - [hero_stage, platforms_stage]
      - [platforms_stage, architecture_stage]
      - [architecture_stage, contact_stage, "reach out"]