research_system:
  id: CALYR-RESEARCH-SYSTEM-001
  title: calyr.aí research system
  source_of_truth: content/research-system.yaml
  content_source: content/books.yaml
  chapters:
    - id: methods
      number: "01"
      title: Methods
      route: /research/methods/
      purpose: Define reusable scientific and computational contracts.
    - id: oracling
      number: "02"
      title: Oracling
      route: /research/methods/oracling/
      purpose: Turn evidence and uncertainty into traceable proposals and next actions.
    - id: interfaces
      number: "03"
      title: Interfaces
      route: /research/interfaces/
      purpose: Define graphical interaction contracts for scientific understanding and control.
  swiss_code:
    id: CALYR-SWISS-CODE-001
    number: "04"
    title: Swiss Code
    route: /research/swiss-code/
    purpose: Make the shared visual, structural, interaction, and provenance rules explicit.
    status: Working design contract
  design:
    grid:
      columns: 12
      max_width_px: 1240
      gutter_px: 20
      content_split: [3, 9]
      card_split: [3, 5, 4]
    spacing:
      base_unit_px: 8
      section_min_px: 48
      section_max_px: 96
    typography:
      family: Helvetica Neue, Helvetica, Arial, sans-serif
      headline_style: large, compact, left-aligned, negative tracking
      label_style: uppercase, compact, letter-spaced
      body_measure_ch: 76
    palette:
      paper: "#050505"
      card: "#090909"
      ink: "#f5f5f2"
      soft: "#a7abb0"
      line: "#343434"
      accent: "#39bfff"
    breakpoints:
      stacked_px: 780
      compact_px: 620
  chapter_anatomy:
    - order: "01"
      name: Orientation
      rule: State chapter, scope, status, and source before detail.
    - order: "02"
      name: Contract
      rule: Name inputs, transformations or interactions, outputs, and limitations.
    - order: "03"
      name: Evidence
      rule: Keep provenance, uncertainty, applicability, and missingness visible.
    - order: "04"
      name: Action
      rule: End with a test, decision, implementation step, or next reading.
    - order: "05"
      name: Validation
      rule: Define how the method, decision, or interface can fail.
  principles:
    - id: SC-01
      title: Clarity before ornament
      rule: Every graphical element must carry structure, state, evidence, or action.
    - id: SC-02
      title: One grid, many depths
      rule: Overview, catalog, contract, and reading detail use the same twelve-column logic.
    - id: SC-03
      title: Visible provenance
      rule: Every generated chapter states the YAML contract and any linked long-form source.
    - id: SC-04
      title: Stable navigation
      rule: The three chapters and Swiss Code stay in the same order and position.
    - id: SC-05
      title: Explicit state
      rule: Active chapter, filters, uncertainty, applicability, and status cannot depend on color alone.
    - id: SC-06
      title: Reversible interaction
      rule: Drill-down, adaptation, and comparison preserve a path back to the prior state.
    - id: SC-07
      title: Responsive hierarchy
      rule: Mobile layouts stack the same semantic order rather than inventing a separate page.
    - id: SC-08
      title: YAML first
      rule: Routes, chapter order, tokens, structure, labels, and content bindings are edited in YAML and compiled.
  content_contract:
    canonical_files:
      - content/research-system.yaml
      - content/books.yaml
      - content/content.yaml
      - content/structure.yaml
    generated_outputs:
      - web/public/research/research-system.css
      - web/public/research/swiss-code/index.html
      - web/public/research/methods/index.html
      - web/public/research/methods/evidence-reading-workflow/index.html
      - web/public/research/methods/oracling/index.html
      - web/public/research/methods/oracling/reading-room/index.html
      - web/public/research/interfaces/index.html
    rule: Generated HTML and CSS are publication artifacts. Edit their YAML or linked source and recompile; do not author the generated files directly.
  evidence_citation_architecture:
    id: SC-EVIDENCE-001
    title: Evidence and Citation Architecture
    purpose: Keep discovery, private source material, reviewed evidence, versioned knowledge, and published prose distinct but traceable.
    method_route: /research/methods/evidence-reading-workflow/
    flow:
      - order: "01"
        name: Discover
        system: Safari
        rule: Capture the canonical source page and its identity; a saved tab is not yet evidence.
      - order: "02"
        name: Preserve and annotate
        system: Zotero
        rule: Keep metadata, lawful attachments, annotations, locators, and private reading notes together.
      - order: "03"
        name: Review and extract
        system: calyr.aí catalog
        rule: Convert selected annotations into atomic claims with evidence level, applicability, limitations, and source location.
      - order: "04"
        name: Version
        system: Git
        rule: Store reviewed YAML records, schemas, and prose; exclude credentials and normally exclude copyrighted full documents.
      - order: "05"
        name: Publish and verify
        system: calyr.aí
        rule: Build text from reviewed claims and verify that every externally checkable assertion resolves to supporting evidence.
    invariants:
      - A highlight is not automatically a reviewed claim.
      - A paraphrase and a verbatim excerpt remain distinguishable.
      - Every published claim retains portable source identity and an exact locator.
      - AI may retrieve, compare, and draft; it may not invent evidence or silently upgrade interpretation into fact.
      - Private attachments, credentials, and the Zotero database never enter the public repository.
  swiss_design_reading:
    id: SC-READING-001
    title: Swiss Design Reading Room
    purpose: Read the history, grid logic, typography, and contemporary application behind the calyr.aí Swiss Code.
    copyright_rule: Link to canonical sources and publish only short editorial descriptions; never mirror third-party articles.
    sources:
      - id: SD-001
        title: Swiss Design — history, principles and lasting influence
        publisher: Studio Flach
        focus: Overview
        url: https://www.studioflach.com/journal/swiss-design-a-deep-dive-into-its-history-principles-and-lasting-influence
        note: A broad visual introduction to the movement and its continuing influence.
      - id: SD-002
        title: Swiss Style forever
        publisher: Presence Switzerland
        focus: History
        url: https://www.aboutswitzerland.eda.admin.ch/en/swiss-style-forever-the-story-of-a-graphic-design-tradition
        note: Official Swiss context for the schools, designers, educational tradition, and international legacy.
      - id: SD-003
        title: The International Style 1950–1970
        publisher: Swiss National Library
        focus: Archive
        url: https://www.nb.admin.ch/en/the-international-style-1950-1970
        note: Archival orientation around grids, sans-serif typography, geometry, photography, and Armin Hofmann.
      - id: SD-004
        title: The New Typography
        publisher: MoMA
        focus: Origins
        url: https://www.moma.org/calendar/exhibitions/1013
        note: The Central European avant-garde and Jan Tschichold as essential precursors to Swiss typography.
      - id: SD-005
        title: Typography and the Poster
        publisher: MoMA
        focus: Posters
        url: https://www.moma.org/calendar/exhibitions/443
        note: A collection-led path through typographic poster history and designers including Ernst Keller.
      - id: SD-006
        title: The Swiss International Style and the Grid That Ate Design
        publisher: Posters.org
        focus: Grid
        url: https://posters.org/the-swiss-international-style-and-the-grid-that-ate-design/
        note: A focused reading on grid systems and the legacy of Josef Müller-Brockmann.
      - id: SD-007
        title: Josef Müller-Brockmann — grid systems and Tonhalle posters
        publisher: The Graphic Design School
        focus: Designer
        url: https://www.thegraphicdesignschool.com/design-history/joseph-mueller-brockmann/
        note: Connects a central designer, concrete poster work, and systematic grid practice.
      - id: SD-008
        title: International Typographic Style and modern UX
        publisher: LogRocket
        focus: Digital practice
        url: https://blog.logrocket.com/ux-design/history-international-typographic-style/
        note: A bridge from historical principles to present-day interface and web design.
  validation_gates:
    - YAML parses and cross-references resolve.
    - All three chapter routes and Swiss Code are present in the shared navigation.
    - Each page exposes its canonical YAML source.
    - Desktop and compact layouts retain the same semantic order.
    - Internal routes resolve without fallback.
    - Production build completes before publication.
