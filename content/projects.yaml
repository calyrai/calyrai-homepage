# Canonical project source. Generated interfaces must not duplicate this content.
brix:
  title: BRIX
  tile_lead: surrogate product design
  tile_accent: cyan
  tile_title: surrogate model product design
  tile_summary: turn simulation, measurement, constraints, and uncertainty into faster product-design decisions
  subtitle: Surrogate-assisted product design
  summary: Explore and validate manufacturable product variants with interpretable surrogate models.
  body: BRIX couples simulation and measurement data with fast, uncertainty-aware surrogate models. It makes design spaces interactive, exposes trade-offs and constraints, ranks candidate variants, and carries promising concepts through validation into an engineered product decision.
  icon: bridge
  route: /research/platforms/brix/index.html
  render:
    grid_span: 4
aflowtex:
  title: vascular application
  tile_lead: aflowtex
  tile_accent: red
  tile_title: vascular application
  tile_summary: simulation, measurement, and interpretation become one patient-specific product
  subtitle: Integrated vascular intelligence
  summary: 'A high-level application that combines different models into one patient-specific vascular
    product.

    '
  body: 'AFLOWTEX integrates clinical measurements, vascular geometry, flow simulation, surrogate models,
    uncertainty, interpretation, and adaptive interaction. The models remain distinct but operate together
    as one application.

    '
  icon: aorta
  route: /research/platforms/aflowtex/index.html
  render:
    grid_span: 4
bio_nanoparticles:
  title: bio nanoparticles
  tile_lead: molecular systems
  tile_accent: magenta
  tile_title: bio nanoparticles
  tile_summary: structure, interaction, and production as one interpretable system
  subtitle: Interpretable particle engineering
  summary: 'Biological nanoparticles engineered across structure, interaction, and production.

    '
  body: 'Local surface design, experimental characterization, purification behavior, and function become
    one traceable model.

    '
  icon: particle
  render:
    grid_span: 4
core_facility_studio:
  title: core facility studio
  tile_lead: research infrastructure
  tile_accent: blue
  tile_title: core facility architecture
  tile_summary: define, calculate, and explain KPIs from PPMS data across facilities, instruments, services,
    and workflows
  subtitle: Organisational intelligence for scientific infrastructure
  summary: Turn PPMS operational data into reproducible KPIs with visible formulas, filters, provenance,
    and data quality.
  body: 'PPMS already manages and catalogues facilities, instruments, services, and reports. The Core
    Facility KPI Studio adds a controlled analytical layer: robust PUMAPI, API2, or export adapters; a
    canonical event model; versioned KPI definitions; cross-facility comparison; and Swiss-design views
    for utilisation, availability, demand, training, throughput, maintenance, and finance.'
  icon: network
  render:
    grid_span: 4
qty_alphafold_oracle:
  title: QTY AlphaFold Oracle
  tile_lead: protein evidence
  tile_accent: green
  tile_title: quality, traceability, yield
  tile_summary: AlphaFold, PDB, UniProt, publications, datasets, and public code as one evidence network
  subtitle: Public protein-structure repository intelligence
  summary: Follow protein evidence from public structure models to experimental support, methods, code,
    and the next analysis.
  body: QTY AlphaFold Oracle regularly checks public repositories, resolves scientific identities and
    versions, and connects structures, publications, methods, datasets, and code with visible provenance
    and uncertainty.
  icon: particle
  render:
    grid_span: 4
biophysical_applications:
  title: biophysical applications
  tile_lead: experimental systems
  tile_accent: cyan
  tile_title: biophysical interpretation and inference
  tile_summary: hidden structure, interaction, and system state from experimental evidence
  subtitle: Biophysical intelligence
  summary: Interpretable surrogate models reconstruct latent biological and molecular behavior from indirect
    measurements.
  body: SPR, SAXS, and metabolic inference are concrete systems in this application field.
  icon: scatter
  route: /research/pythia/saxs/index.html
  render:
    grid_span: 4
pythia_saxs:
  title: SAXS System
  tile_lead: molecular assembly
  tile_accent: cyan
  tile_title: saxs
  tile_summary: structure from scattering profiles
  subtitle: Small-Angle Scattering Pythia
  summary: Reconstructing molecular assembly structure from small-angle X-ray scattering profiles.
  body: The SAXS Oracle applies PYTHIA structural inference to solution scattering data. It infers the
    hidden three-dimensional organization of macromolecular assemblies from one-dimensional scattering
    curves, combining physics-based constraints with probabilistic multi-scale reasoning.
  icon: scatter
  route: /research/pythia/saxs/index.html
  render:
    grid_span: 6
pythia_spr:
  title: SPR System
  tile_lead: molecular interaction
  tile_accent: magenta
  tile_title: spr
  tile_summary: binding kinetics from sensor response
  subtitle: Surface Plasmon Resonance intelligence
  summary: Inferring molecular binding kinetics, affinity, and uncertainty from SPR sensorgrams.
  body: The SPR application uses Pythia to transform experimental sensor responses into fast, validated
    estimates of interaction kinetics and affinity.
  icon: wave
  route: /research/platforms/pythia/index.html
  render:
    grid_span: 6
pythia_metabolic:
  title: Metabolic System
  tile_lead: biological systems
  tile_accent: green
  tile_title: metabolic
  tile_summary: flux states and network topology
  subtitle: Metabolic Network Pythia
  summary: Inferring metabolic flux states and network topology from experimental constraints.
  body: The Metabolic Oracle applies PYTHIA to biochemical network reconstruction. It integrates stoichiometric
    constraints, thermodynamic feasibility, and experimental observations to infer the most plausible
    flux organization of a living cell under given conditions.
  icon: network
  route: /research/pythia/metabolic/index.html
  render:
    grid_span: 6
