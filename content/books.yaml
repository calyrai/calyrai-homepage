platform_books:
  section:
    id: platform_books
    title: Platform Books
    description: Book-rooted explanation pages for each core platform. Platform tiles act as entry links into these pages, with Pythia as the Compass interface layer.
  items:
    - id: platform-core
      platform_id: core
      type: platform-book
      title: calyr.aí core foundations
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - reasoning
        - architecture
        - compiler
      objective: Explain the central reasoning architecture and why it anchors the platform family.
      summary: Core links observations, knowledge structures, workflows, and decision support in one reasoning loop.
      canonical_claim: Core compiles semantic research context into decision-ready structures across tools and outputs.
      source:
        path: ../calyrai-perspectives-pack/docs/positioning.html
      sections:
        - id: scope
          title: Scope
          bullets:
            - Semantic object model for research entities and relations
            - Unified reasoning context across modules
            - Traceable transitions from evidence to decision
        - id: mechanism
          title: Mechanism
          columns:
            -
              - Knowledge ingest
              - Structured representation
              - Reasoning graph update
            -
              - Scenario evaluation
              - Recommendation surfaces
              - Explainable output packaging
    - id: platform-brix
      platform_id: brix
      type: platform-book
      title: Brix Engineering Intelligence
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - engineering
        - surrogate-models
        - simulation
      objective: Document how surrogate-assisted engineering decisions are modeled and operationalized.
      summary: Brix compresses expensive simulation space into faster, uncertainty-aware design exploration.
      canonical_claim: Engineering decisions become faster and more robust when surrogate spaces are coupled to semantic constraints.
      surrogate_markdown: content/brix-surrogates.md
      surrogate_applications:
        - id: stampform
          title: STAMPFORM
          domain: Fabrication
          accent: green
          flow: [Parameter input, Surrogate model, Stamp geometry, Process simulation, Result, Validation]
          functions:
            - {name: normalize_process_parameters, role: Validate units, ranges, material state, and contact program.}
            - {name: evaluate_stamp_surrogate, role: Predict transfer behavior and feasible process regions.}
            - {name: generate_stamp_geometry, role: Convert target structure and constraints into manufacturable stamp geometry.}
            - {name: simulate_stamp_process, role: Estimate contact, filling, release, and fixation response.}
            - {name: assemble_manufacturing_result, role: Package geometry, settings, confidence, and warnings.}
            - {name: validate_stamp_prediction, role: Compare predicted morphology with measured coupon geometry and repeatability.}
          inputs: [Material rheology, Stamp geometry constraints, Pressure and contact program]
          outputs: [Manufacturing geometry, Process window, Predicted structure quality]
          method: Constraint-aware surrogate of contact, transfer, pull-off, and fixation.
          uncertainty: Prediction intervals across material and process variation.
          validation: Compare predicted and measured feature geometry, fidelity, and repeatability.
          evidence: Simulation records and physical coupon measurements with traceable process metadata.
          maturity: Concept
          disclosure: Public architecture; exact rheology parameters, tolerances, and optimization heuristics protected.
          license: Original surrogate code — Apache-2.0
        - id: oil
          title: Oil Print
          domain: Fabrication
          accent: orange
          flow: [Image input, Surrogate model, Pigments and heights, Print simulation, Image body, Validation]
          functions:
            - {name: parse_material_image, role: Convert the source image into color, transparency, relief, and texture targets.}
            - {name: predict_printability, role: Estimate feasible pigment-media transfer under process constraints.}
            - {name: formulate_pigment_height_map, role: Assign premixed pigment recipes and material heights directly without conventional color separation.}
            - {name: simulate_layer_transfer, role: Predict registration, spreading, curing, and optical interaction.}
            - {name: compose_image_body, role: Generate the ordered template or stamp manufacturing plan.}
            - {name: validate_oil_print, role: Evaluate spectral error, relief, adhesion, registration, and aging.}
          inputs: [Source image or material field, Premixed pigment recipes, Relief and optical constraints]
          outputs: [Layer or stamp plan, Pigment deposition map, Predicted optical and relief response]
          method: Direct deposition of premixed pigment media with stamped or templated material transfer.
          uncertainty: Color, transparency, layer-height, curing, and registration tolerances.
          validation: Spectral color error, relief profilometry, registration, adhesion, and aging tests.
          evidence: Pigment recipes, process logs, optical measurements, and physical print coupons.
          maturity: Concept
          disclosure: Public process architecture; exact media formulation and transfer parameters protected.
          license: Original surrogate code — Apache-2.0
        - id: chrom
          title: ChromStamp
          domain: Bioengineering
          accent: cyan
          flow: [Separation target, Surrogate model, Flow geometry, Binding simulation, Cartridge design, Validation]
          functions:
            - {name: define_separation_target, role: Formalize protein, impurity, recovery, purity, and operating constraints.}
            - {name: evaluate_chromatography_surrogate, role: Predict separation performance across candidate structures and conditions.}
            - {name: generate_flow_geometry, role: Create designed channels, active surfaces, and transport zones.}
            - {name: simulate_binding_transport, role: Resolve convection, diffusion, binding, pressure drop, and fouling indicators.}
            - {name: compile_cartridge_design, role: Produce a manufacturable cartridge and operating window.}
            - {name: validate_chromstamp, role: Compare residence time, binding capacity, recovery, purity, and pressure drop.}
          inputs: [Protein and impurity profile, Buffer and operating window, Ligand and surface constraints]
          outputs: [Structured stationary-phase geometry, Operating window, Predicted separation performance]
          method: Designed flow paths and functional surface zones replace an exclusively random packed bed.
          uncertainty: Binding, mass-transfer, pressure-drop, fouling, and fabrication variability.
          validation: Residence-time distribution, pressure drop, dynamic binding capacity, recovery, and purity.
          evidence: Protein chromatography runs, surface characterization, and geometry-resolved simulations.
          maturity: Research concept
          disclosure: Public algorithm stages; ligand recipes, geometries, and operating thresholds protected pending IP review.
          license: Original surrogate code — Apache-2.0
        - id: aorta
          title: Aorta
          domain: Bioengineering
          accent: red
          flow: [Vessel data, Surrogate model, Flow and wall, Material gradient, Aorta design, Validation]
          functions:
            - {name: prepare_vessel_case, role: Register geometry, mesh assumptions, material data, and boundary conditions.}
            - {name: evaluate_aorta_surrogate, role: Predict coupled hemodynamic and wall-mechanical response with confidence bounds.}
            - {name: solve_flow_wall_state, role: Compute flow, pressure, deformation, shear, and stress fields.}
            - {name: optimize_material_gradient, role: Map target mechanics to a spatially graded vessel material design.}
            - {name: assemble_aorta_design, role: Package geometry, material field, risk indicators, and fabrication specification.}
            - {name: validate_aorta_model, role: Compare simulation with flow-loop, pressure, deformation, and imaging measurements.}
          inputs: [Patient or reference vessel geometry, Flow and pressure boundary conditions, Wall and material properties]
          outputs: [Flow and wall fields, Risk-relevant indicators, Testable graded vessel design]
          method: Coupled geometry, hemodynamics, wall mechanics, and material-gradient surrogate.
          uncertainty: Propagate imaging, boundary-condition, constitutive-model, and surrogate uncertainty.
          validation: Compare against flow-loop, pressure, deformation, and imaging measurements.
          evidence: Versioned geometries, boundary conditions, simulation cases, and experimental measurements.
          maturity: Prototype architecture
          disclosure: Public scientific workflow; calibrated coefficients, clinical thresholds, and patient data protected.
          license: Original surrogate code — Apache-2.0
        - id: nano
          title: Nano Particle Surfaces
          domain: Materials
          accent: violet
          upstream: [Oracle evidence graph, Cryo-EM application, SAXS application]
          flow: [Oracle evidence package, Cryo-EM map and particle morphology, SAXS curve and ensemble constraints, Cross-modal registration, Multiscale surrogate, Particle and surface pattern, Interface simulation, Surface recipe, Validation]
          functions:
            - {name: load_oracle_multimodal_evidence, role: Resolve Cryo-EM and SAXS records, identifiers, permissions, versions, and lineage.}
            - {name: extract_cryoem_particle_morphology, role: Derive local shape, size, surface, and structural features with resolution-aware uncertainty.}
            - {name: extract_saxs_ensemble_constraints, role: Derive ensemble size, distribution, and structural constraints from the registered SAXS analysis.}
            - {name: register_cryoem_saxs_modalities, role: Align local Cryo-EM morphology with ensemble SAXS evidence and quantify disagreement.}
            - {name: evaluate_nanoparticle_surrogate, role: Predict surface function from the fused particle representation and process variables.}
            - {name: generate_particle_surface_pattern, role: Convert target function and constraints into a spatial particle and coating pattern.}
            - {name: simulate_particle_interface, role: Predict interfacial transport, adhesion, wetting, optical, or application-specific response.}
            - {name: compile_nanoparticle_surface_recipe, role: Package pattern, chemistry, process window, confidence, and fabrication instructions.}
            - {name: validate_nanoparticle_surface, role: Cross-check both structural modalities and compare predicted function with physical measurements.}
          inputs: [Oracle-governed Cryo-EM maps and metadata, Oracle-governed SAXS curves and uncertainty, Target interfacial effect, Particle descriptors, Substrate and coating chemistry]
          outputs: [Cross-modal particle representation, Spatial particle pattern, Surface recipe, Predicted interface response]
          method: Fuse local Cryo-EM morphology with ensemble-scale SAXS constraints, then connect particle distribution, density, topography, coating, and chemistry to surface function.
          uncertainty: Propagate Cryo-EM resolution and segmentation uncertainty, SAXS measurement and model ambiguity, registration error, particle variation, and surrogate model-form uncertainty.
          validation: Cross-check Cryo-EM-derived morphology against SAXS-derived ensemble constraints, then test microscopy, spectroscopy, wettability, adhesion, and application-specific performance.
          evidence: Every Cryo-EM map, SAXS curve, transformation, model version, and fabrication batch is registered through Oracle provenance records.
          maturity: Concept
          disclosure: Public parameter classes; exact formulations, surface treatments, and target recipes protected.
          license: Original surrogate code — Apache-2.0
        - id: doe-bmca
          title: DOE · BMCA
          domain: Computational
          accent: magenta
          flow: [Factors and responses, Surrogate model, Design space, DOE selection, Prediction, Validation]
          functions:
            - {name: define_factors_responses, role: Validate factors, units, ranges, responses, acceptance criteria, and experimental constraints.}
            - {name: fit_doe_surrogate, role: Estimate main effects, interactions, nonlinear response, and predictive uncertainty.}
            - {name: construct_feasible_design_space, role: Apply physical, statistical, operational, and BMCA-relevant constraints.}
            - {name: select_next_experiments, role: Rank informative and feasible experiments using the declared acquisition strategy.}
            - {name: predict_operating_region, role: Produce response surfaces, trade-offs, confidence, and ranked candidate regions.}
            - {name: validate_doe_model, role: Run residual diagnostics, held-out checks, confirmation experiments, and acceptance tests.}
          inputs: [Factors and ranges, Responses and acceptance criteria, Constraints and prior evidence]
          outputs: [Experiment set, Effect and interaction estimates, Ranked operating region]
          method: Sequential design of experiments with surrogate-assisted candidate selection for BMCA-relevant methods.
          uncertainty: Experimental noise, parameter uncertainty, interaction ambiguity, and extrapolation distance.
          validation: Held-out runs, residual diagnostics, confirmation experiments, and predefined acceptance criteria.
          evidence: Immutable design matrix, raw observations, model diagnostics, and decision record.
          maturity: Prototype architecture
          disclosure: Public statistical contract; customer data, selection weights, and tuned thresholds protected.
          license: Original surrogate code — Apache-2.0
        - id: alphafold
          title: AlphaFold
          domain: Computational
          accent: blue
          upstream: [Oracle evidence graph, QTY design layer, Google AlphaFold service]
          flow: [Oracle protein record, Sequence and entity resolution, QTY transformation hypothesis, External-service consent and licence gate, Google AlphaFold service request, Model and database version lock, Structure and complex inference, Confidence and interface metrics, Uncertain-region classification, SAXS surrogate comparison, Experimental decision gate, Oracle evidence registration]
          functions:
            - {name: load_oracle_protein_record, role: Resolve the governed protein identity and its evidence links.}
            - {name: normalize_sequence_entities, role: Resolve chains, ligands, modifications, identifiers, and construct boundaries.}
            - {name: generate_qty_hypothesis, role: Represent the QTY transformation as an explicit design hypothesis rather than established evidence.}
            - {name: verify_external_service_gate, role: Confirm consent, data classification, licence, and allowed external processing before transfer.}
            - {name: submit_google_alphafold_request, role: Send only the approved molecular specification to the configured Google AlphaFold service.}
            - {name: lock_model_database_versions, role: Record service, model, database, parameters, and request identifiers.}
            - {name: receive_structure_inference, role: Collect predicted structures, complexes, ligands, and alternate candidates.}
            - {name: extract_confidence_interfaces, role: Map confidence and interface metrics to residues, domains, chains, and contacts.}
            - {name: classify_uncertain_regions, role: Flag disorder, ambiguity, weak interfaces, and unsupported conformations.}
            - {name: compare_saxs_surrogate, role: Compare predicted candidates with the Oracle-governed SAXS surrogate and its uncertainty.}
            - {name: decide_experimental_followup, role: Select acceptance, revision, SAXS, Cryo-EM, or another experimental follow-up.}
            - {name: register_alphafold_evidence, role: Return the decision, provenance, confidence, and external-service record to Oracle.}
          inputs: [Oracle protein record, Sequence and entity definition, QTY hypothesis, Approved external-service request, Available SAXS evidence]
          outputs: [Structure candidates, Confidence and interface map, SAXS comparison, Experiment and decision recommendations]
          method: Provenance-aware QTY and AlphaFold decision workflow with an explicit Google-service boundary and SAXS surrogate validation.
          uncertainty: Preserve confidence scores and flag disordered, ambiguous, or unsupported regions.
          validation: Compare predictions with SAXS and other available structural evidence.
          evidence: Input identity, model version, confidence metrics, comparisons, and human decision record.
          maturity: Integration design
          disclosure: Workflow is public; model weights, databases, and third-party assets remain under their own terms.
          license: Surrogate code — Apache-2.0; AlphaFold assets retain their official licenses and terms
        - id: saxs
          title: SAXS
          domain: Computational
          accent: yellow
          upstream: [Oracle evidence graph]
          flow: [Oracle SAXS evidence package, QTY and AlphaFold candidate set, Curve correction and quality control, SAXS feature extraction, Training and calibration set, SAXS surrogate model, Calibrated structural prediction, Candidate ranking and residuals, Experimental feedback loop, Oracle result registration]
          functions:
            - {name: load_oracle_saxs_evidence, role: Resolve curves, metadata, permissions, uncertainty, and provenance links.}
            - {name: assemble_structure_candidates, role: Join QTY hypotheses and AlphaFold candidates to the SAXS case.}
            - {name: correct_and_validate_curves, role: Apply background correction and quality gates before model use.}
            - {name: extract_saxs_features, role: Derive curve, Guinier, pair-distribution, shape, and residual descriptors.}
            - {name: assemble_surrogate_dataset, role: Build the versioned training and calibration set from simulations and experiments.}
            - {name: fit_saxs_surrogate, role: Learn the mapping between structural hypotheses, SAXS features, and response descriptors.}
            - {name: predict_with_calibrated_uncertainty, role: Return structural-response predictions with applicability and uncertainty.}
            - {name: rank_structure_candidates, role: Compare candidates using predicted curves, residual patterns, and confidence.}
            - {name: update_from_experiment, role: Feed new SAXS or orthogonal measurements back into calibration and validation.}
            - {name: register_saxs_surrogate_result, role: Return predictions, diagnostics, model version, and lineage to Oracle.}
          inputs: [Oracle-governed SAXS curves, QTY and AlphaFold candidates, Simulated curves, Calibration and validation measurements]
          outputs: [SAXS surrogate prediction, Applicability and uncertainty, Ranked structural candidates, Experimental next step]
          method: Oracle-governed surrogate modelling that learns from SAXS curves, structural hypotheses, simulations, and experimental feedback.
          uncertainty: Measurement errors, subtraction sensitivity, fit ranges, regularization, and model ambiguity.
          validation: Automated quality gates, residual diagnostics, replicate agreement, and orthogonal evidence.
          evidence: Raw and processed curves, metadata, parameter choices, software versions, and reports originate from and return to Oracle as linked provenance records.
          maturity: Prototype architecture
          disclosure: Public analytical workflow; private sample data and unpublished structures protected.
          license: Original surrogate code — Apache-2.0; third-party tools and data retain their licenses
        - id: matomic
          title: Matomic
          domain: Materials
          accent: pink
          flow: [Problem definition, Parameters and units, Matomic model, Boundary conditions, Simulation, Sensitivity, Prediction, Validation]
          functions:
            - {name: define_matomic_problem, role: Formalize the material system, target quantities, spatial scale, and validity domain.}
            - {name: normalize_matomic_parameters, role: Validate parameter identities, units, ranges, sources, and uncertainty.}
            - {name: assemble_matomic_model, role: Construct the selected material model and its declared constitutive relationships.}
            - {name: apply_boundary_initial_conditions, role: Bind explicit boundary and initial conditions to the computational domain.}
            - {name: solve_matomic_state, role: Execute the numerical model with convergence and stability monitoring.}
            - {name: analyze_matomic_sensitivity, role: Rank parameter influence and detect poorly identifiable or unstable regions.}
            - {name: generate_matomic_prediction, role: Return predicted states, confidence, assumptions, and validity limits.}
            - {name: validate_matomic_model, role: Compare benchmarks and experiments while recording numerical and model-form error.}
          inputs: [Material-system definition, Parameters with units, Boundary and initial conditions]
          outputs: [Simulation state, Sensitivity ranking, Prediction with validity domain]
          method: Unit-aware material model with explicit boundary conditions and surrogate acceleration.
          uncertainty: Parameter, boundary-condition, numerical, surrogate, and model-form uncertainty.
          validation: Benchmark cases, convergence checks, sensitivity tests, and experimental comparison.
          evidence: Versioned model definition, solver configuration, benchmarks, and validation datasets.
          maturity: Concept
          disclosure: Public algorithm contract; proprietary model data, fitted parameters, and concept IP protected.
          license: Surrogate code — Apache-2.0; concept IP and model data require explicit rights
      sections:
        - id: capability
          title: Capability
          bullets:
            - Design-space exploration at reduced cost
            - Constraint-aware surrogate ranking
            - Decision support under uncertainty bounds
        - id: outputs
          title: Output Forms
          columns:
            -
              - Candidate variants
              - Confidence intervals
              - Trade-off maps
            -
              - Engineering notes
              - Report snippets
              - Decision checkpoints
    - id: platform-aflowtex
      platform_id: aflowtex
      type: platform-book
      title: Aflowtex Medical Flow Intelligence
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - medicine
        - hemodynamics
        - patient-specific-modeling
      objective: Explain patient-specific flow analysis from data capture to uncertainty-aware recommendation.
      summary: Aflowtex aligns clinical data, vascular models, and flow simulation to support case decisions.
      canonical_claim: Clinical flow reasoning improves when simulation evidence is joined with explicit semantic case context.
      sections:
        - id: pipeline
          title: Pipeline
          bullets:
            - Clinical data harmonization
            - Case-specific geometric modeling
            - Flow simulation and surrogate projection
            - Recommendation and explainability output
        - id: decision-support
          title: Decision Support
          body: Aflowtex keeps assumptions explicit, supports scenario comparison, and surfaces uncertainty boundaries for clinicians.
    - id: platform-lithos
      platform_id: lithos
      type: platform-book
      title: Lithos — Science in Public
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - science in public
        - science communication
        - participatory systems
      objective: Create public forms in which scientific systems can be encountered, questioned, and discussed.
      summary: Lithos translates scientific data, models, and uncertainty into spatial, visual, and participatory public experiences.
      canonical_claim: Science becomes public when evidence can be encountered without losing its complexity.
      sections:
        - id: scientific-material
          title: Scientific Material
          bullets:
            - Measurements, simulations, and model states as source material
            - Provenance and uncertainty remain visible
            - Public repositories and research contexts stay connected
        - id: translation
          title: Artistic Translation
          bullets:
            - Installations and exhibition systems
            - Spatial data narratives and responsive media
            - Collaborations between artists, scientists, and institutions
        - id: public-interface
          title: Public Interface
          body: Lithos creates legible encounters rather than simplified explanations. Visitors can explore relationships, assumptions, and consequences through a clear, accessible interface.
        - id: strange-evidence
          title: Strange Evidence
          body: The experimental LITHOS format for exhibitions, public prototypes, and interventions. Strange Evidence puts data, models, uncertainty, and material form into productive tension.
          bullets:
            - Exhibition and installation series
            - Public experiments and urban interventions
            - Artist–scientist collaborations
            - Open documentation and critical reflection
        - id: process
          title: From Evidence to Encounter
          columns:
            -
              - 01 — Scientific question
              - 02 — Data and model
              - 03 — Curatorial translation
            -
              - 04 — Public prototype
              - 05 — Situated installation
              - 06 — Reflection and documentation
    - id: platform-oracle
      platform_id: oracle
      type: platform-book
      title: Oracle Knowledge Extraction Engine
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - knowledge-graphs
        - extraction
        - representation
      objective: Describe transformation from heterogeneous source material into structured knowledge assets.
      summary: Oracle converts complex technical and scientific corpora into graph-ready, queryable structures.
      canonical_claim: Extraction quality is highest when semantic model constraints are part of the transformation pipeline.
      sections:
        - id: extraction
          title: Extraction Layers
          columns:
            -
              - Entity and relation capture
              - Taxonomy alignment
              - Provenance binding
            -
              - Graph assembly
              - Query surfaces
              - Downstream module handoff
    - id: platform-pythia
      platform_id: pythia
      type: platform-book
      title: PYTHIA — Scientific Machine Learning
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - scientific-machine-learning
        - surrogate-models
        - interpretability
        - uncertainty
        - decision-support
      objective: Transform scientific questions into interpretable surrogate models, evidence, predictions, and defensible decisions.
      summary: A process-oriented scientific operating system connecting questions, knowledge, methods, evidence, prediction, and decision.
      canonical_claim: From scientific question to interpretable decision — with evidence and uncertainty visible at every step.
      ctas:
        - type: platform-page
          label: Open PYTHIA
          url: /research/platforms/pythia/index.html
          online: true
        - type: philosophy-context
          label: Open Philosophy context
          url: /philosophy
          online: true
        - type: upstream-oracle
          label: Open Oracle source layer
          url: /research/platforms/oracle/index.html
          online: true
      sections:
        - id: question
          title: Question
          body: Define the phenomenon, decision context, constraints, and measurable target before selecting a model.
          bullets: [Scientific objective and hypothesis, Decision boundary and constraints, Observable quantities and success criteria]
        - id: knowledge
          title: Knowledge
          body: Assemble domain structure, prior results, provenance, and physical constraints into a queryable context.
          bullets: [Literature and experimental context, Knowledge graphs and semantic relations, Assumptions priors and governing physics]
        - id: methods
          title: Methods
          body: Select an interpretable modeling strategy that matches the question, available evidence, and required fidelity.
          bullets: [Surrogate and reduced-order models, Physics-informed machine learning, Calibration and uncertainty quantification]
        - id: evidence
          title: Evidence
          body: Test the model against observations, simulations, and validation contracts while preserving provenance.
          bullets: [Training and validation evidence, Residuals sensitivity and failure modes, Traceable model and data lineage]
        - id: prediction
          title: Prediction
          body: Produce fast, uncertainty-aware estimates across the relevant parameter and design space.
          bullets: [Interpretable response surfaces, Confidence and extrapolation warnings, Interactive scenario exploration]
        - id: decision
          title: Decision
          body: Translate predictions into transparent options, trade-offs, and the next informative action.
          bullets: [Ranked options and consequences, Evidence-linked recommendations, Feedback into the next question]

method_catalog:
  route: /research/methods/
  title: calyr.aí method catalog
  summary: A growing collection of reusable scientific-AI, numerical, inference, validation, and closed-loop experimental method contracts, informed by Pythia and the generalizable ideas developed through Parvotec.
  label: Open the method catalog
  design_contract: docs/reactflow-swiss-design-contract.md
  design_rules: [strict grid, typographic hierarchy, restrained palette, clarity before ornament]
  resources:
    - id: CALYR-ROOM-ORACLE-001
      source: docs/oracling-reading-room.md
      route: /research/methods/oracling/reading-room/
      title: Oracling Reading Room
      summary: A curated reading path from calibrated prediction to constrained, multi-objective decisions and the next informative action.
      status: Living reading room
      eyebrow: calyr.aí reading room · 001
      chapter: oracling
  items:
    - id: CALYR-METHOD-EVIDENCE-WORKFLOW-001
      source: docs/evidence-reading-workflow.md
      route: /research/methods/evidence-reading-workflow/
      title: Evidence Reading Workflow
      summary: Capture sources in Safari, preserve them in Zotero, extract page-bound evidence, and publish curated claims to the calyr.aí knowledge catalog.
