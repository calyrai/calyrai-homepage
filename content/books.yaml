platform_books:
  section:
    id: platform_books
    title: Platform Books
    description: Book-rooted explanation pages for each core platform. Platform tiles act as entry links into these pages, with Pythia as the Compass interface layer.
  items:
    - id: platform-core
      platform_id: core
      type: platform-book
      title: calyr.aí core foundations
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - reasoning
        - architecture
        - compiler
      objective: Explain the central reasoning architecture and why it anchors the platform family.
      summary: Core links observations, knowledge structures, workflows, and decision support in one reasoning loop.
      canonical_claim: Core compiles semantic research context into decision-ready structures across tools and outputs.
      source:
        path: ../calyrai-perspectives-pack/docs/positioning.html
      sections:
        - id: scope
          title: Scope
          bullets:
            - Semantic object model for research entities and relations
            - Unified reasoning context across modules
            - Traceable transitions from evidence to decision
        - id: mechanism
          title: Mechanism
          columns:
            -
              - Knowledge ingest
              - Structured representation
              - Reasoning graph update
            -
              - Scenario evaluation
              - Recommendation surfaces
              - Explainable output packaging
    - id: platform-brix
      platform_id: brix
      type: platform-book
      title: Brix Engineering Intelligence
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - engineering
        - surrogate-models
        - simulation
      objective: Document how surrogate-assisted engineering decisions are modeled and operationalized.
      summary: Brix compresses expensive simulation space into faster, uncertainty-aware design exploration.
      canonical_claim: Engineering decisions become faster and more robust when surrogate spaces are coupled to semantic constraints.
      sections:
        - id: capability
          title: Capability
          bullets:
            - Design-space exploration at reduced cost
            - Constraint-aware surrogate ranking
            - Decision support under uncertainty bounds
        - id: outputs
          title: Output Forms
          columns:
            -
              - Candidate variants
              - Confidence intervals
              - Trade-off maps
            -
              - Engineering notes
              - Report snippets
              - Decision checkpoints
    - id: platform-aflowtex
      platform_id: aflowtex
      type: platform-book
      title: Aflowtex Medical Flow Intelligence
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - medicine
        - hemodynamics
        - patient-specific-modeling
      objective: Explain patient-specific flow analysis from data capture to uncertainty-aware recommendation.
      summary: Aflowtex aligns clinical data, vascular models, and flow simulation to support case decisions.
      canonical_claim: Clinical flow reasoning improves when simulation evidence is joined with explicit semantic case context.
      sections:
        - id: pipeline
          title: Pipeline
          bullets:
            - Clinical data harmonization
            - Case-specific geometric modeling
            - Flow simulation and surrogate projection
            - Recommendation and explainability output
        - id: decision-support
          title: Decision Support
          body: Aflowtex keeps assumptions explicit, supports scenario comparison, and surfaces uncertainty boundaries for clinicians.
    - id: platform-lithos
      platform_id: lithos
      type: platform-book
      title: Lithos Consequence Intelligence
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - consequences
        - risk
        - trade-offs
      objective: Frame consequence analysis as a first-class semantic reasoning task.
      summary: Lithos translates model outputs into impact pathways, risks, and option-level trade-offs.
      canonical_claim: Good decisions require consequence structure, not only predictions.
      sections:
        - id: reasoning-frame
          title: Reasoning Frame
          bullets:
            - Outcome pathways over time
            - Risk and downside articulation
            - Counterfactual option comparison
        - id: governance
          title: Governance Use
          body: Lithos supports transparent justification by connecting decision choices to explicit consequence narratives.
    - id: platform-oracle
      platform_id: oracle
      type: platform-book
      title: Oracle Knowledge Extraction Engine
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - knowledge-graphs
        - extraction
        - representation
      objective: Describe transformation from heterogeneous source material into structured knowledge assets.
      summary: Oracle converts complex technical and scientific corpora into graph-ready, queryable structures.
      canonical_claim: Extraction quality is highest when semantic model constraints are part of the transformation pipeline.
      sections:
        - id: extraction
          title: Extraction Layers
          columns:
            -
              - Entity and relation capture
              - Taxonomy alignment
              - Provenance binding
            -
              - Graph assembly
              - Query surfaces
              - Downstream module handoff
    - id: platform-pythia
      platform_id: pythia
      type: platform-book
      title: PYTHIA — Scientific Machine Learning
      year: 2026
      authors:
        - Tscheliessnig, Rupert
      tags:
        - scientific-machine-learning
        - surrogate-models
        - interpretability
        - uncertainty
        - decision-support
      objective: Transform scientific questions into interpretable surrogate models, evidence, predictions, and defensible decisions.
      summary: A process-oriented scientific operating system connecting questions, knowledge, methods, evidence, prediction, and decision.
      canonical_claim: From scientific question to interpretable decision — with evidence and uncertainty visible at every step.
      ctas:
        - type: platform-page
          label: Open PYTHIA
          url: /research/platforms/pythia/index.html
          online: true
        - type: philosophy-context
          label: Open Philosophy context
          url: /philosophy
          online: true
        - type: upstream-oracle
          label: Open Oracle source layer
          url: /research/platforms/oracle/index.html
          online: true
      sections:
        - id: question
          title: Question
          body: Define the phenomenon, decision context, constraints, and measurable target before selecting a model.
          bullets: [Scientific objective and hypothesis, Decision boundary and constraints, Observable quantities and success criteria]
        - id: knowledge
          title: Knowledge
          body: Assemble domain structure, prior results, provenance, and physical constraints into a queryable context.
          bullets: [Literature and experimental context, Knowledge graphs and semantic relations, Assumptions priors and governing physics]
        - id: methods
          title: Methods
          body: Select an interpretable modeling strategy that matches the question, available evidence, and required fidelity.
          bullets: [Surrogate and reduced-order models, Physics-informed machine learning, Calibration and uncertainty quantification]
        - id: evidence
          title: Evidence
          body: Test the model against observations, simulations, and validation contracts while preserving provenance.
          bullets: [Training and validation evidence, Residuals sensitivity and failure modes, Traceable model and data lineage]
        - id: prediction
          title: Prediction
          body: Produce fast, uncertainty-aware estimates across the relevant parameter and design space.
          bullets: [Interpretable response surfaces, Confidence and extrapolation warnings, Interactive scenario exploration]
        - id: decision
          title: Decision
          body: Translate predictions into transparent options, trade-offs, and the next informative action.
          bullets: [Ranked options and consequences, Evidence-linked recommendations, Feedback into the next question]

method_catalog:
  route: /research/methods/
  title: calyr.aí method catalog
  summary: A growing collection of reusable scientific-AI, numerical, inference, validation, and closed-loop experimental method contracts, informed by Pythia and the generalizable ideas developed through Parvotec.
  label: Open the method catalog
  design_contract: docs/reactflow-swiss-design-contract.md
  design_rules: [strict grid, typographic hierarchy, restrained palette, clarity before ornament]
  resources:
    - id: CALYR-ROOM-ORACLE-001
      source: docs/oracling-reading-room.md
      route: /research/methods/oracling/reading-room/
      title: Oracling Reading Room
      summary: A curated reading path from calibrated prediction to constrained, multi-objective decisions and the next informative action.
      status: Living reading room
      eyebrow: calyr.aí reading room · 001
      chapter: oracling
  items:
    - id: CALYR-METHOD-EVIDENCE-WORKFLOW-001
      source: docs/evidence-reading-workflow.md
      route: /research/methods/evidence-reading-workflow/
      title: Evidence Reading Workflow
      summary: Capture sources in Safari, preserve them in Zotero, extract page-bound evidence, and publish curated claims to the calyr.aí knowledge catalog.
      status: Working contract
      family: Research practice
      domains: [literature review, scientific writing, knowledge extraction]
      tags: [Safari, Zotero, annotations, citations, evidence graph, YAML]
    - id: CALYR-METHOD-NR-AI-001
      source: docs/scientific-ai-numerics-reference.md
      route: /research/methods/scientific-ai-numerics/
      title: Scientific AI and Numerical Methods
      summary: Trustworthy surrogate prediction through numerical baselines, uncertainty, applicability limits, and validation.
      status: Working contract
      family: Scientific AI
      domains: [SAXS, SPR, cryo-EM]
      tags: [numerics, surrogate prediction, probabilistic inference, validation]
    - id: CALYR-METHOD-REP-001
      title: Reproducible Baseline and Delta Analysis
      summary: Freeze sources, environments, datasets, metrics, and random states before extending a scientific baseline; explain every deviation from the reference result.
      status: Structure defined
      family: Reproducibility
      domains: [scientific software, model reproduction]
      tags: [source freeze, environment lock, baseline, delta analysis]
      informed_by: Parvotec Phase-I baseline-reproduction architecture
      boundary: Reusable method only; no Parvotec project data or results.
    - id: CALYR-METHOD-DATA-001
      title: Traceable Scientific Data and Reuse
      summary: Move observations through immutable raw, staging, curated, feature, and registry layers with ownership, source, license, version, checksum, schema, and quality status.
      status: Structure defined
      family: Data governance
      domains: [experimental data, scientific ML]
      tags: [provenance, integrity, dataset cards, reuse]
      informed_by: Parvotec data-rebuild and AAV catalog architecture
      boundary: Reusable method only; no Parvotec project data or results.
    - id: CALYR-METHOD-EVID-001
      title: Evidence Levels and Acceptance Gates
      summary: Separate hypothesis, reproduced baseline, retrospective validation, prospective validation, and repeated closed-loop evidence; attach an explicit gate to every claim and release.
      status: Structure defined
      family: Validation
      domains: [scientific claims, model lifecycle]
      tags: [evidence levels, acceptance gates, limitations, release criteria]
      informed_by: Parvotec evidence policy and Phase-I acceptance gates
      boundary: Reusable method only; no Parvotec project data or results.
    - id: CALYR-METHOD-LOOP-001
      title: Closed-Loop Experimental Learning
      summary: Connect constrained design, informative candidate selection, multi-modal observation, surrogate updates, experimental validation, and selection of the next batch.
      status: Structure defined
      family: Experimental learning
      domains: [design of experiments, active learning]
      tags: [closed loop, assay, acquisition policy, batch update]
      informed_by: Parvotec design-to-experiment-to-learning loop
      boundary: Reusable method only; no Parvotec project data or results.
    - id: CALYR-METHOD-ORACLE-001
      source: docs/oracling.md
      route: /research/methods/oracling/
      title: Oracling
      summary: Turn evidence, predictions, uncertainty, constraints, and trade-offs into traceable decision proposals and explicit next actions.
      status: Working contract
      family: Decision systems
      domains: [multi-objective design, oracle systems]
      tags: [trait models, constraints, diversity, Pareto ranking]
      chapter: oracling
    - id: CALYR-METHOD-GOV-001
      title: Reusable Method and Project-Result Boundary
      summary: Classify reusable platform methods, project-specific results, mixed artifacts, licenses, and approval requirements before knowledge moves between repositories or products.
      status: Structure defined
      family: Scientific governance
      domains: [IP, knowledge transfer]
      tags: [background methods, project results, classification, approval]
      informed_by: Parvotec and calyr.aí background/project-result boundary
      boundary: This contract defines the boundary; it does not transfer project assets.

interface_catalog:
  route: /research/interfaces/
  title: calyr.aí graphical interface catalog
  summary: A growing system of graphical interface contracts for scientific models, evidence, uncertainty, exploration, and decisions.
  eyebrow: graphical intelligence
  principles:
    - question before chart
    - evidence before decoration
    - uncertainty stays visible
    - overview and detail remain connected
    - every interaction has a reversible state
    - adaptation must preserve user control
  items:
    - id: CALYR-UI-OVERVIEW-001
      number: "01"
      title: Overview and Orientation
      family: Orientation
      status: Contract seed
      purpose: Establish what exists, what changed, what requires attention, and where the user can go next.
      inputs: system state, entities, alerts, provenance, time
      interactions: filter, focus, drill down, restore overview
      must_show: scope, freshness, missingness, active filters, provenance
      validation: A user can explain the current state and reach one relevant detail without losing context.
    - id: CALYR-UI-COMPARE-001
      number: "02"
      title: Comparison and Trade-offs
      family: Analytical comparison
      status: Contract seed
      purpose: Compare candidates, scenarios, models, or observations without hiding incompatible quantities or trade-offs.
      inputs: aligned entities, traits, units, uncertainty, reference state
      interactions: align, sort, normalize visibly, brush, pin, compare
      must_show: units, baseline, uncertainty, missing values, normalization
      validation: The same conclusion remains explainable when order, scale, and reference point change.
    - id: CALYR-UI-UNCERTAINTY-001
      number: "03"
      title: Uncertainty and Applicability
      family: Trust and limits
      status: Contract seed
      purpose: Show what a model predicts, how uncertain it is, and whether the request lies within supported evidence.
      inputs: distributions, intervals, calibration, applicability status, model version
      interactions: inspect interval, change confidence level, compare models, reveal support
      must_show: point estimate, interval, calibration context, in-domain status, limitations
      validation: Users distinguish prediction, uncertainty, applicability, and observed evidence without instruction.
    - id: CALYR-UI-GRAPH-001
      number: "04"
      title: Knowledge Graph and Provenance
      family: Relational exploration
      status: Contract seed
      purpose: Navigate entities, claims, evidence, and dependencies while preserving why each relationship exists.
      inputs: typed nodes, typed edges, source records, confidence, time
      interactions: expand, collapse, traverse, filter relation, inspect source, return to path
      must_show: relation type, direction, provenance, confidence, current path
      validation: A user can reconstruct a claim's evidence path and return to the original context.
    - id: CALYR-UI-SPATIAL-001
      number: "05"
      title: Spatial and Structural Viewer
      family: Geometry and structure
      status: Contract seed
      purpose: Connect measurements, simulation fields, annotations, and model outputs to physical or molecular structure.
      inputs: geometry, coordinates, fields, layers, annotations, scale
      interactions: rotate, slice, zoom, select, register, compare layers
      must_show: orientation, scale, coordinate frame, layer source, resolution
      validation: View manipulation cannot silently change the scientific meaning of the displayed quantity.
    - id: CALYR-UI-WORKFLOW-001
      number: "06"
      title: Experiment and Workflow
      family: Process control
      status: Contract seed
      purpose: Make the path from design through execution, evidence, validation, and update visible and controllable.
      inputs: steps, dependencies, artifacts, owners, gates, runtime state
      interactions: inspect step, compare runs, approve gate, retry, branch, annotate
      must_show: state, inputs, outputs, owner, version, failure, next gate
      validation: Every result can be traced to a reproducible run and every intervention is attributable.
    - id: CALYR-UI-ORACLE-001
      number: "07"
      title: Decision and Oracle
      family: Decision support
      status: Working contract
      purpose: Turn evidence, constraints, uncertainty, and trade-offs into traceable proposals without automating away judgment.
      inputs: traits, constraints, evidence levels, Pareto set, rationale, next action
      interactions: inspect reason, vary preference, compare frontier, defer, approve, request evidence
      must_show: hard failures, unknowns, trade-offs, sensitivity, evidence level, abstention
      validation: A reviewer can reproduce why a proposal is usable, blocked, or requires review.
      related_route: /research/methods/oracling/
      related_label: Open Oracling contract
    - id: CALYR-UI-ADAPTIVE-001
      number: "08"
      title: Adaptive Interface and LITHOS
      family: Adaptive composition
      status: Architecture seed
      purpose: Compose the interface around the active question, data, model, risk, and user role while preserving a stable interaction grammar.
      inputs: task contract, model schema, available evidence, user role, risk state
      interactions: reveal, recommend view, rearrange, explain adaptation, lock layout, reset
      must_show: why the interface changed, persistent state, available alternatives, reset path
      validation: Adaptation reduces task effort without hiding evidence, moving critical controls unexpectedly, or removing user agency.
      related_route: /research/platforms/lithos/
      related_label: Open LITHOS
  references:
    - title: The Eyes Have It — task by data type taxonomy
      author: Ben Shneiderman
      year: 1996
      url: https://ieeexplore.ieee.org/document/545307
      use: Overview first, zoom and filter, then details on demand.
    - title: A Nested Model for Visualization Design and Validation
      author: Tamara Munzner
      year: 2009
      url: https://doi.org/10.1109/TVCG.2009.111
      use: Validate domain problem, abstraction, encoding and interaction, and algorithm separately.
    - title: Design Study Methodology
      author: Sedlmair, Meyer, and Munzner
      year: 2012
      url: https://doi.org/10.1109/TVCG.2012.213
      use: Ground interface work in real tasks, evidence, and reflective validation.
    - title: D3 — Data-Driven Documents
      author: Bostock, Ogievetsky, and Heer
      year: 2011
      url: https://doi.org/10.1109/TVCG.2011.185
      use: Bind visible graphical state to data and explicit transformations.

