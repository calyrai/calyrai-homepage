    evidence: I build interpretable surrogate models that accelerate scientific prediction while keeping uncertainty, validity limits, and validation visible.
  - role: Computational biophysics
    evidence: I connect SAXS, Cryo-EM, AlphaFold/QTY, and physical simulation to test structural hypotheses against experimental evidence.
  - role: Research software & infrastructure
    evidence: I design governed research systems that connect data, provenance, HPC workflows, scientific analytics, and reviewable decisions.
  - role: Deep-tech systems
    evidence: I translate models into testable applications, manufacturing concepts, validation plans, and evidence-linked product decisions.
