<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>glabs.nexus.engines.alphafold.schematic - Calyr.ai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Schematic panel layout editor for the AlphaFold workflow interface." />

  <link rel="stylesheet" href="../../css/base.css?v=20260508-landing-font" />
  <link rel="stylesheet" href="../../css/nav.css?v=20260508-landing-font" />
  <link rel="stylesheet" href="../../css/glabs_os.css?v=20260516-node-style-r1" />
  <link rel="stylesheet" href="css/glabs_nexus_engines_alphafold_schematic.css?v=20260522-r1" />

  <script src="../../js/nav_autohide.js" defer></script>
  <script type="module" src="js/glabs_nexus_engines_alphafold_schematic.js?v=20260522-r1"></script>
</head>
<body class="af-schematic-page">
<header class="site-header">
  <div class="nav-inner">
    <a href="../../index.html" class="nav-brand">Calyr.a&iacute;</a>
    <nav class="nav-core" aria-label="Primary">
      <a href="../../explore.html" class="nav-pill">Explore</a>
      <a href="../../glabs_os.html" class="nav-pill active" aria-current="page">Nexus</a>
      <a href="../../docs.html" class="nav-pill">Docs</a>
      <a href="../../publications.html" class="nav-pill">Publications</a>
    </nav>
    <nav class="nav-secondary" aria-label="Secondary">
      <a href="glabs_nexus_engines_alphafold.html" class="nav-pill">Workflow</a>
      <a href="glabs_nexus_engines_alphafold_craft_designer.html" class="nav-pill">Designer</a>
      <a href="../../pages/contact.html" class="nav-pill">Contact</a>
    </nav>
  </div>
</header>

<main class="af-schematic-main">
  <section class="af-schematic-header">
    <h1>AlphaFold Panel Schematic</h1>
    <p>Drag panels into place. Everything snaps to the raster grid.</p>
  </section>

  <section class="af-schematic-grid">
    <aside class="af-schematic-controls">
      <div class="af-control-group">
        <label for="af-grid-size">Raster Size</label>
        <select id="af-grid-size">
          <option value="8">8 px</option>
          <option value="12">12 px</option>
          <option value="16" selected>16 px</option>
          <option value="20">20 px</option>
          <option value="24">24 px</option>
          <option value="32">32 px</option>
        </select>
      </div>

      <div class="af-control-group af-control-inline">
        <label><input type="checkbox" id="af-snap-toggle" checked /> Snap Enabled</label>
        <label><input type="checkbox" id="af-raster-toggle" checked /> Show Raster</label>
      </div>

      <div class="af-control-group af-filter-group">
        <span>Panel Filters</span>
        <div class="af-control-inline">
          <label><input type="checkbox" id="af-filter-core" checked /> Core</label>
          <label><input type="checkbox" id="af-filter-inspector" checked /> Inspector</label>
          <label><input type="checkbox" id="af-filter-floating" checked /> Floating</label>
          <label><input type="checkbox" id="af-detail-toggle" checked /> Fine Elements</label>
        </div>
      </div>

      <div class="af-control-group">
        <label for="af-layout-target">Raster Target Page</label>
        <input id="af-layout-target" type="text" value="../../index.html" spellcheck="false" />
        <div class="af-control-inline">
          <button id="af-target-homepage" type="button">Homepage</button>
          <button id="af-target-alphafold" type="button">AlphaFold</button>
        </div>
      </div>

      <div class="af-control-actions">
        <button id="af-load-present-layout" type="button">Load Full Page Layout</button>
        <button id="af-reset-layout" type="button">Reset Layout</button>
        <button id="af-copy-layout" type="button">Copy JSON</button>
        <button id="af-apply-layout" type="button">Apply JSON</button>
      </div>

      <div class="af-control-group">
        <label for="af-layout-json">Layout JSON</label>
        <textarea id="af-layout-json" spellcheck="false"></textarea>
      </div>

      <div id="af-layout-status" class="af-layout-status" aria-live="polite"></div>
    </aside>

    <section class="af-schematic-stage-wrap">
      <div class="af-schematic-stage-head">
        <span>Page Raster</span>
        <span id="af-stage-size"></span>
      </div>
      <div id="af-schematic-stage" class="af-schematic-stage" aria-label="Schematic panel canvas"></div>
      <div id="af-panel-list" class="af-panel-list"></div>
    </section>
  </section>
</main>
</body>
</html>
