<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaFold Split Button</title>
    <style>
        body {
            background: #08111a;
            margin: 0;
            padding: 60px 40px;
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1600px;
        }
        .title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ff00ff;
            margin-bottom: 60px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
        .split-button {
            display: flex;
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(255, 0, 255, 0.15);
            gap: 0;
        }
        .button-part {
            cursor: pointer;
            transition: all 380ms cubic-bezier(0.25, 0.1, 0.25, 1);
            border: 3px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0;
            font-weight: bold;
        }
        .button-canvas {
            flex: 0.62;
            border-color: #3bd6bf;
            background: rgba(59, 214, 191, 0.08);
        }
        .button-inspector {
            flex: 0.38;
            border-color: #ff00ff;
            background: rgba(255, 0, 255, 0.08);
        }
        .button-canvas:hover {
            background: rgba(59, 214, 191, 0.16);
            border-color: #7fd3ff;
        }
        .button-inspector:hover {
            background: rgba(255, 0, 255, 0.16);
            border-color: #ff00ff;
        }
        .button-canvas.active {
            flex: 1;
            background: rgba(59, 214, 191, 0.12);
        }
        .button-inspector.active {
            flex: 1;
            background: rgba(255, 0, 255, 0.12);
        }
        .visualization {
            display: flex;
            flex: 1;
            gap: 12px;
            align-items: flex-end;
            opacity: 0;
            transition: opacity 380ms ease;
            pointer-events: none;
        }
        .button-canvas.active .visualization,
        .button-inspector.active .visualization {
            opacity: 0;
        }
        .panel-box {
            flex: 1;
            border-radius: 6px;
            border: 2px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        .button-canvas .panel-box {
            border-color: #3bd6bf;
            color: #3bd6bf;
            background: rgba(59, 214, 191, 0.12);
        }
        .button-inspector .panel-box {
            border-color: #ff00ff;
            color: #ff00ff;
            background: rgba(255, 0, 255, 0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Split Button – Smooth Mode Transition</div>
        
        <div class="split-button">
            <div class="button-part button-canvas active" id="canvasBtn">
                <div class="visualization">
                    <div class="panel-box" style="flex: 0.62;">Canvas</div>
                    <div class="panel-box" style="flex: 0.38;">Inspector</div>
                </div>
            </div>
            
            <div class="button-part button-inspector" id="inspectorBtn">
                <div class="visualization">
                    <div class="panel-box" style="flex: 1;">Inspector</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvasBtn = document.getElementById('canvasBtn');
        const inspectorBtn = document.getElementById('inspectorBtn');

        canvasBtn.addEventListener('click', () => {
            canvasBtn.classList.add('active');
            inspectorBtn.classList.remove('active');
        });

        inspectorBtn.addEventListener('click', () => {
            inspectorBtn.classList.add('active');
            canvasBtn.classList.remove('active');
        });
    </script>
</body>
</html>
