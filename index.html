<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Braille Spline Icon System</title>

<style>
  :root {
    --bg: #030507;
    --card: rgba(255,255,255,0.025);
    --border: rgba(255,255,255,0.16);
    --dot-off: rgba(255,255,255,0.13);
    --dot-on: #ffffff;
    --text: rgba(255,255,255,0.78);
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #0a1118, var(--bg));
    font-family: Inter, system-ui, sans-serif;
    color: var(--text);
    display: grid;
    place-items: center;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 120px);
    gap: 18px;
    padding: 30px;
  }

  .icon-card {
    width: 120px;
    height: 120px;
    position: relative;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card);
    overflow: visible;
    cursor: pointer;
  }

  svg {
    width: 120px;
    height: 120px;
    overflow: visible;
  }

  .dot {
    fill: var(--dot-off);
    transition: 0.25s;
  }

  .spline {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    stroke-dasharray: 280;
    stroke-dashoffset: 280;
    transition: opacity 0.2s;
    filter: drop-shadow(0 0 8px currentColor);
  }

  .icon-card:hover .spline {
    opacity: 1;
    animation: draw 0.8s ease-out forwards;
  }

  .icon-card:hover .dot.active {
    fill: var(--dot-on);
    filter: drop-shadow(0 0 7px currentColor);
  }

  .label {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -22px;
    text-align: center;
    font-size: 12px;
    opacity: 0.75;
  }

  @keyframes draw {
    to {
      stroke-dashoffset: 0;
    }
  }
</style>
</head>

<body>

<div class="grid" id="iconGrid"></div>

<script>
const DOTS = [
  [30,25], [70,25],
  [30,50], [70,50],
  [30,75], [70,75]
];

const ICONS = [
  {
    name: "Mail",
    color: "#00e5ff",
    path: `
      M 20 25
      L 80 25
      L 80 75
      L 20 75
      Z
      M 20 30
      C 38 44, 45 56, 50 56
      C 55 56, 62 44, 80 30
    `
  },
  {
    name: "WhatsApp",
    color: "#25d366",
    path: `
      M 25 62
      C 18 42, 28 22, 50 22
      C 75 22, 86 42, 76 61
      C 67 78, 42 78, 31 71
      L 18 80
      C 21 73, 23 67, 25 62
    `
  },
  {
    name: "X",
    color: "#ffffff",
    path: `
      M 30 25
      C 42 38, 48 46, 50 50
      C 56 60, 62 70, 70 75
      M 70 25
      C 58 38, 52 46, 50 50
      C 44 60, 38 70, 30 75
    `
  },
  {
    name: "LinkedIn",
    color: "#1185fe",
    path: `
      M 30 50
      C 42 50, 42 38, 42 30
      C 42 25, 48 25, 70 25
      L 70 75
      C 58 75, 51 70, 43 72
      C 38 74, 34 75, 30 75
    `
  },
  {
    name: "Bluesky",
    color: "#00b7ff",
    path: `
      M 50 55
      C 32 20, 20 23, 22 45
      C 24 63, 38 62, 43 55
      C 29 68, 30 82, 43 78
      C 52 75, 51 62, 50 55

      M 50 55
      C 68 20, 80 23, 78 45
      C 76 63, 62 62, 57 55
      C 71 68, 70 82, 57 78
      C 48 75, 49 62, 50 55
    `
  },
  {
    name: "YouTube",
    color: "#ff3030",
    path: `
      M 25 30
      C 25 20, 40 20, 60 20
      C 75 20, 80 30, 80 50
      C 80 70, 75 80, 60 80
      C 40 80, 25 80, 25 70
      Z
      M 42 38
      L 42 62
      L 64 50
      Z
    `
  },
  {
    name: "Instagram",
    color: "#e1306c",
    path: `
      M 30 25
      C 45 15, 68 18, 76 32
      C 86 50, 78 75, 55 76
      C 31 77, 20 62, 22 45
      C 23 36, 25 29, 30 25
    `
  },
  {
    name: "Impressum",
    color: "#a855f7",
    path: `
      M 30 20
      L 65 20
      L 80 35
      L 80 80
      L 30 80
      Z
      M 65 20
      L 65 35
      L 80 35
    `
  }
];

function createIcon(icon) {
  const card = document.createElement("div");
  card.className = "icon-card";
  card.style.color = icon.color;

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 100 100");

  const dotsGroup = document.createElementNS(svgNS, "g");

  DOTS.forEach(([x, y]) => {
    const c = document.createElementNS(svgNS, "circle");
    c.setAttribute("cx", x);
    c.setAttribute("cy", y);
    c.setAttribute("r", 4.5);
    c.setAttribute("class", "dot active");
    dotsGroup.appendChild(c);
  });

  const path = document.createElementNS(svgNS, "path");
  path.setAttribute("d", icon.path);
  path.setAttribute("class", "spline");
  path.setAttribute("stroke", "currentColor");

  svg.appendChild(dotsGroup);
  svg.appendChild(path);

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = icon.name;

  card.appendChild(svg);
  card.appendChild(label);

  return card;
}

const grid = document.getElementById("iconGrid");
ICONS.forEach(icon => grid.appendChild(createIcon(icon)));
</script>

</body>
</html>
